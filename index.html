eceptors at the SA node are Gs-coupled, raise cAMP and increase rate and contractility. M2 receptors at the SA node are Gi-coupled, lower cAMP and decrease rate and conduction velocity. Clinical consequence: a beta1 agonist such as dobutamine given for cardiogenic shock will be opposed by anything increasing cholinergic tone, for example an AChE inhibitor.", "Example 3, bladder (2-3 marks): M3 receptors on the detrusor are Gq-coupled, raise Ca2+ and cause contraction promoting voiding; beta2/beta3 receptors relax the detrusor. At the internal sphincter the relationship reverses: alpha1 receptors contract the sphincter causing retention, while M3 relaxes it. Clinical consequence: an alpha1 agonist such as phenylephrine given to a patient with urinary retention will worsen the obstruction, and a muscarinic antagonist such as oxybutynin will block the detrusor contraction needed to void.", "Integration (1 mark): in each case the intended clinical effect depends on which receptor is dominant in that tissue, so predicting an adverse interaction requires knowing the receptor subtype, its location, and its coupling."], "note": ""}, {"title": "Drug Selectivity and Receptor Specificity (10 marks)", "marks": 10, "prompt": "Compare selective and non-selective agents acting on the autonomic nervous system. Explain, with examples, how selectivity determines both therapeutic use and adverse effect profile, and discuss the limits of selectivity.", "points": ["Principle (2 marks): most autonomic drug side effects are predictable extensions of the receptor's normal physiological action, occurring either in the target tissue at excessive dose or in non-target tissues expressing the same receptor. Non-selective agents act at more receptor subtypes and therefore in more tissues, so they produce a broader effect and a broader adverse effect profile.", "Adrenergic example (3 marks): propranolol is a non-selective beta antagonist. Beta1 blockade in the heart lowers rate and contractility, which is the therapeutic aim in hypertension, angina and arrhythmias. Beta2 blockade in the airway removes bronchodilator tone and can precipitate bronchospasm, and beta2 blockade also masks the tachycardia and tremor that warn of hypoglycaemia. Metoprolol and atenolol are beta1-selective, so they retain the cardiac benefit with a lower risk of bronchospasm and hypoglycaemia unawareness.", "Cholinergic example (3 marks): atropine is a non-selective muscarinic antagonist, so blocking M2 in the heart to treat bradycardia is inseparable from M3 blockade elsewhere, producing dry mouth, blurred vision, constipation and urinary retention. Ipratropium is delivered by inhalation so its action is largely confined to airway M3 receptors, which limits systemic anticholinergic effects. This shows selectivity can be achieved pharmacologically (subtype affinity) or pharmaceutically (route and delivery).", "Limits of selectivity (2 marks): selectivity is relative and dose-dependent, not absolute. A beta1-selective antagonist begins to block beta2 at higher doses, so a patient with airway disease is not fully protected. Pharmacogenomic variation adds a further limit: beta2-adrenergic receptor polymorphisms are associated with asthma severity and contribute to variability in response to beta receptor drugs, and polymorphisms in both alpha and beta receptor genes differ between populations. These can alter receptor expression, G-protein coupling and susceptibility to downregulation."], "note": ""}, {"title": "Dose-Response, Potency and Therapeutic Index (10 marks)", "marks": 10, "prompt": "a) Describe the shape of a dose-response curve and what each region represents (3) b) Define ED50 and explain its relationship to potency (2) c) Define therapeutic index and give the formula (2) d) Explain the clinical significance of a narrow therapeutic index (3)", "points": ["Dose-response curve (3 marks): plots the magnitude of drug effect against dose. There is an initial no-effect range at low dose, a range over which effect increases with increasing dose, and a plateau representing the maximum effect. Once the plateau is reached, further dose increases do not increase effect, although they may increase toxicity.", "ED50 (2 marks): the dose producing 50% of the maximum effect. It is the standard measure of potency: the lower the ED50, the more potent the drug, because less drug is required to produce the same effect. Potency is not the same as efficacy, which is the size of the maximum achievable effect.", "Therapeutic index (2 marks): the ratio of the toxic dose to the effective dose, TI = TD50 / ED50. A higher TI indicates a wider safety margin.", "Clinical significance of a narrow TI (3 marks): the toxic and effective dose ranges lie close together, so a small increase in dose or plasma concentration can produce toxicity. Such drugs require careful dose selection, therapeutic drug monitoring, and particular caution in patients with altered handling of the drug, such as the elderly, paediatric patients, and those with renal or hepatic impairment. A narrow TI does not mean a drug is unsuitable, only that it demands closer supervision."], "note": ""}], "case": [{"title": "Case 1 (10 marks) — Acute asthma, beta2-selective agonist", "marks": 10, "prompt": "Sarah L., 25, university student, has mild persistent asthma since childhood and uses a salbutamol inhaler as needed. She has no cardiovascular disease and is a non-smoker. She presents with acute shortness of breath and wheeze after smoke exposure. She has used her inhaler twice in the past hour with minimal relief. O2 saturation 92% on room air, HR 110 bpm, BP 120/75 mmHg. (a) Explain why her inhaler has given minimal relief. (b) State your therapeutic strategy and give the full mechanism of action. (c) Identify two drug classes with opposing actions. (d) Outline monitoring and follow-up.", "points": ["(a) Failure of the inhaler (2 marks): she is in an acute exacerbation with severe bronchospasm. Airway narrowing is pronounced enough that drug delivered from a metered dose inhaler does not reach the lower airways in sufficient quantity. Contributing factors include inhaler technique and smoke-induced mucosal swelling and inflammatory mediator release (histamine, leukotrienes), which add to the narrowing.", "(b) Strategy and mechanism (3-4 marks): nebulised salbutamol, which delivers a higher dose over a sustained period and is less dependent on patient technique. Mechanism: salbutamol is a beta2-selective agonist; it binds beta2 receptors on bronchial smooth muscle, activating Gs, which stimulates adenylyl cyclase to raise cAMP; this lowers intracellular Ca2+ and produces smooth muscle relaxation, giving rapid bronchodilation and reversal of bronchospasm.", "(c) Opposing actions (2 marks): muscarinic M3 agonists (e.g. bethanechol) cause bronchoconstriction via Gq, raising IP3/DAG and Ca2+ in bronchial smooth muscle. Non-selective beta blockers (e.g. propranolol) block beta2 receptors and reduce bronchodilation.", "(d) Monitoring and follow-up (2-3 marks): acutely monitor HR, BP, O2 saturation and symptom resolution over 15-30 minutes. Watch for beta2 agonist side effects: tremor, tachycardia and hypokalaemia at high or prolonged doses. Follow-up: review inhaler technique, update the asthma action plan, and advise trigger avoidance. Long term, consider maintenance therapy if exacerbations are frequent, since a beta2 agonist does not treat the underlying airway inflammation."], "note": ""}, {"title": "Case 2 (10 marks) — BPH, alpha1-selective antagonist", "marks": 10, "prompt": "James K., 68, retired builder. BPH diagnosed 3 years ago; hypertension controlled on an ACE inhibitor; no cardiac disease. He reports nocturia and difficulty initiating urination. BP 135/80 mmHg sitting, 115/70 mmHg standing, with dizziness on standing quickly. (a) Justify the choice of an alpha1-selective antagonist and give the mechanism. (b) Identify drugs with opposing actions. (c) Outline monitoring, counselling and follow-up.", "points": ["(a) Choice and mechanism (4 marks): the combination of obstructive urinary symptoms from BPH and coexisting hypertension makes an alpha1-selective antagonist such as prazosin appropriate, because one drug addresses both. Mechanism: prazosin blocks alpha1 receptors, preventing Gq activation, so phospholipase C activity falls, IP3 and DAG fall, intracellular Ca2+ falls, and smooth muscle relaxes. Relaxation of the bladder neck and prostatic smooth muscle relieves bladder outlet obstruction and improves urinary flow; relaxation of vascular smooth muscle lowers peripheral resistance and blood pressure.", "(b) Opposing actions (2 marks): alpha1 agonists (phenylephrine, midodrine) cause vasoconstriction and increase urinary sphincter tone, worsening BPH symptoms. Indirect sympathomimetics such as pseudoephedrine, common in over-the-counter cold preparations, also increase alpha1-mediated tone and should be avoided.", "(c) Monitoring and counselling (3-4 marks): measure BP sitting and standing and assess urinary symptom relief. Warn about first-dose hypotension, dizziness and headache. Advise taking the first dose at night and rising slowly from lying or sitting. Note that his existing postural drop makes him more vulnerable to this effect, and he is already on an ACE inhibitor, so the antihypertensive effects are additive. Long term, monitor renal function and BP and adjust dose as required."], "note": ""}, {"title": "Case 3 (10 marks) — Post-operative urinary retention, muscarinic agonist", "marks": 10, "prompt": "Margaret H., 72, retired nurse. Recent hip replacement, hypertension controlled with perindopril, osteoarthritis. No urine output for 10 hours post-surgery despite adequate hydration. Bladder scan 500 mL. BP 135/80 mmHg, HR 72 bpm, afebrile. (a) Interpret the presentation. (b) Give the drug, mechanism and rationale. (c) Identify opposing drug actions. (d) State monitoring requirements and contraindications.", "points": ["(a) Interpretation (2 marks): urinary retention. Vital signs are stable and she is afebrile, which argues against infection. Post-operative retention is common and usually reflects a temporary loss of bladder tone related to anaesthesia and post-operative immobility.", "(b) Drug and mechanism (3-4 marks): bethanechol, a direct muscarinic agonist acting at M3. It stimulates M3 receptors on detrusor smooth muscle, activating Gq, raising IP3 and DAG and therefore intracellular Ca2+, producing detrusor contraction. M3 activation also relaxes the trigone and internal sphincter, so voiding is promoted. Rationale: restores functional bladder emptying while tone recovers.", "(c) Opposing actions (2 marks): muscarinic antagonists (oxybutynin, atropine) block detrusor contraction and would worsen retention. alpha1 adrenergic agonists (phenylephrine) increase internal sphincter tone and also worsen retention.", "(d) Monitoring and contraindications (2-3 marks): check for urine output within one hour of administration. Watch for cholinergic side effects: bradycardia, diarrhoea and bronchospasm. Contraindicated in asthma, COPD, bradycardia, peptic ulcer disease, and obstruction of the urinary or GI tract. Treatment is short term and should be stopped once normal voiding resumes."], "note": ""}, {"title": "Case 4 (10 marks) — Overactive bladder, muscarinic antagonist", "marks": 10, "prompt": "Helen S., 58, accountant. Overactive bladder diagnosed 6 months ago, hypertension controlled with amlodipine, no history of glaucoma or myasthenia gravis. Urinary urgency and frequency every 1-2 hours interfering with work and sleep. No dysuria or haematuria; urinalysis normal. (a) Explain the pathophysiology and why the negative findings matter. (b) Give the drug, mechanism and rationale. (c) Identify opposing drug actions. (d) Outline monitoring and patient education.", "points": ["(a) Pathophysiology (2 marks): overactive bladder involves involuntary detrusor contractions during filling, reducing functional bladder capacity and generating urgency. Normal urinalysis with no dysuria or haematuria excludes infection as the cause. The absence of glaucoma and myasthenia gravis matters because both are relative contraindications to antimuscarinic therapy.", "(b) Drug and mechanism (3 marks): oxybutynin, a muscarinic M3 antagonist. It competitively blocks M3 receptors on detrusor smooth muscle, inhibiting the Gq pathway, so IP3 and DAG fall and intracellular Ca2+ falls, reducing involuntary detrusor contractions. Rationale: reduces bladder overactivity, increases bladder capacity and decreases urgency episodes.", "(c) Opposing actions (2 marks): muscarinic agonists (bethanechol) stimulate M3 receptors, increase bladder contraction and worsen symptoms. AChE inhibitors (pyridostigmine, donepezil) increase synaptic ACh and increase detrusor tone.", "(d) Monitoring and education (3 marks): short term, assess reduction in urgency and frequency after 2-4 weeks. Watch for anticholinergic side effects: dry mouth, constipation, blurred vision, tachycardia, and cognitive change in older patients. Long term, monitor total anticholinergic burden, which is associated with cognitive impairment and increased dementia risk, and review periodically. Educate the patient to hydrate cautiously, avoid overheating because sweating is reduced, and report visual changes or severe constipation."], "note": ""}, {"title": "Case 5 (10 marks) — Receptor selectivity and comorbidity", "marks": 10, "prompt": "A 68-year-old man with COPD and type 2 diabetes is started on propranolol, a non-selective beta antagonist, for hypertension. Explain why this choice is potentially problematic, referencing receptor selectivity, and suggest a safer alternative.", "points": ["Non-selective beta antagonists block both beta1 and beta2 receptors (1 mark).", "Blocking beta2 in airway smooth muscle removes bronchodilator tone, worsening bronchoconstriction and potentially precipitating a COPD exacerbation. It will also blunt the response to any beta2 agonist reliever the patient uses (3 marks).", "Beta blockade masks the tachycardia and tremor that normally warn a diabetic patient of hypoglycaemia, and non-selective agents also impair beta2-mediated glycogenolysis, so recovery from hypoglycaemia is slower (3 marks).", "A beta1-selective agent such as bisoprolol, metoprolol or atenolol is safer in airway disease, retaining the reduction in heart rate and contractility with less bronchoconstriction (2 marks).", "Caveat: beta1 selectivity is relative and dose-dependent, so beta2 blockade re-emerges at higher doses and the patient still needs monitoring (1 mark)."], "note": "Note on this question: an earlier version of this case listed glaucoma rather than diabetes as the comorbidity. That was incorrect. Beta blockers lower intraocular pressure and topical timolol is a standard glaucoma treatment, so glaucoma is not a reason to avoid a beta blocker. Diabetes is the comorbidity that makes non-selective beta blockade genuinely problematic here."}, {"title": "Case 6 (10 marks) — Anticholinergic effects of a non-selective antagonist", "marks": 10, "prompt": "A patient given a high dose of atropine (a muscarinic antagonist) for symptomatic bradycardia develops blurred vision, dry mouth, tachycardia and urinary retention. Explain each effect using receptor pharmacology.", "points": ["Atropine is a non-selective muscarinic antagonist, so it blocks M receptors throughout the body, not only the M2 receptors in the heart that are the therapeutic target (2 marks).", "Blurred vision: M3 blockade in the ciliary muscle and iris sphincter prevents accommodation and pupillary constriction, causing cycloplegia and mydriasis (2 marks).", "Dry mouth: M3 blockade in the salivary glands reduces watery secretion (2 marks).", "Tachycardia: M2 blockade at the sinoatrial node removes vagal restraint on heart rate, so sympathetic beta1 tone dominates and rate rises. This is the intended therapeutic effect, but at high dose it becomes excessive (2 marks).", "Urinary retention: M3 blockade in the detrusor prevents the contraction required for voiding (1 mark).", "All effects follow from systemic loss of parasympathetic tone, because atropine has no receptor subtype selectivity. Note also that inhibition of sweating (sympathetic cholinergic M3) risks overheating (1 mark)."], "note": ""}]}, {"n": 10, "title": "Ocular Pharmacology", "fc": [{"q": "Which receptor controls iris sphincter (miosis) vs iris radial muscle (mydriasis)?", "a": "M3 = miosis (sphincter); alpha1 = mydriasis (radial muscle)."}, {"q": "Which receptor controls the ciliary muscle, and what does its activation cause?", "a": "M3 - contraction, producing accommodation for near vision. This is the same receptor subtype (M3) as the iris sphincter, so M3 activation 'squeezes/constricts' throughout the eye."}, {"q": "Which receptor(s) control the ciliary epithelium, and what is unique about their role there?", "a": "beta1/beta2 receptors, which drive aqueous humour production. This is unusual for beta receptors, which elsewhere in the body control muscle relaxation or cardiac stimulation rather than fluid secretion."}, {"q": "How do beta-blockers (e.g. timolol) reduce intraocular pressure?", "a": "Block beta receptors on ciliary epithelium, decreasing cAMP, decreasing aqueous humour secretion."}, {"q": "How do prostaglandin analogues (e.g. latanoprost) reduce IOP, and how does this differ from beta-blockers?", "a": "Activate FP receptors, increasing uveoscleral outflow (vs beta-blockers which decrease inflow/production)."}, {"q": "What triggers histamine release in allergic conjunctivitis, and what does histamine do?", "a": "Allergen cross-links IgE on mast cells, causing degranulation; histamine acts on H1 receptors, causing itching, vasodilation (redness), swelling."}, {"q": "What are the two mechanisms of dual-action antihistamine/mast cell stabilisers?", "a": "(1) H1 receptor antagonism (fast relief), (2) mast cell stabilisation via decreased Ca2+ influx (preventive, slower)."}, {"q": "What does parasympathetic stimulation to the eye cause, and via which receptor?", "a": "Miosis - ACh at M3 contracts the iris sphincter. Mydriasis is sympathetic, via alpha1 on the radial muscle."}, {"q": "What is the underlying pathophysiology of dry eye disease?", "a": "Reduced tear production and/or increased tear evaporation lead to tear film instability and hyperosmolarity, which triggers ocular surface inflammation and the classic symptoms of grittiness, burning, and redness."}, {"q": "What class of drug increases tear production in dry eye, and how does it work?", "a": "Cholinergic agonists such as pilocarpine and cevimeline stimulate M3 receptors on the lacrimal glands, activating the phospholipase C / IP3 / Ca2+ pathway to increase secretion."}, {"q": "How do topical cyclosporine and lifitegrast work in dry eye disease?", "a": "Both reduce ocular surface inflammation. Cyclosporine inhibits calcineurin, blocking T-cell activation. Lifitegrast blocks the LFA-1/ICAM-1 interaction that recruits and activates T cells at the ocular surface."}, {"q": "How does the pharmacological approach to dry eye differ from allergic conjunctivitis?", "a": "Dry eye therapy targets tear production and chronic T-cell-mediated inflammation (cholinergic agonists, calcineurin inhibitors, lubricants). Allergic conjunctivitis therapy targets the acute IgE/mast-cell/histamine cascade (H1 antagonists and mast cell stabilisers)."}], "mcq": [{"q": "Which receptor mediates miosis (iris sphincter contraction)?", "opts": [{"k": "a", "t": "alpha1"}, {"k": "b", "t": "alpha2"}, {"k": "c", "t": "M3"}, {"k": "d", "t": "beta2"}, {"k": "e", "t": "5-HT3"}], "ans": "c", "ansText": "c) M3"}, {"q": "Timolol reduces intraocular pressure primarily by:", "opts": [{"k": "a", "t": "Increasing uveoscleral outflow"}, {"k": "b", "t": "Decreasing aqueous humour production"}, {"k": "c", "t": "Increasing trabecular drainage"}, {"k": "d", "t": "Inhibiting carbonic anhydrase"}, {"k": "e", "t": "Blocking M3 receptors"}], "ans": "b", "ansText": "b) Decreasing aqueous humour production"}, {"q": "The mechanism of dual-action antihistamines includes:", "opts": [{"k": "a", "t": "H1 antagonism only"}, {"k": "b", "t": "Mast cell stabilisation only"}, {"k": "c", "t": "H1 antagonism + mast cell stabilisation"}, {"k": "d", "t": "COX-1 inhibition"}, {"k": "e", "t": "beta2 blockade"}], "ans": "c", "ansText": "c) H1 antagonism + mast cell stabilisation"}, {"q": "Parasympathetic stimulation to the eye causes:", "opts": [{"k": "a", "t": "Mydriasis"}, {"k": "b", "t": "Miosis"}, {"k": "c", "t": "Cycloplegia"}, {"k": "d", "t": "Increased aqueous humour"}], "ans": "b", "ansText": "b) Miosis"}, {"q": "Pilocarpine relieves dry eye symptoms by:", "opts": [{"k": "a", "t": "Blocking M3 receptors"}, {"k": "b", "t": "Stimulating M3 receptors on the lacrimal gland"}, {"k": "c", "t": "Blocking H1 receptors"}, {"k": "d", "t": "Inhibiting T-cell activation"}, {"k": "e", "t": "Blocking beta receptors on the ciliary epithelium"}], "ans": "b", "ansText": "b) Stimulating M3 receptors on the lacrimal gland"}], "saq": [{"title": "Glaucoma Pharmacology (10 marks)", "marks": 10, "prompt": "Compare the mechanisms of action of three drug classes used to lower intraocular pressure (IOP) in glaucoma: beta-blockers, prostaglandin analogues, and carbonic anhydrase inhibitors. For each, state the target and whether it decreases aqueous humour production or increases outflow.", "points": ["beta-blockers (3 marks) - e.g. timolol: blocks beta1/beta2 receptors on the ciliary epithelium, decreasing adenylyl cyclase and cAMP, decreasing Na+/HCO3- secretion, decreasing aqueous humour PRODUCTION. Adverse effects: bradycardia and bronchospasm if absorbed systemically.", "Prostaglandin analogues (3 marks) - e.g. latanoprost: activates FP receptors on the ciliary muscle, causing relaxation and remodelling of the extracellular matrix, increasing uveoscleral OUTFLOW. Once-daily dosing, few systemic side effects; can cause iris pigmentation and eyelash growth.", "Carbonic anhydrase inhibitors (3 marks) - e.g. acetazolamide, dorzolamide: inhibit carbonic anhydrase in the ciliary epithelium, decreasing HCO3- formation, decreasing aqueous humour PRODUCTION. Systemic acetazolamide also reduces CSF production.", "Key difference (1 mark): beta-blockers and carbonic anhydrase inhibitors both reduce aqueous humour production (via different pathways), while prostaglandin analogues instead increase outflow - two strategies converging on the same outcome, lower IOP."], "note": ""}, {"title": "Allergic Conjunctivitis and Antihistamines (10 marks)", "marks": 10, "prompt": "Explain the pharmacological basis of allergic conjunctivitis and describe how dual-action antihistamine/mast cell stabiliser drugs relieve symptoms.", "points": ["Trigger (2 marks): an allergen cross-links IgE antibodies bound to conjunctival mast cells, triggering mast cell degranulation.", "Mediator release and H1 action (3 marks): degranulation releases histamine (along with tryptase, prostaglandins and leukotrienes). Histamine acts on H1 receptors on conjunctival nerve endings and blood vessels, producing itching, redness (vasodilation), swelling (increased vascular permeability), and tearing.", "Dual-action drugs - mechanism 1, H1 antagonism (2 marks): e.g. olopatadine blocks H1 receptors, directly preventing histamine's action, giving rapid relief of itching and redness.", "Dual-action drugs - mechanism 2, mast cell stabilisation (2 marks): reduces Ca2+ influx into mast cells, inhibiting further degranulation and mediator release, preventing or reducing the future allergic response. This effect is delayed relative to H1 blockade but longer-lasting.", "Net result (1 mark): combining both mechanisms gives fast symptomatic relief plus longer-term suppression of the allergic cascade - more effective than either mechanism alone."], "note": ""}], "case": []}, {"n": 11, "title": "Hypertension", "fc": [{"q": "Give the RAAS pathway from low BP to increased BP, including all four targets of angiotensin II.", "a": "Decreased BP/renal perfusion triggers renin release from the kidney, which converts angiotensinogen (liver) to angiotensin I, converted by ACE (lungs) to angiotensin II. Angiotensin II then acts on four targets: (1) vascular smooth muscle, causing vasoconstriction; (2) the adrenal cortex, releasing aldosterone and driving Na+/water retention; (3) the posterior pituitary, releasing ADH and promoting water retention; and (4) the kidney directly, increasing Na+ and water reabsorption. Net effect: increased blood volume and increased BP. RAAS is the long-term BP regulation system, unlike the fast-acting autonomic nervous system."}, {"q": "Which diuretic is best for acute pulmonary oedema, and why?", "a": "Furosemide (loop diuretic) - most potent, fast-acting."}, {"q": "Name the specific nephron site and transporter blocked by furosemide, hydrochlorothiazide, and spironolactone.", "a": "Furosemide: thick ascending limb of the loop of Henle, blocks the Na+/K+/2Cl- co-transporter (NKCC2). Hydrochlorothiazide: distal convoluted tubule, blocks the Na+/Cl- co-transporter (NCC). Spironolactone: collecting duct, blocks the aldosterone receptor, reducing Na+ retention."}, {"q": "Which diuretic spares potassium, and what is its mechanism?", "a": "Spironolactone - blocks the aldosterone receptor."}, {"q": "What is the major adverse effect of ACE inhibitors besides cough?", "a": "Hyperkalemia."}, {"q": "What is the mechanism of carbonic anhydrase inhibitors (CAIs), and what are their three clinical uses?", "a": "In the proximal convoluted tubule, carbonic anhydrase catalyses CO2 + H2O to H2CO3, which dissociates to H+ and HCO3-; HCO3- is normally reabsorbed, contributing to Na+ reabsorption. A CAI blocks this enzyme, so HCO3- is lost in the urine, less Na+ and water are reabsorbed, producing diuresis and alkaline urine. Three clinical uses: (1) Renal - mild diuresis, rarely first-line for oedema; (2) Ocular - the same enzyme in the ciliary epithelium is blocked, reducing aqueous humour formation, used in glaucoma; (3) CNS - reduces CSF production, used in idiopathic intracranial hypertension."}, {"q": "What causes endothelial dysfunction, and what's the downstream consequence?", "a": "Decreased NO bioavailability (plus increased endothelin) leads to sustained vasoconstriction, increased peripheral resistance, increased BP, and long-term atherosclerosis risk."}, {"q": "Define hypertension.", "a": "Persistently elevated arterial blood pressure, generally systolic at least 140 mmHg and/or diastolic at least 90 mmHg on repeated measurement (exact thresholds vary between guidelines)."}, {"q": "Why is hypertension significant as a cardiovascular risk factor?", "a": "Chronically elevated pressure damages the vascular endothelium and accelerates atherosclerosis, raising the risk of stroke, myocardial infarction, heart failure, chronic kidney disease, and retinopathy. It is often asymptomatic until a complication occurs."}, {"q": "List modifiable risk factors for hypertension.", "a": "High dietary salt intake, obesity, physical inactivity, excess alcohol consumption, smoking, chronic stress, and a poor diet."}, {"q": "List non-modifiable risk factors for hypertension.", "a": "Age, family history/genetic predisposition, ethnicity, and sex."}, {"q": "List potential complications of untreated hypertension.", "a": "Stroke, myocardial infarction, heart failure, chronic kidney disease, hypertensive retinopathy, and aortic aneurysm or dissection."}, {"q": "List lifestyle modifications recommended for managing hypertension.", "a": "Reducing dietary sodium, weight loss, regular aerobic exercise, limiting alcohol intake, smoking cessation, stress reduction, and a DASH-style diet."}], "mcq": [{"q": "Which drug class blocks the AT1 receptor?", "opts": [{"k": "a", "t": "ACE inhibitors"}, {"k": "b", "t": "ARBs"}, {"k": "c", "t": "Thiazide diuretics"}, {"k": "d", "t": "Beta-blockers"}, {"k": "e", "t": "Calcium channel blockers"}], "ans": "b", "ansText": "b) ARBs"}, {"q": "Which diuretic is most associated with potassium-sparing effects?", "opts": [{"k": "a", "t": "Furosemide"}, {"k": "b", "t": "Hydrochlorothiazide"}, {"k": "c", "t": "Spironolactone"}, {"k": "d", "t": "Mannitol"}, {"k": "e", "t": "Acetazolamide"}], "ans": "c", "ansText": "c) Spironolactone"}, {"q": "Endothelial dysfunction is primarily characterised by:", "opts": [{"k": "a", "t": "Excess nitric oxide"}, {"k": "b", "t": "Reduced NO bioavailability and increased endothelin"}, {"k": "c", "t": "Increased vasodilation"}, {"k": "d", "t": "Reduced peripheral resistance"}, {"k": "e", "t": "Increased cGMP"}], "ans": "b", "ansText": "b) Reduced NO bioavailability and increased endothelin"}, {"q": "Which mechanism leads to vasodilation and reduced blood pressure?", "opts": [{"k": "a", "t": "Increased endothelin activity"}, {"k": "b", "t": "Alpha-1 receptor activation"}, {"k": "c", "t": "Calcium channel blockade in smooth muscle"}, {"k": "d", "t": "Increased cardiac contractility"}], "ans": "c", "ansText": "c) Calcium channel blockade in smooth muscle"}, {"q": "Which of the following actions reduces blood pressure by decreasing peripheral vascular resistance?", "opts": [{"k": "a", "t": "Increased sympathetic outflow"}, {"k": "b", "t": "Vasodilation of arterioles"}, {"k": "c", "t": "Increased sodium reabsorption"}], "ans": "b", "ansText": "b) Vasodilation of arterioles"}], "saq": [{"title": "RAAS and Diuretics (10 marks)", "marks": 10, "prompt": "Outline the renin-angiotensin-aldosterone system (RAAS) pathway and describe how three classes of drugs (ACE inhibitors, ARBs, and diuretics) interfere with it, including one adverse effect for each.", "points": ["RAAS pathway (4 marks): decreased BP/renal perfusion causes the kidney to release renin, which converts angiotensinogen (liver) to angiotensin I, converted by ACE (lungs) to angiotensin II, which acts on (i) vascular smooth muscle causing vasoconstriction, (ii) adrenal cortex causing aldosterone release and Na+/H2O retention, (iii) posterior pituitary causing ADH release and water retention. Net effect: increased blood volume and increased BP.", "ACE inhibitors (2 marks) - e.g. enalapril: block ACE, decreasing angiotensin II formation, decreasing vasoconstriction/aldosterone. Adverse effect: dry cough, hyperkalemia.", "ARBs (2 marks) - e.g. losartan: block the AT1 receptor, preventing angiotensin II action directly (no effect on bradykinin, so less cough than ACE inhibitors).", "Diuretics (2 marks) - e.g. spironolactone (aldosterone receptor antagonist, K+-sparing, risk of hyperkalemia) or furosemide (loop diuretic, most potent, used in acute oedema, risk of hypokalemia)."], "note": ""}, {"title": "Endothelial Dysfunction in Hypertension (10 marks)", "marks": 10, "prompt": "a) Define endothelial dysfunction (1) b) State the normal vasodilatory role of nitric oxide (2) c) Explain what happens when NO production is impaired (2) d) Describe the role of endothelin (2) e) Relate endothelial dysfunction to increased peripheral resistance (2) f) List one long-term consequence for the cardiovascular system (1)", "points": ["Definition (1 mark): impaired ability of the vascular endothelium to regulate vascular tone, principally through reduced nitric oxide bioavailability, resulting in a shift away from normal vasodilation.", "Normal role of NO (2 marks): NO is produced by endothelial NO synthase from L-arginine and diffuses into adjacent vascular smooth muscle, where it activates guanylyl cyclase, raising cGMP, causing smooth muscle relaxation and vasodilation. It also inhibits platelet aggregation and leukocyte adhesion.", "Impaired NO production (2 marks): the balance shifts toward vasoconstriction, so vessels remain constricted. Loss of NO's protective actions also promotes platelet aggregation, leukocyte adhesion and vascular inflammation.", "Endothelin (2 marks): endothelin-1 is an endothelium-derived peptide and one of the most potent endogenous vasoconstrictors. It acts on ETA receptors on vascular smooth muscle to cause sustained contraction, and its production increases in endothelial dysfunction.", "Link to peripheral resistance (2 marks): less NO plus more endothelin means vessels stay constricted and the lumen narrows. Since resistance rises steeply as radius falls, total peripheral resistance increases, and because blood pressure equals cardiac output times peripheral resistance, blood pressure rises.", "Long-term consequence (1 mark): atherosclerosis (also acceptable: left ventricular hypertrophy, or increased risk of myocardial infarction and stroke)."], "note": ""}, {"title": "Hypertension Overview (10 marks)", "marks": 10, "prompt": "Define hypertension, outline its significance, and describe its management, including one lifestyle measure and two pharmacological classes with mechanism and one side effect each.", "points": ["Definition (2 marks): persistently elevated blood pressure, generally systolic at least 140 mmHg and/or diastolic at least 90 mmHg on repeated measurement.", "Significance (2 marks): major modifiable risk factor for stroke, MI, heart failure, and chronic kidney disease; often asymptomatic until a complication develops.", "Lifestyle measure (2 marks): dietary sodium restriction reduces circulating volume and blood pressure; weight loss and regular exercise are equally acceptable answers.", "Drug class 1 (2 marks): ACE inhibitors (e.g. enalapril) block the conversion of angiotensin I to angiotensin II, reducing vasoconstriction and aldosterone-driven sodium/water retention. Side effect: dry cough or hyperkalaemia.", "Drug class 2 (2 marks): thiazide diuretics (e.g. hydrochlorothiazide) inhibit the Na+/Cl- symporter in the distal convoluted tubule, reducing sodium and water reabsorption and lowering circulating volume. Side effect: hypokalaemia."], "note": ""}], "case": []}, {"n": 12, "title": "Angina & Heart Failure", "fc": [{"q": "What is the mechanism of aspirin in angina?", "a": "Inhibits COX-1, decreasing thromboxane A2, giving an antiplatelet effect."}, {"q": "How does digoxin increase cardiac contractility?", "a": "Inhibits Na+/K+-ATPase, increasing intracellular Na+, so less Ca2+ is extruded via the Na+/Ca2+ exchanger, increasing intracellular Ca2+ and contractility."}, {"q": "Why does hypokalemia worsen digoxin toxicity?", "a": "K+ competes with digoxin at the same Na+/K+-ATPase binding site; low K+ enhances digoxin's inhibitory effect."}, {"q": "Define stable angina.", "a": "Predictable chest pain occurring on exertion, caused by a fixed atherosclerotic narrowing of a coronary artery creating a mismatch between myocardial oxygen supply and demand, typically relieved by rest or nitrates."}, {"q": "Define unstable angina and explain why it is more dangerous than stable angina.", "a": "Chest pain occurring at rest or with increasing frequency, duration, or severity, usually reflecting a ruptured or fissured plaque with superimposed thrombus. It carries a high short-term risk of progressing to myocardial infarction and is a medical emergency."}, {"q": "How does angina differ from myocardial infarction at the tissue level?", "a": "Angina is reversible ischaemia; cells survive once flow is restored. MI involves prolonged, usually complete, occlusion causing irreversible myocardial cell death."}, {"q": "Define heart failure and distinguish HFrEF from HFpEF.", "a": "Heart failure is the inability of the heart to pump enough blood to meet metabolic demands. HFrEF reflects impaired systolic contractility; HFpEF reflects impaired diastolic relaxation/filling with a normal ejection fraction."}, {"q": "List key symptoms and signs of heart failure.", "a": "Exertional dyspnoea, orthopnoea, paroxysmal nocturnal dyspnoea, fatigue, peripheral oedema, raised jugular venous pressure, and pulmonary crackles."}, {"q": "What procedural interventions are used for coronary artery disease/angina beyond drug therapy?", "a": "Percutaneous coronary intervention (angioplasty, usually with stent placement) and coronary artery bypass grafting (CABG) for more extensive disease."}, {"q": "What lifestyle changes are recommended in the management of angina and heart failure?", "a": "Smoking cessation, dietary sodium and fluid restriction (particularly in heart failure), weight management, regular graded exercise, and moderation of alcohol intake."}], "mcq": [{"q": "Aspirin's antiplatelet effect in angina works via:", "opts": [{"k": "a", "t": "Blocking beta-receptors"}, {"k": "b", "t": "Inhibiting COX-1/thromboxane A2"}, {"k": "c", "t": "Increasing nitric oxide"}, {"k": "d", "t": "Blocking Na/K ATPase"}, {"k": "e", "t": "Activating FP receptors"}], "ans": "b", "ansText": "b) Inhibiting COX-1/thromboxane A2"}, {"q": "Digoxin toxicity risk is increased by:", "opts": [{"k": "a", "t": "Hyperkalemia"}, {"k": "b", "t": "Hypokalemia"}, {"k": "c", "t": "Hypernatremia"}, {"k": "d", "t": "Hypercalcemia only"}, {"k": "e", "t": "Hyperglycemia"}], "ans": "b", "ansText": "b) Hypokalemia"}], "saq": [{"title": "Cardiac Glycosides — Na+/K+-ATPase Inhibition (10 marks)", "marks": 10, "prompt": "Describe the mechanism of action and consequences of inhibiting the Na+/K+ ATPase in cardiac cells. In addition, discuss two beneficial therapeutic effects and one risk.", "points": ["Mechanism of action (3 marks): cardiac glycosides (e.g. digoxin) inhibit the Na+/K+ ATPase pump in cardiac cell membranes, increasing intracellular Na+ because Na+ extrusion is reduced; the elevated intracellular Na+ decreases the activity of the Na+/Ca2+ exchanger, causing intracellular Ca2+ accumulation.", "Consequences in cardiac cells (2 marks): increased intracellular Ca2+ enhances calcium release from the sarcoplasmic reticulum, resulting in stronger and prolonged myocardial contractility (positive inotropy).", "Beneficial therapeutic effects (3 marks): improves cardiac output in systolic heart failure by strengthening myocardial contraction; controls ventricular rate in atrial fibrillation/flutter by increasing vagal tone and slowing AV nodal conduction.", "Risk (2 marks): narrow therapeutic index; excess intracellular Ca2+ predisposes to arrhythmias (e.g. ventricular tachycardia, fibrillation), worsened by hypokalemia."], "note": ""}, {"title": "Case Study — Angina Progression (10 marks)", "marks": 10, "prompt": "A 70-year-old woman has a history of exertional chest pain that resolves with rest. She is diagnosed with stable angina and managed with a beta-blocker and a statin. Six months later she is admitted to hospital with chest pain occurring at rest. (a) Classify her initial and later presentations (2 marks). (b) Explain the pathophysiological change linking the two presentations (3 marks). (c) Name two drug classes used for symptomatic relief of angina and their mechanism (3 marks). (d) State one investigation or procedure now indicated given her unstable presentation (2 marks).", "points": ["(a) Initial presentation: stable angina, predictable and exertional, relieved by rest. Later presentation: unstable angina, occurring at rest.", "(b) The change suggests rupture or fissuring of a previously stable atherosclerotic plaque, with superimposed platelet aggregation and thrombus formation, converting a fixed stenosis into a more severely obstructive, unstable lesion causing ischaemia even without exertion.", "(c) Nitrates (e.g. GTN): cause venodilation, reducing preload and myocardial oxygen demand, with some direct coronary vasodilation. Beta-blockers (e.g. bisoprolol): reduce heart rate and contractility, lowering myocardial oxygen demand. Calcium channel blockers are an acceptable alternative, reducing afterload and coronary vasospasm.", "(d) Urgent coronary angiography, with a view to percutaneous coronary intervention if a significant culprit lesion is found, given the high short-term risk of progression to myocardial infarction."], "note": ""}], "case": []}, {"n": 13, "title": "Histamine Pathways & Antihistamines", "fc": [{"q": "What amino acid is histamine synthesised from, and where is it mainly stored?", "a": "L-histidine; stored preformed in mast cells and basophils."}, {"q": "What is an autacoid?", "a": "A local chemical messenger that acts near its site of release, rather than travelling in the blood like a hormone."}, {"q": "H1 receptor — G protein and main clinical effect?", "a": "Gq (increased Ca2+); mediates allergic symptoms — vasodilation, increased vascular permeability, bronchoconstriction, itching."}, {"q": "H2 receptor — G protein and main clinical effect?", "a": "Gs (increased cAMP); mediates gastric acid secretion via the H+/K+-ATPase proton pump."}, {"q": "What does an H3 receptor antagonist do, and what is it used for?", "a": "Blocks the presynaptic autoreceptor, increasing histamine, acetylcholine and dopamine release; used for narcolepsy (pitolisant)."}, {"q": "Are antihistamines competitive antagonists?", "a": "No — they are inverse agonists that stabilise the inactive H1 receptor conformation, so they work best taken before allergen exposure."}, {"q": "What happens at first exposure to an allergen (sensitisation)?", "a": "Allergen-specific IgE is produced and binds FcεRI on mast cells; no symptoms occur at this stage."}, {"q": "What is the one property that most explains the difference between first- and second-generation antihistamines?", "a": "Lipophilicity — high lipophilicity crosses the blood-brain barrier and causes sedation; low lipophilicity does not."}, {"q": "Why do first-generation antihistamines cause dry mouth and blurred vision?", "a": "Low receptor selectivity — they also block muscarinic cholinergic receptors."}, {"q": "What is the first-line treatment for anaphylaxis?", "a": "Intramuscular adrenaline. Antihistamines are adjunctive only, for skin symptoms."}, {"q": "Why are H1 antihistamines not effective monotherapy for asthma?", "a": "Leukotrienes, not histamine, drive most asthmatic bronchoconstriction."}, {"q": "Name two antihistamines withdrawn from the market for cardiotoxicity.", "a": "Terfenadine and astemizole (QT prolongation)."}, {"q": "Which H2 blocker is most commonly used today, and why?", "a": "Famotidine — fewer drug interactions than cimetidine."}, {"q": "A patient with chronic spontaneous urticaria has an incomplete response to a standard dose of a second-generation antihistamine. What is the next step, and what is reserved for refractory cases?", "a": "Increase the second-generation H1-antihistamine dose (up to 4x standard), and/or add montelukast or switch antihistamine. For refractory chronic spontaneous urticaria despite these measures, specialist therapies such as omalizumab (anti-IgE monoclonal antibody) or ciclosporin (immunosuppressant) are used."}], "mcq": [{"q": "Which receptor mediates increased gastric acid secretion?", "opts": [{"k": "a", "t": "H1"}, {"k": "b", "t": "H2"}, {"k": "c", "t": "H3"}, {"k": "d", "t": "H4"}, {"k": "e", "t": "M3"}], "ans": "b", "ansText": "b) H2"}, {"q": "What is the mechanism by which H1 antihistamines act?", "opts": [{"k": "a", "t": "Competitive antagonism at the histamine binding site"}, {"k": "b", "t": "Inverse agonism, stabilising the inactive receptor conformation"}, {"k": "c", "t": "Inhibition of histamine synthesis"}, {"k": "d", "t": "Blocking mast cell degranulation"}, {"k": "e", "t": "Enhancing histamine metabolism"}], "ans": "b", "ansText": "b) Inverse agonism, stabilising the inactive receptor conformation"}, {"q": "A patient in anaphylaxis is given oral cetirizine only. What is the most likely outcome?", "opts": [{"k": "a", "t": "Full resolution of hypotension and airway obstruction"}, {"k": "b", "t": "No significant benefit for the life-threatening features, since antihistamines act too slowly and too selectively"}, {"k": "c", "t": "Immediate reversal of bronchoconstriction"}, {"k": "d", "t": "Reduced risk of biphasic anaphylaxis"}, {"k": "e", "t": "Increased blood pressure"}], "ans": "b", "ansText": "b) No significant benefit for the life-threatening features, since antihistamines act too slowly and too selectively"}, {"q": "Which property best explains why second-generation antihistamines cause less sedation?", "opts": [{"k": "a", "t": "Higher receptor affinity"}, {"k": "b", "t": "Shorter half-life"}, {"k": "c", "t": "Low lipophilicity and poor blood-brain barrier penetration"}, {"k": "d", "t": "Selective H2 blockade"}, {"k": "e", "t": "Faster renal clearance"}], "ans": "c", "ansText": "c) Low lipophilicity and poor blood-brain barrier penetration"}, {"q": "Which of the following is an approved H3 receptor antagonist used for narcolepsy?", "opts": [{"k": "a", "t": "Famotidine"}, {"k": "b", "t": "Pitolisant"}, {"k": "c", "t": "Loratadine"}, {"k": "d", "t": "Ranitidine"}, {"k": "e", "t": "Montelukast"}], "ans": "b", "ansText": "b) Pitolisant"}, {"q": "A patient with chronic spontaneous urticaria continues to develop itchy wheals. Which mechanism is targeted by standard first-line therapy?", "opts": [{"k": "a", "t": "Inhibition of COX-2"}, {"k": "b", "t": "Blockade of H1 receptors"}, {"k": "c", "t": "Blockade of TNF-alpha"}, {"k": "d", "t": "Inhibition of calcineurin"}, {"k": "e", "t": "Inhibition of alpha4beta7 integrin"}], "ans": "b", "ansText": "b) Blockade of H1 receptors"}], "saq": [{"title": "Histamine Receptor Subtypes (10 marks)", "marks": 10, "prompt": "Compare the H1 and H2 histamine receptors in terms of G-protein coupling, second messenger, main tissue location and clinical relevance of blocking each.", "points": ["G-protein coupling (2 marks): H1 couples to Gq; H2 couples to Gs.", "Second messenger (2 marks): H1 signalling raises intracellular Ca2+ via IP3/DAG; H2 signalling raises cAMP via adenylyl cyclase.", "Tissue location (2 marks): H1 — endothelium, smooth muscle, brain. H2 — gastric parietal cells, cardiac muscle.", "Effect of blockade — H1 (2 marks): reduces vasodilation, vascular permeability, bronchoconstriction and itching — used in allergy.", "Effect of blockade — H2 (2 marks): reduces gastric acid secretion via decreased proton pump activity — used in GORD and peptic ulcer disease."], "note": ""}, {"title": "Case Study — Anaphylaxis Management (10 marks)", "marks": 10, "prompt": "A 24-year-old is stung by a bee and within minutes develops facial swelling, wheeze and a blood pressure of 78/40 mmHg. A bystander offers her an oral antihistamine tablet from their bag. (a) Explain why an oral antihistamine alone is inappropriate here (3 marks). (b) State the correct first-line treatment and its route (2 marks). (c) Explain the mechanism by which this first-line treatment reverses her symptoms (3 marks). (d) State one situation in which an antihistamine would appropriately be given during her management (2 marks).", "points": ["(a) Oral antihistamines act too slowly (peak plasma level around 2–3 hours) and too selectively (blocking only H1) to reverse the multi-mediator, life-threatening hypotension and airway obstruction of anaphylaxis.", "(b) Intramuscular adrenaline (epinephrine), given as soon as anaphylaxis is recognised.", "(c) Adrenaline acts on alpha-1 receptors to cause vasoconstriction (reversing hypotension) and on beta-2 receptors to cause bronchodilation and reduce further mediator release, with beta-1 effects supporting cardiac output.", "(d) After adrenaline has been given, an antihistamine may be used adjunctively to relieve residual skin symptoms such as itching or urticaria."], "note": ""}, {"title": "Urticaria - Mediator and Antihistamine Mechanism (10 marks)", "marks": 10, "prompt": "A patient presents with recurrent itchy wheals consistent with urticaria. a. Identify the main inflammatory mediator responsible for the symptoms of urticaria. (1 mark) b. Describe two effects of this mediator that contribute to the clinical presentation. (2 marks) c. Explain the mechanism of action of second-generation H1 antihistamines. (4 marks) d. Give one reason why second-generation antihistamines are generally preferred over first-generation antihistamines. (1 mark) e. Name one treatment option that may be used in refractory chronic spontaneous urticaria. (2 marks)", "points": ["Mediator (1 mark): histamine.", "Two effects (2 marks): vasodilation; increased vascular permeability and/or itch (from sensory nerve stimulation).", "Mechanism (4 marks): second-generation antihistamines act as inverse agonists at H1 receptors; this stabilises the receptor in its inactive state, preventing histamine binding/signalling; this reduces histamine-mediated vasodilation and vascular permeability; it therefore reduces wheals and pruritus.", "Reason preferred (1 mark): they cause less sedation because they penetrate the CNS less readily (lower lipophilicity, poor blood-brain barrier penetration).", "Refractory treatment (2 marks): omalizumab or ciclosporin."], "note": ""}], "case": []}, {"n": 14, "title": "Asthma", "fc": [{"q": "What are the four core pathophysiological features of asthma?", "a": "Airway inflammation, bronchoconstriction, airway remodelling, mucus hypersecretion."}, {"q": "Which receptor and pathway mediates parasympathetic bronchoconstriction?", "a": "M3 receptor (Gq) — IP3/DAG — increased intracellular Ca2+ — smooth muscle contraction."}, {"q": "What is the mechanism of a beta2-agonist?", "a": "Beta2-AR — increased cAMP — PKA activation — inactivates myosin light-chain kinase — smooth muscle relaxation."}, {"q": "Why is LABA monotherapy dangerous in asthma?", "a": "It relieves bronchoconstriction but not inflammation, masking a worsening attack and increasing the risk of fatal exacerbations (black box warning)."}, {"q": "What is the mechanism of inhaled corticosteroids in asthma?", "a": "Bind cytoplasmic glucocorticoid receptors, translocate to the nucleus, decrease pro-inflammatory cytokines (IL-4, IL-5, IL-13) and increase anti-inflammatory proteins such as annexin-1."}, {"q": "Which cytokine specifically recruits and activates eosinophils?", "a": "IL-5."}, {"q": "What triggers the immediate phase of the asthma response, and what treats it?", "a": "Mast cell degranulation releasing histamine, PGD2 and cysteinyl leukotrienes; treated with beta2-agonists, LTRAs or theophylline."}, {"q": "What treats the late phase of the asthma response?", "a": "Glucocorticoids (inhaled or systemic), because the late phase is driven by Th2 cells and eosinophils."}, {"q": "What is the mechanism of a leukotriene receptor antagonist?", "a": "Blocks the CysLT1 receptor so cysteinyl leukotrienes cannot cause bronchoconstriction, oedema or mucus secretion."}, {"q": "Name three emergency signs of a severe asthma attack.", "a": "Silent chest, drowsiness or confusion, cyanosis (blue lips)."}, {"q": "Why is ICS + LABA combination therapy used rather than either alone?", "a": "ICS treats the underlying inflammation; LABA treats the bronchoconstriction — together they address both pathological processes."}, {"q": "Which drug interaction is important with zafirlukast?", "a": "It inhibits CYP2C9, which can raise warfarin levels."}], "mcq": [{"q": "Which receptor mediates bronchodilation in response to sympathetic stimulation?", "opts": [{"k": "a", "t": "M3"}, {"k": "b", "t": "Beta2-adrenoceptor"}, {"k": "c", "t": "H1"}, {"k": "d", "t": "CysLT1"}, {"k": "e", "t": "Alpha1"}], "ans": "b", "ansText": "b) Beta2-adrenoceptor"}, {"q": "A patient using only a SABA needs it more than three times a week and wakes at night with symptoms. What should be added?", "opts": [{"k": "a", "t": "A second SABA inhaler"}, {"k": "b", "t": "An oral antihistamine"}, {"k": "c", "t": "An inhaled corticosteroid"}, {"k": "d", "t": "A higher-dose SABA"}, {"k": "e", "t": "An H2 blocker"}], "ans": "c", "ansText": "c) An inhaled corticosteroid"}, {"q": "Which cytokine drives Th2 differentiation and IgE class switching?", "opts": [{"k": "a", "t": "IL-5"}, {"k": "b", "t": "IL-4"}, {"k": "c", "t": "IL-13"}, {"k": "d", "t": "TNF-alpha"}, {"k": "e", "t": "IL-10"}], "ans": "b", "ansText": "b) IL-4"}, {"q": "Why must LABAs never be used as monotherapy in asthma?", "opts": [{"k": "a", "t": "They cause excessive tachycardia when used alone"}, {"k": "b", "t": "They relieve bronchoconstriction but do not treat the underlying inflammation, masking a worsening attack"}, {"k": "c", "t": "They are ineffective without an anticholinergic"}, {"k": "d", "t": "They rapidly downregulate M3 receptors"}, {"k": "e", "t": "They interact with all corticosteroids"}], "ans": "b", "ansText": "b) They relieve bronchoconstriction but do not treat the underlying inflammation, masking a worsening attack"}, {"q": "A patient in the emergency department is drowsy, has blue-tinged lips and a silent chest. This indicates:", "opts": [{"k": "a", "t": "A mild flare-up requiring reliever use"}, {"k": "b", "t": "A severe flare-up requiring specialist review within the week"}, {"k": "c", "t": "An emergency requiring immediate escalation of care"}, {"k": "d", "t": "A normal response to exercise-induced bronchoconstriction"}, {"k": "e", "t": "Anxiety-related hyperventilation"}], "ans": "c", "ansText": "c) An emergency requiring immediate escalation of care"}], "saq": [{"title": "Immediate vs Late Phase Asthma Response (10 marks)", "marks": 10, "prompt": "Differentiate the immediate and late phase of the asthma response, including the mediators involved and the drug classes that target each phase.", "points": ["Immediate phase (3 marks): occurs within minutes of allergen exposure; mast cells degranulate, releasing spasmogens (histamine, PGD2, cysteinyl leukotrienes) causing bronchospasm.", "Immediate phase treatment (2 marks): reversed by beta2-agonists, CysLT-receptor antagonists and theophylline.", "Late phase (3 marks): occurs hours later; Th2 cells and eosinophils infiltrate the airway and release cytokines and toxic proteins, causing inflammation, hyperreactivity, epithelial damage and further bronchospasm.", "Late phase treatment (2 marks): inhibited by glucocorticoids (inhaled or systemic), not by bronchodilators alone."], "note": ""}, {"title": "Case Study — Step-Up Asthma Therapy (10 marks)", "marks": 10, "prompt": "A 34-year-old man with asthma currently uses only a salbutamol inhaler as needed, now averaging four uses a week and waking with symptoms twice a week. (a) Identify the problem with his current management (2 marks). (b) State the class of medication that should be added and explain its mechanism (4 marks). (c) Explain why simply increasing his SABA use is not appropriate (2 marks). (d) Name one add-on option if symptoms remain uncontrolled on this new step (2 marks).", "points": ["(a) His frequent reliever use and night waking indicate poorly controlled underlying airway inflammation, not just bronchoconstriction — SABA-only treatment is no longer recommended.", "(b) An inhaled corticosteroid should be added (often as ICS-formoterol or low-dose ICS with a SABA reliever); it binds glucocorticoid receptors, reducing pro-inflammatory cytokines (IL-4, IL-5, IL-13) and eosinophil recruitment, decreasing airway inflammation and hyperresponsiveness.", "(c) Increasing SABA alone does not treat inflammation, the underlying disease process, and over-reliance on SABA is associated with poorer outcomes and increased risk of severe exacerbations.", "(d) A long-acting beta2-agonist added to the ICS (ICS + LABA combination), or a leukotriene receptor antagonist as an alternative."], "note": ""}], "case": []}, {"n": 15, "title": "Respiratory Infections", "fc": [{"q": "What is selective toxicity?", "a": "Targeting bacterial structures or processes that are absent or sufficiently different in human cells."}, {"q": "Why are antibiotics ineffective against viruses?", "a": "Viruses are not cells — they lack a cell wall, 70S ribosomes and independent metabolism, so there is no bacterial-type target."}, {"q": "What is the mechanism of beta-lactam antibiotics?", "a": "Bind penicillin-binding proteins, inhibiting peptidoglycan cross-linking, weakening the cell wall and causing lysis — bactericidal."}, {"q": "What does clavulanic acid do when combined with amoxicillin?", "a": "Inhibits bacterial beta-lactamase enzymes, preventing them from hydrolysing amoxicillin's beta-lactam ring."}, {"q": "Compare the ribosomal subunit and mechanism of tetracyclines and macrolides.", "a": "Tetracyclines bind the 30S subunit and block tRNA binding at the A site; macrolides bind the 50S subunit and block translocation of the growing peptide chain."}, {"q": "What is the mechanism of fluoroquinolones, and why are they reserved?", "a": "Inhibit DNA gyrase and topoisomerase IV, disrupting DNA replication — bactericidal; reserved due to resistance concerns and adverse effects (tendon rupture, QT prolongation)."}, {"q": "Define bactericidal vs bacteriostatic.", "a": "Bactericidal kills bacteria (numbers fall); bacteriostatic inhibits growth, allowing the immune system to clear the infection."}, {"q": "What are the four mechanisms of antibacterial resistance?", "a": "Enzymatic inactivation, target change, reduced permeability, active efflux."}, {"q": "Does an antibiotic cause bacteria to become resistant?", "a": "No — resistance already exists as genetic variation; the antibiotic acts only as a selection pressure."}, {"q": "Why is susceptibility alone not enough to choose an antibiotic?", "a": "The drug must also reach an effective concentration at the site of infection."}, {"q": "What is the standard approach to choosing spectrum when the organism is unknown?", "a": "Start broad empirically, then narrow once microbiology results identify the organism."}, {"q": "What is the mucociliary escalator, and what damages it?", "a": "Ciliated epithelium moving mucus and trapped microorganisms toward the pharynx; damaged by smoking and viral infection."}], "mcq": [{"q": "Which bacterial structure is the target of beta-lactam antibiotics?", "opts": [{"k": "a", "t": "70S ribosome"}, {"k": "b", "t": "Peptidoglycan cell wall"}, {"k": "c", "t": "DNA gyrase"}, {"k": "d", "t": "Folate synthesis enzymes"}, {"k": "e", "t": "Cell membrane"}], "ans": "b", "ansText": "b) Peptidoglycan cell wall"}, {"q": "Why are antibiotics ineffective against viral infections?", "opts": [{"k": "a", "t": "Viruses replicate too quickly"}, {"k": "b", "t": "Viruses lack the cellular structures antibiotics are designed to target"}, {"k": "c", "t": "Viral enzymes destroy antibiotics"}, {"k": "d", "t": "Viruses are resistant to all forms of selective toxicity"}, {"k": "e", "t": "Viruses have a thicker cell wall"}], "ans": "b", "ansText": "b) Viruses lack the cellular structures antibiotics are designed to target"}, {"q": "Tetracyclines bind which ribosomal subunit?", "opts": [{"k": "a", "t": "50S"}, {"k": "b", "t": "30S"}, {"k": "c", "t": "40S"}, {"k": "d", "t": "60S"}, {"k": "e", "t": "80S"}], "ans": "b", "ansText": "b) 30S"}, {"q": "Which resistance mechanism involves bacterial enzymes destroying the antibiotic?", "opts": [{"k": "a", "t": "Target change"}, {"k": "b", "t": "Reduced permeability"}, {"k": "c", "t": "Enzymatic inactivation"}, {"k": "d", "t": "Active efflux"}, {"k": "e", "t": "Selection pressure"}], "ans": "c", "ansText": "c) Enzymatic inactivation"}, {"q": "A prescriber starts a broad-spectrum antibiotic before culture results are available, then narrows therapy once the organism is confirmed. This reflects:", "opts": [{"k": "a", "t": "Poor prescribing practice"}, {"k": "b", "t": "Antimicrobial stewardship"}, {"k": "c", "t": "Empirical failure"}, {"k": "d", "t": "Off-label use"}, {"k": "e", "t": "Resistance induction"}], "ans": "b", "ansText": "b) Antimicrobial stewardship"}, {"q": "Doxycycline decreases bacterial protein synthesis primarily by:", "opts": [{"k": "a", "t": "Binding to the 50S ribosomal subunit and blocking translocation"}, {"k": "b", "t": "Binding to the 30S ribosomal subunit and preventing aminoacyl-tRNA binding"}, {"k": "c", "t": "Inhibiting DNA gyrase and topoisomerase IV"}, {"k": "d", "t": "Blocking peptidoglycan cross-linking"}], "ans": "b", "ansText": "b) Binding to the 30S ribosomal subunit and preventing aminoacyl-tRNA binding"}, {"q": "Which factor can impair respiratory host defence by damaging ciliated epithelium?", "opts": [{"k": "a", "t": "Effective mucociliary clearance"}, {"k": "b", "t": "Smoking"}, {"k": "c", "t": "Normal cough reflexes"}, {"k": "d", "t": "Increased IgA secretion"}, {"k": "e", "t": "Increased macrophage activity"}], "ans": "b", "ansText": "b) Smoking"}, {"q": "Which respiratory infection is predominantly viral?", "opts": [{"k": "a", "t": "Bacterial sinusitis"}, {"k": "b", "t": "Acute bronchitis"}, {"k": "c", "t": "Streptococcal pharyngitis"}, {"k": "d", "t": "Bacterial pneumonia"}, {"k": "e", "t": "Bacterial otitis media"}], "ans": "b", "ansText": "b) Acute bronchitis"}, {"q": "Which bacterial process is targeted by drugs that inhibit DNA gyrase or topoisomerase IV?", "opts": [{"k": "a", "t": "Protein synthesis"}, {"k": "b", "t": "Cell wall synthesis"}, {"k": "c", "t": "Mucus production"}, {"k": "d", "t": "Folate absorption"}, {"k": "e", "t": "DNA replication"}], "ans": "e", "ansText": "e) DNA replication"}, {"q": "What is meant by selection pressure during antibiotic use?", "opts": [{"k": "a", "t": "Antibiotics favour survival of bacteria that are resistant"}, {"k": "b", "t": "Antibiotics stimulate viral replication"}, {"k": "c", "t": "Antibiotics increase the susceptibility of resistant bacteria"}, {"k": "d", "t": "Antibiotics cause all bacteria to become identical"}, {"k": "e", "t": "Antibiotics prevent bacterial replication completely"}], "ans": "a", "ansText": "a) Antibiotics favour survival of bacteria that are resistant"}], "saq": [{"title": "Selective Toxicity and Bacterial Targets (10 marks)", "marks": 10, "prompt": "Explain the principle of selective toxicity and use it to explain the mechanism of action of TWO different antibacterial drug classes used in respiratory infections.", "points": ["Principle (3 marks): antibacterial drugs target bacterial structures or processes that are absent, or sufficiently different, from those in human cells, allowing the drug to damage the bacterium without harming the host.", "Beta-lactams (3–4 marks): target penicillin-binding proteins involved in peptidoglycan cross-linking — a cell wall structure entirely absent in human cells — causing lysis and bactericidal death.", "Macrolides or tetracyclines (3–4 marks): target the bacterial 70S ribosome (30S or 50S subunit), which is structurally distinct from the human 80S ribosome, inhibiting bacterial protein synthesis with minimal effect on human cells."], "note": ""}, {"title": "Case Study — Antibacterial Resistance (10 marks)", "marks": 10, "prompt": "A patient is treated with amoxicillin for a respiratory infection, but the causative Staphylococcus aureus isolate is later found to be resistant, producing an enzyme that inactivates the drug. (a) Name and describe this resistance mechanism (3 marks). (b) Explain, in terms of selection pressure, how this resistant strain likely became the dominant strain in this patient (3 marks). (c) Name an antibiotic strategy that could restore activity against this organism (2 marks). (d) State one antimicrobial stewardship principle relevant to this case (2 marks).", "points": ["(a) Enzymatic inactivation via a beta-lactamase, which hydrolyses the beta-lactam ring of amoxicillin, preventing it from binding penicillin-binding proteins.", "(b) Resistance-conferring genes already existed in a subset of the bacterial population before treatment; amoxicillin killed the susceptible bacteria while resistant organisms were unaffected, allowing them to survive, multiply and become dominant — the antibiotic selected for, rather than caused, resistance.", "(c) Combine amoxicillin with a beta-lactamase inhibitor such as clavulanic acid, which inhibits the enzyme and restores amoxicillin's activity.", "(d) Use the narrowest effective spectrum agent once susceptibility results are known, and use the appropriate dose, route and duration to avoid further selection pressure."], "note": ""}], "case": []}, {"n": 16, "title": "Ear, Nose & Throat Pharmacology", "fc": [{"q": "Why can otitis externa be treated topically but otitis media usually cannot?", "a": "The external canal is directly accessible; the middle ear sits behind the tympanic membrane, which blocks topical drug penetration."}, {"q": "What is the mechanism of nasal decongestants such as xylometazoline?", "a": "Alpha1-adrenoceptor activation — Gq/PLC — increased IP3 and intracellular Ca2+ — vascular smooth muscle contraction — vasoconstriction of nasal mucosal vessels."}, {"q": "What is rebound congestion?", "a": "Worsening nasal congestion after prolonged topical decongestant use — the reason these agents are for short-term use only."}, {"q": "What is the mechanism of intranasal corticosteroids?", "a": "Bind the intracellular glucocorticoid receptor, altering gene transcription to reduce pro-inflammatory mediators and inflammatory cell activity."}, {"q": "Why are fluoroquinolone ear drops preferred over aminoglycosides if the tympanic membrane may be perforated?", "a": "Aminoglycosides are ototoxic and can damage middle or inner ear structures through a perforation; fluoroquinolones do not carry this risk."}, {"q": "What is the mechanism of ciprofloxacin in otitis externa?", "a": "Inhibits bacterial DNA gyrase and topoisomerase IV, blocking DNA replication — bactericidal."}, {"q": "What do cerumenolytics do?", "a": "Soften, hydrate and disperse ear wax to facilitate natural extrusion or removal."}, {"q": "When are antibiotics indicated in acute otitis media?", "a": "When bacterial infection is suspected, or symptoms are severe or persistent."}, {"q": "Why are antibiotics not routinely used for sore throat?", "a": "Most acute pharyngitis is viral; treatment is predominantly symptomatic with paracetamol or NSAIDs."}, {"q": "What is the mechanism of ibuprofen in ENT conditions?", "a": "Reversibly inhibits COX-1 and COX-2, reducing prostaglandin synthesis and nociceptor sensitisation."}], "mcq": [{"q": "Why does acute otitis media usually require systemic rather than topical treatment?", "opts": [{"k": "a", "t": "The middle ear has no drug receptors"}, {"k": "b", "t": "The tympanic membrane blocks topical drug penetration"}, {"k": "c", "t": "Systemic drugs work faster"}, {"k": "d", "t": "Topical drugs are always less effective"}, {"k": "e", "t": "It is never treated with drugs"}], "ans": "b", "ansText": "b) The tympanic membrane blocks topical drug penetration"}, {"q": "Which receptor mediates the vasoconstrictor effect of xylometazoline?", "opts": [{"k": "a", "t": "Beta2-adrenoceptor"}, {"k": "b", "t": "M3 muscarinic"}, {"k": "c", "t": "Alpha1-adrenoceptor"}, {"k": "d", "t": "H1"}, {"k": "e", "t": "CysLT1"}], "ans": "c", "ansText": "c) Alpha1-adrenoceptor"}, {"q": "Why are aminoglycoside ear drops avoided when the tympanic membrane is perforated?", "opts": [{"k": "a", "t": "They cause allergic reactions"}, {"k": "b", "t": "They are ineffective against bacteria"}, {"k": "c", "t": "They have recognised ototoxic potential"}, {"k": "d", "t": "They cause rebound congestion"}, {"k": "e", "t": "They stain the tympanic membrane"}], "ans": "c", "ansText": "c) They have recognised ototoxic potential"}, {"q": "What is the mechanism of intranasal corticosteroids such as mometasone?", "opts": [{"k": "a", "t": "Alpha1 receptor blockade"}, {"k": "b", "t": "Binding the intracellular glucocorticoid receptor to alter gene transcription"}, {"k": "c", "t": "COX inhibition"}, {"k": "d", "t": "H1 receptor blockade"}, {"k": "e", "t": "Beta-lactamase inhibition"}], "ans": "b", "ansText": "b) Binding the intracellular glucocorticoid receptor to alter gene transcription"}, {"q": "Antibiotics are appropriate for sore throat when:", "opts": [{"k": "a", "t": "The patient requests them"}, {"k": "b", "t": "Symptoms have lasted more than 24 hours"}, {"k": "c", "t": "Bacterial pharyngitis or tonsillitis is confirmed or strongly suspected"}, {"k": "d", "t": "Fever is present"}, {"k": "e", "t": "The patient is a child"}], "ans": "c", "ansText": "c) Bacterial pharyngitis or tonsillitis is confirmed or strongly suspected"}, {"q": "Xylometazoline relieves nasal congestion primarily by:", "opts": [{"k": "a", "t": "Blocking H1 receptors"}, {"k": "b", "t": "Activating alpha1-adrenoceptors and causing mucosal vasoconstriction"}, {"k": "c", "t": "Activating beta2-adrenoceptors"}, {"k": "d", "t": "Inhibiting glucocorticoid receptors"}], "ans": "b", "ansText": "b) Activating alpha1-adrenoceptors and causing mucosal vasoconstriction"}, {"q": "How do nasal decongestants relieve nasal congestion?", "opts": [{"k": "a", "t": "By increasing vascular permeability"}, {"k": "b", "t": "By increasing mucosal oedema"}, {"k": "c", "t": "By stimulating inflammatory mediator release"}, {"k": "d", "t": "By causing vasoconstriction of nasal mucosal blood vessels"}, {"k": "e", "t": "By increasing mucus secretion"}], "ans": "d", "ansText": "d) By causing vasoconstriction of nasal mucosal blood vessels"}, {"q": "Why is topical therapy commonly used for otitis externa?", "opts": [{"k": "a", "t": "It delivers treatment directly to the affected tissue"}, {"k": "b", "t": "It eliminates the need for correct administration technique"}, {"k": "c", "t": "It always produces greater systemic exposure"}, {"k": "d", "t": "It can be used regardless of tympanic membrane integrity"}, {"k": "e", "t": "It prevents all local adverse effects"}], "ans": "a", "ansText": "a) It delivers treatment directly to the affected tissue"}], "saq": [{"title": "Topical vs Systemic ENT Therapy (10 marks)", "marks": 10, "prompt": "Using otitis externa and acute otitis media as examples, explain why one is typically managed topically and the other often requires systemic therapy, and list two advantages and two limitations of topical therapy in general.", "points": ["Otitis externa (2 marks): the external canal is directly accessible, so topical antimicrobial and corticosteroid drops reach the infected tissue effectively.", "Acute otitis media (2 marks): the middle ear lies behind the tympanic membrane, which blocks topical drug penetration, so systemic antibiotics are needed when treatment is indicated.", "Advantages of topical therapy (2 marks): high local drug concentration at the site of action; lower systemic exposure and fewer systemic adverse effects.", "Limitations of topical therapy (2–4 marks): administration technique affects efficacy; local irritation may occur; some preparations are unsafe if the tympanic membrane is perforated; some topical drugs still undergo systemic absorption."], "note": ""}, {"title": "Case Study — Persistent Nasal Congestion (10 marks)", "marks": 10, "prompt": "A 28-year-old has used an over-the-counter oxymetazoline nasal spray daily for three weeks for hay fever symptoms and reports her congestion is now worse than before she started. (a) Identify the phenomenon occurring (2 marks). (b) Explain its mechanism (3 marks). (c) State the appropriate short-term management (2 marks). (d) Recommend a more suitable option for her ongoing seasonal allergic rhinitis and explain its mechanism (3 marks).", "points": ["(a) Rebound congestion (rhinitis medicamentosa) from prolonged topical decongestant use.", "(b) Repeated alpha1-adrenoceptor activation and vasoconstriction is followed by reactive vasodilation and mucosal oedema once the drug wears off, progressively worsening congestion with continued use.", "(c) Stop the topical decongestant; symptoms typically improve over days to weeks once the drug is withdrawn.", "(d) An intranasal corticosteroid such as mometasone is more appropriate for ongoing allergic rhinitis; it binds the intracellular glucocorticoid receptor, reducing pro-inflammatory mediator production and mucosal inflammation without the rebound risk associated with decongestants."], "note": ""}, {"title": "Rhinosinusitis and Nasal Congestion (10 marks)", "marks": 10, "prompt": "Rhinosinusitis involves inflammation of the nasal and paranasal sinus mucosa, resulting in symptoms such as nasal obstruction and congestion. a. Explain the pathophysiological changes in the nasal mucosa that contribute to nasal congestion in rhinosinusitis. (4 marks) b. Explain the pharmacological mechanism of action of nasal decongestants and how this mechanism reduces congestion. (3 marks) c. Explain the pharmacological mechanism of action of intranasal corticosteroids and how this reduces mucosal inflammation and associated symptoms. (3 marks)", "points": ["Pathophysiology (4 marks): inflammatory mediators (histamine, bradykinin, leukotrienes) are released from mast cells and inflammatory cells; this causes increased vasodilation and increased vascular permeability, producing mucosal oedema; the resulting inflammation and oedema narrow the airway and cause congestion; inflammation also impairs mucociliary clearance.", "Nasal decongestant mechanism (3 marks): alpha1-receptor activation stimulates Gq and phospholipase C, increasing IP3 and intracellular calcium, causing vascular smooth muscle contraction; this contraction vasoconstricts nasal mucosal vessels; reduced oedema relieves congestion.", "Intranasal corticosteroid mechanism (3 marks): corticosteroids diffuse across the cell membrane and bind the intracellular glucocorticoid receptor; the complex moves to the nucleus and changes gene transcription, inhibiting NF-kB and AP-1; this reduces pro-inflammatory mediator production and therefore reduces inflammation of the nasal mucosa and oedema."], "note": ""}], "case": []}, {"n": 17, "title": "Inflammation & Anti-inflammatory Drugs", "fc": [{"q": "Why is inflammation described as non-specific?", "a": "The response pattern is the same regardless of the cause — physical, chemical, ischaemic or infectious."}, {"q": "Which cell type dominates acute vs chronic inflammation?", "a": "Acute — neutrophils. Chronic — macrophages, lymphocytes and plasma cells."}, {"q": "What mediator is responsible for the warmth and redness of inflammation?", "a": "Nitric oxide — it relaxes arterioles, increasing blood flow."}, {"q": "Where do corticosteroids block the arachidonic acid pathway?", "a": "At phospholipase A2 — the source — shutting down both the COX and lipoxygenase branches."}, {"q": "Where do NSAIDs block the pathway, and what is unaffected?", "a": "At cyclooxygenase (COX) only; leukotriene production via 5-lipoxygenase is unaffected."}, {"q": "Why do NSAIDs cause peptic ulcers?", "a": "COX-1 inhibition reduces PGE2 and PGI2, which normally protect the gastric mucosa."}, {"q": "What is the difference between transactivation and transrepression?", "a": "Transactivation increases transcription of anti-inflammatory genes; transrepression decreases transcription of pro-inflammatory genes by inhibiting NF-kappaB and AP-1."}, {"q": "Name the key anti-inflammatory cytokine and its main action.", "a": "IL-10 — suppresses pro-inflammatory cytokine production and promotes repair."}, {"q": "What is cytokine redundancy, and why does it matter clinically?", "a": "Overlapping effects between many mediators, explaining why single-target biologics have limited or waning efficacy in roughly 30–40% of patients."}, {"q": "Why does anti-TNF therapy carry a risk of TB reactivation?", "a": "TNF-alpha maintains the granulomas that contain latent TB; blocking it disrupts that containment."}, {"q": "Do leukotriene receptor antagonists stop leukotriene production?", "a": "No — they block the CysLT1 receptor; leukotrienes are still synthesised but cannot act."}, {"q": "What is the mechanism of H1 antihistamines in inflammation?", "a": "Inverse agonists that stabilise the inactive H1 receptor, blocking the Gq–PLC–IP3–Ca2+ pathway."}, {"q": "List the five steps of leukocyte recruitment in the cellular phase.", "a": "Rolling, firm adhesion, diapedesis, chemotaxis, phagocytosis."}, {"q": "What are DAMPs and PAMPs?", "a": "Damage-associated and pathogen-associated molecular patterns — the danger signals recognised by tissue macrophages and mast cells."}, {"q": "Put the acute inflammatory response in order, starting with tissue injury.", "a": "1) Tissue injury, infection or another inflammatory trigger occurs. 2) Macrophages and mast cells recognise danger signals. 3) Inflammatory mediators such as histamine and prostaglandins are released. 4) Vasodilation and increased vascular permeability occur. 5) Leukocytes migrate across the vascular endothelium. 6) Neutrophils move toward the site by chemotaxis."}, {"q": "List features that are seen in acute inflammation only, chronic inflammation only, and both.", "a": "Acute only: neutrophils predominate, rapid onset, oedema, may resolve completely. Chronic only: macrophages and lymphocytes predominate, tissue destruction with repair, fibrosis, persistent cytokine signalling, can lead to organ dysfunction. Both: can involve vasodilation, increased vascular permeability, recruitment of immune cells."}, {"q": "In the arachidonic acid pathway, which enzymes do non-selective and COX-2-selective NSAIDs each target, and what do the resulting prostaglandins mediate?", "a": "Non-selective NSAIDs (e.g. diclofenac, ibuprofen, naproxen) inhibit both COX1 and COX2. COX-2-selective NSAIDs (e.g. celecoxib, rofecoxib) inhibit COX2 only. Both routes produce prostaglandins (PGs) from arachidonic acid; the PGD2/PGE2/PGF2a/PGI2 group mediates inflammation, PGG2/PGH2 haemostasis, PGA1/PGE1/PGE2 protection of the gastric mucosa, and PGE2 also drives cell proliferation, angiogenesis and metastasis."}, {"q": "Match each drug to its target/mechanism and main pharmacological consequence: ibuprofen, prednisone, cetirizine, montelukast, infliximab, tofacitinib.", "a": "Ibuprofen - inhibits cyclooxygenase (COX) - reduces prostaglandin production, decreasing pain and inflammation. Prednisone - broad suppression of inflammatory gene expression and mediator production - reduces cytokine production and immune-cell activity. Cetirizine - H1 histamine receptor inverse agonist - reduces histamine-mediated allergic inflammation. Montelukast - blocks CysLT1 receptors - reduces leukotriene-mediated inflammatory effects. Infliximab - binds and neutralises TNF-alpha - reduces TNF-driven inflammatory signalling. Tofacitinib - inhibits JAK signalling - reduces intracellular signalling from multiple cytokines."}, {"q": "Which drug class produces the broadest immunosuppressive effect, and why?", "a": "Corticosteroids - because they alter transcription of multiple inflammatory genes, reducing production of numerous cytokines and inflammatory mediators rather than targeting a single mediator or pathway."}], "mcq": [{"q": "Which enzyme do corticosteroids inhibit to block the arachidonic acid pathway at its source?", "opts": [{"k": "a", "t": "Cyclooxygenase"}, {"k": "b", "t": "5-lipoxygenase"}, {"k": "c", "t": "Phospholipase A2"}, {"k": "d", "t": "Thromboxane synthase"}, {"k": "e", "t": "Lipoxin synthase"}], "ans": "c", "ansText": "c) Phospholipase A2"}, {"q": "A patient on a non-selective NSAID develops a peptic ulcer. Best explanation?", "opts": [{"k": "a", "t": "Increased leukotriene production"}, {"k": "b", "t": "Reduced PGE2/PGI2, which normally protect gastric mucosa"}, {"k": "c", "t": "Direct inhibition of gastric acid secretion"}, {"k": "d", "t": "Increased histamine release"}, {"k": "e", "t": "Increased bradykinin"}], "ans": "b", "ansText": "b) Reduced PGE2/PGI2, which normally protect gastric mucosa"}, {"q": "Montelukast works by:", "opts": [{"k": "a", "t": "Inhibiting 5-lipoxygenase"}, {"k": "b", "t": "Blocking the CysLT1 receptor"}, {"k": "c", "t": "Inhibiting COX-2"}, {"k": "d", "t": "Neutralising circulating leukotrienes"}, {"k": "e", "t": "Blocking H1 receptors"}], "ans": "b", "ansText": "b) Blocking the CysLT1 recepto
