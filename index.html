<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHAR222 · Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#c62828; --c2:#d2540a; --c3:#8a6800; --c4:#4e7500;
  --c5:#0f7038; --c6:#017068; --c7:#0e7490; --c8:#1266b8;
  --c9:#3f4ec7; --c10:#7b3fc4; --c11:#b0339c; --c12:#c2185b;
  --c13:#6a3fc4; --c14:#0f8a5f; --c15:#a5562a; --c16:#2f7fa8; --c17:#c0447f; --c18:#5c7a2f;
  --c19:#a83279; --c20:#2f8f6a;
  --chip:#12151c;

  --bg:#12151b; --card:#1b1f28; --ink:#eef1f6; --ink2:#b7c0cd; --mute:#8892a0;
  --line:#2c323e; --line2:#232833;
  --ok:#3ddc84; --ok-t:#12301f; --no:#ff6b64; --no-t:#3a1616; --star:#f0b429;
  --accent:var(--c8);
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35);
  --sh-lg:0 16px 48px rgba(0,0,0,.55);
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============ SPECTRUM (signature element) ============ */
.masthead{background:var(--card);border-bottom:1px solid var(--line);padding:18px 26px 0;position:sticky;top:0;z-index:40}
.mh-top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.wordmark{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.6px;line-height:1;margin:0}
.wordmark span{color:var(--mute);font-weight:600}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.7px;color:var(--mute);text-transform:uppercase;margin-top:5px}
.mh-top .gap{flex:1}
.searchwrap{position:relative}
.searchwrap input{width:270px;max-width:52vw;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px 9px 32px;font-family:var(--body);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.searchwrap input:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.searchwrap svg{position:absolute;left:10px;top:11px;width:15px;height:15px;color:var(--mute);pointer-events:none}

.spectrum{display:flex;gap:3px;align-items:flex-end;height:56px}
.seg{flex:1;position:relative;background:transparent;border:0;padding:0;cursor:pointer;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border-radius:5px 5px 0 0;overflow:hidden;transition:transform .14s}
.seg .track{height:38px;background:color-mix(in srgb,var(--lc) 14%,var(--line2));border-radius:4px 4px 0 0;position:relative;overflow:hidden;transition:background .15s}
.seg .fill{position:absolute;left:0;right:0;bottom:0;background:var(--lc);transition:height .5s cubic-bezier(.2,.7,.2,1);opacity:.55}
.seg .rule{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--lc)}
.seg .num{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--lc);opacity:.65;padding:4px 0 6px;letter-spacing:.4px}
.seg:hover .track{background:color-mix(in srgb,var(--lc) 28%,var(--line2))}
.seg:hover{transform:translateY(-2px)}
.seg.on .fill{opacity:.85}
.seg.on .num{opacity:1}
.seg.on .track{box-shadow:inset 0 0 0 1.5px var(--lc)}
.seg .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-6px);background:var(--chip);color:#fff;font-size:12px;line-height:1.35;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;font-family:var(--body);text-align:left}
.seg:hover .tip{opacity:1}
.seg .tip b{display:block;font-weight:600}
.seg .tip i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.75}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 26px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:var(--mh-h,150px);z-index:30}
.modes{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px}
.mode{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:background .13s,color .13s}
.mode:hover{background:var(--line2)}
.mode.on{background:var(--accent);color:#fff}
.mode .n{font-family:var(--mono);font-size:10.5px;opacity:.7}
.toolbar .gap{flex:1}
.tog{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:6px;transition:all .13s}
.tog:hover{border-color:var(--mute)}
.tog.on{background:var(--chip);color:#fff;border-color:var(--chip)}
.tog.on.starred{background:var(--star);border-color:var(--star);color:#3a2800}
.filtnote{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:4px}

/* ============ STAGE ============ */
.stage{max-width:860px;margin:0 auto;padding:30px 26px 100px}
.fadein{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
.h1{font-family:var(--disp);font-weight:700;font-size:clamp(26px,4vw,34px);letter-spacing:-.7px;line-height:1.1;margin:6px 0 4px}
.lede{color:var(--ink2);font-size:15px;margin:0 0 22px;max-width:60ch}

/* lecture tag */
.ltag{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--lc);background:color-mix(in srgb,var(--lc) 10%,transparent);border:1px solid color-mix(in srgb,var(--lc) 26%,transparent);padding:4px 10px;border-radius:20px;white-space:nowrap}
.ltag .dot{width:7px;height:7px;border-radius:50%;background:var(--lc);flex:none}
.tt{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--line2);color:var(--ink2)}

/* progress rail on cards */
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qmeta .gap{flex:1}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--mute)}

/* ---------- flashcard ---------- */
.stagecard{perspective:1800px;margin-bottom:18px}
.fcard{position:relative;min-height:270px;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.2,1)}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:38px 40px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);border:1px solid var(--line);border-top:5px solid var(--lc)}
.face.front{background:var(--card)}
.face.back{background:var(--chip);border-color:var(--chip);transform:rotateY(180deg);color:#e9edf3}
.face .flabel{position:absolute;top:16px;left:40px;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
.face.back .flabel{color:#8b97a8}
.face .qtext{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.32;letter-spacing:-.3px}
.face .atext{font-size:16.5px;line-height:1.58}
.face .tap{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--mute)}
.face.back .tap{color:#7b8798}

/* ---------- MCQ ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:18px;padding:30px 34px;box-shadow:var(--sh)}
.qstem{font-family:var(--disp);font-weight:600;font-size:20.5px;line-height:1.35;letter-spacing:-.3px;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;cursor:pointer;font-size:15px;line-height:1.45;transition:border-color .13s,background .13s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--card))}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-weight:600;font-size:12.5px;width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--line2);color:var(--ink2);margin-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-t)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-t)}
.opt.wrong .k{background:var(--no);color:#fff}
.verdict{margin-top:18px;border-radius:12px;padding:13px 16px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.verdict.ok{background:var(--ok-t);color:#7ef0ab}
.verdict.no{background:var(--no-t);color:#ff9b95}
.verdict b{font-weight:600}

/* ---------- written (SAQ / case) ---------- */
.wcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--lc);border-radius:18px;padding:30px 34px;box-shadow:var(--sh)}
.wtitle{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.4px;margin:0 0 4px;line-height:1.25}
.marks{font-family:var(--mono);font-size:11.5px;color:var(--lc);font-weight:600}
.prompt{background:var(--bg);border-left:3px solid var(--lc);border-radius:0 10px 10px 0;padding:15px 18px;margin:16px 0 20px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.model{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.model h4{font-family:var(--mono);font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
.model ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.model li{position:relative;padding-left:22px;font-size:14.8px;line-height:1.55;color:var(--ink2)}
.model li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:2px;background:var(--lc);opacity:.45}
.wnote{margin-top:16px;font-size:13.5px;color:var(--ink2);background:#2a2510;border:1px solid #4a3f16;border-radius:10px;padding:12px 15px;line-height:1.5}

/* ---------- action bar ---------- */
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions .gap{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .13s;box-shadow:var(--sh)}
.btn:hover{border-color:var(--mute);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.got{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.btn.got:hover{background:var(--ok-t)}
.btn.miss{color:var(--no);border-color:color-mix(in srgb,var(--no) 35%,var(--line))}
.btn.miss:hover{background:var(--no-t)}
.btn.icon{padding:10px 12px}
.btn.starred{background:var(--star);border-color:var(--star);color:#3a2800}
.kbd{font-family:var(--mono);font-size:10px;background:var(--line2);border:1px solid var(--line);border-radius:4px;padding:1px 4px;color:var(--mute)}

.progline{height:5px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:22px}
.progline i{display:block;height:100%;background:var(--lc);border-radius:4px;transition:width .35s}

/* ---------- home ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 36px;box-shadow:var(--sh);margin-bottom:22px;position:relative;overflow:hidden}
.hero h2{font-family:var(--disp);font-weight:800;font-size:clamp(28px,4.6vw,40px);letter-spacing:-1.1px;line-height:1.05;margin:10px 0 10px;max-width:19ch}
.hero p{color:var(--ink2);max-width:56ch;margin:0 0 24px;font-size:15.5px}
.bigstats{display:flex;gap:34px;flex-wrap:wrap}
.bigstat b{font-family:var(--disp);font-size:30px;font-weight:700;display:block;line-height:1;letter-spacing:-.8px}
.bigstat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;color:var(--mute);text-transform:uppercase}

.startgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:26px}
@media (max-width:560px){.startgrid{grid-template-columns:1fr}}
.startcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;box-shadow:var(--sh);text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s;border-top:4px solid var(--tc)}
.startcard:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--tc)}
.startcard h4{font-family:var(--disp);font-weight:700;font-size:17px;margin:10px 0 5px;letter-spacing:-.3px}
.startcard p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.45}
.startcard .ic{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);display:grid;place-items:center}
.startcard .ic svg{width:19px;height:19px}

.sectitle{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}

.lecrows{display:flex;flex-direction:column;gap:8px}
.lecrow{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;transition:transform .13s,box-shadow .13s}
.lecrow:hover{transform:translateX(3px);box-shadow:var(--sh)}
.lecrow .lnum{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--lc);width:26px;flex:none}
.lecrow .lname{flex:1;font-weight:500;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lecrow .lcount{font-family:var(--mono);font-size:11.5px;color:var(--mute);flex:none}
.lecbar{width:110px;height:6px;background:var(--line2);border-radius:4px;overflow:hidden;flex:none}
.lecbar i{display:block;height:100%;background:var(--lc);transition:width .4s}
@media (max-width:640px){.lecbar{display:none}}

/* ---------- results ---------- */
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:var(--sh);text-align:center}
.scorebig{font-family:var(--disp);font-size:64px;font-weight:800;letter-spacing:-2.5px;line-height:1;margin:14px 0 4px}
.scoresub{color:var(--ink2);margin:0 0 26px}
.breakdown{display:flex;flex-direction:column;gap:7px;margin:24px 0 6px;text-align:left}
.brow{display:flex;align-items:center;gap:12px;font-size:13.5px}
.brow .bn{font-family:var(--mono);font-size:11px;color:var(--lc);font-weight:600;width:30px;flex:none}
.brow .bt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.brow .bb{width:90px;height:6px;background:var(--line2);border-radius:4px;overflow:hidden;flex:none}
.brow .bb i{display:block;height:100%;background:var(--lc)}
.brow .bs{font-family:var(--mono);font-size:11.5px;color:var(--mute);width:46px;text-align:right;flex:none}

/* ---------- empty ---------- */
.empty{text-align:center;padding:70px 24px;color:var(--ink2)}
.empty h3{font-family:var(--disp);font-size:21px;margin:0 0 8px;color:var(--ink)}
.empty p{margin:0 auto 18px;max-width:44ch;font-size:14.5px}

/* ---------- search overlay ---------- */
.overlay{position:fixed;inset:0;z-index:70;display:none}
.overlay.open{display:block}
.overlay .back{position:absolute;inset:0;background:rgba(22,26,34,.4);backdrop-filter:blur(3px)}
.overlay .panel{position:absolute;top:0;left:0;right:0;max-height:86vh;background:var(--card);border-radius:0 0 20px 20px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden;animation:drop .22s ease}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.ohead{padding:16px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--mute)}
.ohead b{color:var(--ink);font-family:var(--disp)}
.ohead .x{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 9px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--ink2)}
.olist{overflow-y:auto;padding:8px}
.ohit{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 18px;border-radius:11px;cursor:pointer;transition:background .1s}
.ohit:hover{background:var(--line2)}
.ohit .top{display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.ohit .lchip{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.6px;color:#fff;background:var(--lc);padding:2px 7px;border-radius:5px}
.ohit .t{font-weight:600;font-size:14.5px;line-height:1.35}
.ohit .s{font-size:13.2px;color:var(--ink2);line-height:1.45}
.ohit mark{background:color-mix(in srgb,var(--star) 34%,transparent);color:inherit;border-radius:2px;padding:0 1.5px}

/* ---------- misc ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--chip);color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:90;opacity:0;transition:all .25s;box-shadow:var(--sh-lg)}
.toast.show{transform:translateX(-50%);opacity:1}
.warnbar{background:#332907;border-bottom:1px solid #4a3f16;color:#f0c766;font-size:13px;padding:9px 26px;text-align:center}

@media (max-width:560px){
  .mode{padding:7px 9px;font-size:12.5px}
  .mode .n{display:none}
  .modes{padding:3px;gap:2px}
  .ltag{max-width:58vw;overflow:hidden;text-overflow:ellipsis}
  .bigstats{gap:20px}
  .actions .kbd{display:none}
}
@media (max-width:820px){
  .masthead{padding:14px 16px 0}
  .toolbar{padding:12px 16px}
  .stage{padding:22px 16px 80px}
  .qcard,.wcard{padding:24px 20px}
  .face{padding:32px 24px}
  .face .flabel{left:24px}
  .hero{padding:26px 22px}
  .seg .num{font-size:9px}
  .modes{width:100%;overflow-x:auto}
}
</style>
</head>
<body>

<header class="masthead" id="masthead">
  <div class="mh-top">
    <div>
      <h1 class="wordmark">PHAR222 <span>Question Bank</span></h1>
      <div class="sub" id="subline">335 questions · 18 lectures</div>
    </div>
    <div class="gap"></div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search all questions…" autocomplete="off">
    </div>
  </div>
  <div class="spectrum" id="spectrum"></div>
</header>

<div class="toolbar">
  <div class="modes" id="modes"></div>
  <button class="tog" id="tStar">☆ Starred</button>
  <button class="tog" id="tWeak">Needs work</button>
  <div class="gap"></div>
  <span class="filtnote" id="filtnote"></span>
  <button class="linkbtn" id="clearFilt" hidden>Clear filters</button>
</div>

<main class="stage" id="stage"></main>

<div class="overlay" id="overlay">

  <div class="panel">

<script>
const BANK = [{"n": 1, "title": "Introduction to Pharmacology & Receptors", "fc": [{"q": "What two properties does a full agonist have that an antagonist lacks?", "a": "Efficacy (antagonists have affinity only, zero efficacy)."}, {"q": "Which receptor family produces the fastest response, and why?", "a": "Ligand-gated ion channels - the ligand directly opens the channel with no intermediate signalling steps."}, {"q": "Which receptor family produces the slowest but longest-lasting effects?", "a": "Nuclear receptors - act via gene transcription."}, {"q": "A drug binds strongly to its receptor but produces only a small response. Describe its affinity and efficacy.", "a": "High affinity, low efficacy."}, {"q": "What is potency most closely related to?", "a": "Affinity."}, {"q": "What is a biopharmaceutical?", "a": "A therapeutic product manufactured using living systems, e.g. recombinant insulin produced in E. coli."}, {"q": "What is rational drug design?", "a": "Designing a drug based on the known structure and function of its biological target, rather than trial-and-error screening."}, {"q": "What do CAR-T cells target?", "a": "Tumour antigens - T cells are engineered with a chimeric antigen receptor."}, {"q": "What is the role of RNA polymerase?", "a": "Synthesises RNA from a DNA template (transcription)."}, {"q": "Name the natural sources of paclitaxel, morphine, aspirin and quinine.", "a": "Yew tree, poppy plant, willow bark, cinchona bark."}, {"q": "Give an example of a drug acting on nucleic acids.", "a": "Ciprofloxacin - inhibits bacterial DNA gyrase/topoisomerase."}, {"q": "What is a kinase-linked receptor, how fast does it act, and give an example.", "a": "A receptor that activates enzymatic (kinase) cascades on ligand binding, with a response speed of minutes (slower than ligand-gated channels and GPCRs, faster than nuclear receptors). Example: the insulin receptor, a receptor tyrosine kinase."}, {"q": "Define ED50.", "a": "The dose of a drug that produces 50% of its maximum effect in a population; reflects potency."}, {"q": "Worked example: Drug A and Drug B produce the same maximum effect, but Drug A needs a lower dose to get there. What does this tell you about potency and efficacy?", "a": "Drug A is more potent (less dose needed for the same effect). The two drugs have equal efficacy, since they reach the same maximum response - only the dose required differs, not the ceiling effect."}, {"q": "Are synthetic drugs always less effective than natural products?", "a": "No. Synthetic drugs are not inherently less effective; their main practical advantage is that they are scalable and have consistent quality, unlike natural products which can vary batch to batch."}, {"q": "In the Michaelis-Menten equation, what does Km represent?", "a": "The substrate concentration at which the reaction velocity is half of Vmax; a lower Km indicates higher enzyme affinity for the substrate."}], "mcq": [{"q": "Which statement is true about synthetic drugs?", "opts": [{"k": "a", "t": "They cannot be modified once produced"}, {"k": "b", "t": "They are always less effective than natural products"}, {"k": "c", "t": "They are scalable and have consistent quality"}, {"k": "d", "t": "They are always cheaper to develop"}, {"k": "e", "t": "They pose no environmental risks"}], "ans": "c", "ansText": "c) They are scalable and have consistent quality"}, {"q": "Which receptor family involves gene transcription and produces the slowest response?", "opts": [{"k": "a", "t": "GPCR"}, {"k": "b", "t": "Ligand-gated ion channel"}, {"k": "c", "t": "Nuclear receptor"}, {"k": "d", "t": "Kinase-linked receptor"}, {"k": "e", "t": "Ionotropic receptor"}], "ans": "c", "ansText": "c) Nuclear receptor"}, {"q": "Which of the following best defines efficacy in pharmacology?", "opts": [{"k": "a", "t": "The ability of a drug to bind a receptor"}, {"k": "b", "t": "The degree of response a drug produces"}, {"k": "c", "t": "The inverse of EC50"}, {"k": "d", "t": "The drug concentration required to produce binding"}, {"k": "e", "t": "The same as affinity"}], "ans": "b", "ansText": "b) The degree of response a drug produces"}, {"q": "Which term describes the concentration of drug required to produce 50% of its maximal effect?", "opts": [{"k": "a", "t": "Potency"}, {"k": "b", "t": "Efficacy"}, {"k": "c", "t": "Affinity"}, {"k": "d", "t": "Therapeutic index"}], "ans": "a", "ansText": "a) Potency"}, {"q": "Which is an example of a nuclear receptor ligand?", "opts": [{"k": "a", "t": "Adrenaline"}, {"k": "b", "t": "Cortisol"}, {"k": "c", "t": "Acetylcholine"}, {"k": "d", "t": "Dopamine"}], "ans": "b", "ansText": "b) Cortisol"}, {"q": "Which is an example of a drug acting on nucleic acids?", "opts": [{"k": "a", "t": "Ciprofloxacin"}, {"k": "b", "t": "Metformin"}, {"k": "c", "t": "Lidocaine"}, {"k": "d", "t": "Salbutamol"}], "ans": "a", "ansText": "a) Ciprofloxacin"}, {"q": "Which is a recombinant protein?", "opts": [{"k": "a", "t": "Insulin produced in E. coli"}, {"k": "b", "t": "Morphine"}, {"k": "c", "t": "Penicillin"}, {"k": "d", "t": "Vitamin D"}], "ans": "a", "ansText": "a) Insulin produced in E. coli"}, {"q": "What is the primary action of an antagonist at a receptor site?", "opts": [{"k": "a", "t": "It activates the receptor to produce a maximal biological response."}, {"k": "b", "t": "It binds to the receptor without activating it and blocks the natural messenger."}, {"k": "c", "t": "It binds to the receptor and mimics the natural messenger."}, {"k": "d", "t": "It enhances the receptor activity by binding to an allosteric site."}], "ans": "b", "ansText": "b) It binds to the receptor without activating it and blocks the natural messenger."}, {"q": "Which of the following best describes the action of a partial agonist?", "opts": [{"k": "a", "t": "Activates the receptor fully at low doses"}, {"k": "b", "t": "Binds but produces no effect"}, {"k": "c", "t": "Produces a weaker response than a full agonist"}, {"k": "d", "t": "Competes irreversibly with the endogenous ligand"}], "ans": "c", "ansText": "c) Produces a weaker response than a full agonist"}, {"q": "Which term best describes a drug that binds to a receptor but produces the opposite effect of an agonist by stabilising the receptor in its inactive state?", "opts": [{"k": "a", "t": "Full Agonist"}, {"k": "b", "t": "Partial Agonist"}, {"k": "c", "t": "Inverse Agonist"}, {"k": "d", "t": "Antagonist"}], "ans": "c", "ansText": "c) Inverse Agonist"}, {"q": "An allosteric modulator binds to which part of the receptor?", "opts": [{"k": "a", "t": "The same site as the endogenous ligand"}, {"k": "b", "t": "DNA-binding domain"}, {"k": "c", "t": "An intracellular kinase domain"}, {"k": "d", "t": "A site distinct from the active site"}], "ans": "d", "ansText": "d) A site distinct from the active site"}, {"q": "Which parameter from the Michaelis-Menten equation reflects the substrate concentration at half the maximum reaction velocity?", "opts": [{"k": "a", "t": "Vmax"}, {"k": "b", "t": "Ki"}, {"k": "c", "t": "Km"}, {"k": "d", "t": "Kcat"}], "ans": "c", "ansText": "c) Km"}], "saq": [{"title": "Potency and Efficacy (10 marks)", "marks": 10, "prompt": "Explain how drugs interact with receptors to produce or prevent a response. a) Define an agonist (2) b) Define an antagonist (2) c) Define potency (2) d) Define efficacy (2) e) Describe TWO differences between an agonist and an antagonist (2)", "points": ["Agonist (2 marks): a drug that binds a receptor and produces a biological response. Has both affinity (binds the receptor) and efficacy (positive intrinsic activity).", "Antagonist (2 marks): a drug that binds a receptor but does not activate it, thereby blocking the endogenous ligand or an agonist from acting. Has affinity but zero efficacy.", "Potency (2 marks): the dose or concentration of a drug required to produce a given effect. A more potent drug produces the same effect at a lower dose. Commonly expressed as EC50/ED50.", "Efficacy (2 marks): the maximum effect a drug can produce (Emax), once all available receptors are occupied, regardless of dose.", "Two differences (2 marks): (1) agonists activate the receptor and possess efficacy, whereas antagonists bind but do not activate the receptor and have no efficacy; (2) agonists produce a biological response, whereas antagonists reduce or prevent the response produced by an agonist or the endogenous ligand."], "note": ""}], "case": []}, {"n": 2, "title": "Receptor Pharmacology & Pharmacodynamics", "fc": [{"q": "What does a competitive antagonist do to the dose-response curve?", "a": "Causes a parallel rightward shift; Emax unchanged (surmountable by more agonist)."}, {"q": "What does a non-competitive antagonist do to the dose-response curve?", "a": "Reduces the maximum response (Emax); not simply rightward-shifted."}, {"q": "How does a partial agonist bind, precisely?", "a": "It binds FULLY (full occupancy) but only partially activates the receptor - submaximal intrinsic activity. Do not say it 'partially binds'."}, {"q": "Define an inverse agonist by mechanism, not direction.", "a": "It binds the receptor and stabilises the INACTIVE conformation, reducing basal constitutive activity below baseline."}, {"q": "What is physiological antagonism?", "a": "Two agonists act on different receptors (not the same binding site) to produce opposite physiological effects, so one functionally cancels the other out. It is a system-level opposition, not a receptor-level block."}, {"q": "Give a clinical example of physiological antagonism.", "a": "Adrenaline in anaphylaxis: it acts at adrenergic receptors to cause bronchodilation and vasoconstriction, physiologically opposing the bronchoconstriction and vasodilation caused by histamine acting at H1 receptors."}, {"q": "How does physiological antagonism differ from pharmacological (receptor) antagonism?", "a": "Pharmacological antagonism involves a drug binding the same receptor as the agonist to block its effect. Physiological antagonism involves two different agonists acting at two different receptors, whose downstream effects oppose each other."}, {"q": "What are spare receptors?", "a": "A situation where the maximal response (Emax) can be achieved by occupying only a fraction of the total receptors available, meaning not every receptor needs to be occupied for a full effect."}, {"q": "What does the presence of spare receptors imply about EC50 versus Kd?", "a": "EC50 (concentration for 50% effect) is lower than Kd (concentration for 50% receptor occupancy), because a submaximal fraction of receptor occupancy is already enough to generate a large response."}, {"q": "Why are spare receptors clinically useful, using an analogy?", "a": "They build in a safety margin, like having more streetlights on a road than are strictly needed to light it: even if some lights (receptors) are out, the road (tissue response) can still be fully lit (maximal effect) because there was spare capacity to begin with."}, {"q": "Define tolerance.", "a": "A reduced response to a drug after repeated or prolonged exposure, such that a higher dose is needed to achieve the same effect as before."}, {"q": "Define desensitisation (tachyphylaxis) and how its timescale differs from tolerance.", "a": "Desensitisation is a rapid drop in response, occurring within minutes to hours of continued or repeated agonist exposure, usually due to receptor phosphorylation and internalisation. Tolerance develops more slowly, over days to weeks."}, {"q": "Name one molecular mechanism underlying receptor desensitisation.", "a": "GPCR phosphorylation by G-protein receptor kinases (GRKs), promoting beta-arrestin binding, uncoupling the receptor from its G-protein and triggering receptor internalisation."}], "mcq": [{"q": "A non-competitive antagonist is added to a system with a full agonist. What happens to Emax?", "opts": [{"k": "a", "t": "Increases"}, {"k": "b", "t": "Unchanged"}, {"k": "c", "t": "Decreases"}, {"k": "d", "t": "Shifts right only"}, {"k": "e", "t": "Becomes supramaximal"}], "ans": "c", "ansText": "c) Decreases"}, {"q": "Spare receptors are best described as:", "opts": [{"k": "a", "t": "Receptors that never bind drug"}, {"k": "b", "t": "Receptors present in excess of those needed to produce a maximal response"}, {"k": "c", "t": "Nonfunctional receptor mutations"}, {"k": "d", "t": "Receptors found only in reserve organs"}, {"k": "e", "t": "Backup receptors activated only in disease states"}], "ans": "b", "ansText": "b) Receptors present in excess of those needed to produce a maximal response"}, {"q": "Which statement best distinguishes desensitisation from tolerance?", "opts": [{"k": "a", "t": "Desensitisation takes weeks; tolerance takes minutes"}, {"k": "b", "t": "Desensitisation is rapid (minutes to hours) via receptor phosphorylation/internalisation; tolerance develops more slowly with repeated dosing"}, {"k": "c", "t": "They are interchangeable terms"}, {"k": "d", "t": "Desensitisation only occurs with antagonists"}, {"k": "e", "t": "Tolerance is reversible while desensitisation is permanent"}], "ans": "b", "ansText": "b) Desensitisation is rapid (minutes to hours) via receptor phosphorylation/internalisation; tolerance develops more slowly with repeated dosing"}, {"q": "Adrenaline reversing the bronchoconstriction of anaphylaxis (caused by histamine) is an example of:", "opts": [{"k": "a", "t": "Competitive antagonism"}, {"k": "b", "t": "Non-competitive antagonism"}, {"k": "c", "t": "Physiological antagonism"}, {"k": "d", "t": "Chemical antagonism"}, {"k": "e", "t": "Tachyphylaxis"}], "ans": "c", "ansText": "c) Physiological antagonism"}], "saq": [{"title": "Receptor Modulators (10 marks)", "marks": 10, "prompt": "Classify the main types of pharmacological modulators of receptor activity (agonists, antagonists, partial agonists, inverse agonists). For each type explain how it interacts with the receptor and alters signalling, and provide one clinical example.", "points": ["Agonist (2-3 marks): binds the receptor and fully activates it - has both affinity and efficacy (positive intrinsic activity), producing the maximal response. Example: noradrenaline, acting at adrenergic GPCRs. At alpha1 (Gq) it activates phospholipase C leading to IP3/DAG and increased Ca2+, causing vasoconstriction; at alpha2 (Gi) it inhibits adenylyl cyclase, lowering cAMP; at beta1 (Gs) it stimulates adenylyl cyclase, raising cAMP and increasing heart rate/contractility. Clinical use: septic shock and severe hypotension.", "Antagonist (2 marks): binds the receptor but does not activate it - affinity with zero efficacy. It occupies the site and prevents the endogenous ligand or an agonist from producing a response. Example: ondansetron blocks 5-HT3, a ligand-gated ion channel in the emetic pathway, preventing depolarisation and the nausea signal. Clinical use: chemotherapy-induced nausea and vomiting.", "Partial agonist (2 marks): binds FULLY to the receptor but only partially activates it - submaximal intrinsic activity, so it cannot reach the maximum response even at complete receptor occupancy. It can also act as a functional antagonist in the presence of a full agonist by competing for the same sites. Example: varenicline, a partial agonist at alpha4beta2 nicotinic receptors, used for smoking cessation.", "Inverse agonist (2 marks): binds the receptor and stabilises its INACTIVE conformation, reducing basal (constitutive) receptor activity below baseline. This differs from an antagonist, which simply blocks the site and leaves basal activity untouched. Example: rimonabant, a CB1 inverse agonist used for appetite suppression, withdrawn because of psychiatric adverse effects.", "Key difference to close on (1 mark): the four types differ by intrinsic activity - full agonist (maximal), partial agonist (submaximal), antagonist (zero), inverse agonist (negative, below constitutive baseline)."], "note": ""}], "case": []}, {"n": 3, "title": "Pharmacokinetics: Absorption & Distribution", "fc": [{"q": "What does AUC represent?", "a": "Total drug exposure over time (amount reaching systemic circulation)."}, {"q": "Which route has 100% bioavailability?", "a": "IV."}, {"q": "Which factor most increases tissue distribution (Vd)?", "a": "High lipid solubility."}, {"q": "Define the therapeutic window.", "a": "The range between the minimum effective concentration (MEC) and the minimum toxic concentration (MSC/MTC)."}, {"q": "A drug has a large Vd. Where is it?", "a": "Distributed extensively OUT of plasma and into tissues. A drug that stays in plasma has a SMALL Vd."}, {"q": "Define Cmax and Tmax.", "a": "Cmax is the maximum plasma concentration reached after a dose. Tmax is the time taken to reach Cmax."}, {"q": "Define MEC and MSC/MTC.", "a": "MEC (minimum effective concentration) is the lowest plasma level needed for a therapeutic effect. MSC/MTC (maximum safe / minimum toxic concentration) is the level above which toxicity becomes likely. The therapeutic range sits between the two."}, {"q": "If plasma concentration falls below the MEC, what happens clinically?", "a": "The drug is unlikely to produce the desired therapeutic effect - this is a failure of efficacy, not a toxicity issue."}, {"q": "Which route gives the fastest onset of systemic effect, and how does this differ from 'avoids first-pass metabolism'?", "a": "IV gives the fastest onset of systemic effect because it bypasses absorption entirely. This is a different property from avoiding first-pass metabolism: sublingual (and rectal) avoid first-pass metabolism by bypassing the portal circulation, but are not as fast in onset as IV."}], "mcq": [{"q": "If plasma drug concentration falls below the minimum effective concentration (MEC), the most likely consequence is:", "opts": [{"k": "a", "t": "Toxicity"}, {"k": "b", "t": "Loss of therapeutic effect"}, {"k": "c", "t": "Increased clearance"}, {"k": "d", "t": "Increased Vd"}, {"k": "e", "t": "Enzyme induction"}], "ans": "b", "ansText": "b) Loss of therapeutic effect"}, {"q": "Which pharmacokinetic parameter reflects total drug exposure?", "opts": [{"k": "a", "t": "Cmax"}, {"k": "b", "t": "Tmax"}, {"k": "c", "t": "AUC"}, {"k": "d", "t": "MEC"}, {"k": "e", "t": "Vd"}], "ans": "c", "ansText": "c) AUC"}, {"q": "Which of the following best defines therapeutic window?", "opts": [{"k": "a", "t": "The period of time when a drug is most effective"}, {"k": "b", "t": "The lowest possible dose needed to produce an effect"}, {"k": "c", "t": "The range between minimum effective concentration and minimum toxic concentration"}, {"k": "d", "t": "The maximum safe dose of a drug"}, {"k": "e", "t": "The difference in effect between brand and generic drugs"}], "ans": "c", "ansText": "c) The range between minimum effective concentration and minimum toxic concentration"}, {"q": "A drug with a large Vd is likely to:", "opts": [{"k": "a", "t": "Remain in plasma"}, {"k": "b", "t": "Distribute extensively into tissues"}, {"k": "c", "t": "Be highly water soluble"}, {"k": "d", "t": "Have minimal absorption"}, {"k": "e", "t": "Be eliminated renally unchanged"}], "ans": "b", "ansText": "b) Distribute extensively into tissues"}, {"q": "Clearance is defined as:", "opts": [{"k": "a", "t": "Drug amount divided by pKa"}, {"k": "b", "t": "Percentage of bioavailability"}, {"k": "c", "t": "Volume of plasma cleared of drug per unit time"}, {"k": "d", "t": "Rate of absorption from the gut"}], "ans": "c", "ansText": "c) Volume of plasma cleared of drug per unit time"}, {"q": "What is the significance of the half-life (t1/2) of a drug?", "opts": [{"k": "a", "t": "Defines therapeutic window"}, {"k": "b", "t": "Measures bioavailability"}, {"k": "c", "t": "Indicates drug potency"}, {"k": "d", "t": "Determines how often a drug should be administered"}], "ans": "d", "ansText": "d) Determines how often a drug should be administered"}, {"q": "What is bioavailability?", "opts": [{"k": "a", "t": "Fraction of administered dose reaching systemic circulation unchanged"}, {"k": "b", "t": "Ability to bind to plasma proteins"}, {"k": "c", "t": "Volume of drug in the body"}, {"k": "d", "t": "Rate of elimination from plasma"}], "ans": "a", "ansText": "a) Fraction of administered dose reaching systemic circulation unchanged"}], "saq": [{"title": "Pharmacokinetics vs Pharmacodynamics (10 marks)", "marks": 10, "prompt": "a) Define pharmacokinetics (2) b) Define pharmacodynamics (2) c) List the four components of ADME (4) d) State one example of information provided by pharmacokinetics (1) e) State one example of information provided by pharmacodynamics (1)", "points": ["Pharmacokinetics (2 marks): what the body does to the drug. Describes the movement of drug through the body over time - how it is absorbed, distributed, metabolised and excreted.", "Pharmacodynamics (2 marks): what the drug does to the body. Describes the drug's effects and the mechanisms by which it produces them, including receptor binding and signalling.", "ADME (4 marks, 1 each): Absorption - movement of drug from the site of administration into the bloodstream. Distribution - movement of drug from blood into tissues (Vd). Metabolism - chemical conversion of drug to metabolites, mainly in the liver. Excretion - removal of drug/metabolites from the body, mainly via the kidneys.", "Pharmacokinetics example (1 mark): any one of bioavailability, half-life, clearance, volume of distribution, Cmax/Tmax/AUC.", "Pharmacodynamics example (1 mark): any one of receptor activation, potency, efficacy, agonism/antagonism, therapeutic or adverse effect."], "note": ""}], "case": []}, {"n": 4, "title": "Pharmacokinetics: Metabolism & Excretion", "fc": [{"q": "Why does oral administration typically have lower bioavailability than IV?", "a": "First-pass metabolism in the liver (via the portal vein) before reaching systemic circulation."}, {"q": "Order the structures a drug passes on the oral/first-pass route.", "a": "Intestine to portal vein to liver to systemic circulation."}, {"q": "How long does it typically take to reach steady state for a drug with a 10-hour half-life?", "a": "~40-50 hours (4-5 half-lives)."}, {"q": "What happens in a Phase I metabolic reaction?", "a": "A functional group is introduced or exposed on the drug molecule, typically by oxidation, reduction, or hydrolysis. Cytochrome P450 enzymes carry out most Phase I oxidations. The product is usually more polar and may be active, inactive, or toxic."}, {"q": "What happens in a Phase II metabolic reaction?", "a": "A polar endogenous group is conjugated onto the drug or its Phase I metabolite, e.g. glucuronide, sulfate, acetyl, or glutathione. This greatly increases water solubility and prepares the compound for excretion."}, {"q": "Does every drug go through both phases?", "a": "No. Some drugs go straight to Phase II conjugation, some undergo only Phase I, and some are excreted unchanged."}, {"q": "List four factors that can alter the rate of drug metabolism.", "a": "Age (neonates and elderly have reduced hepatic enzyme activity), genetics (CYP450 polymorphisms produce poor, intermediate, extensive, or ultra-rapid metabolisers), disease states (liver disease reduces metabolic capacity), and drug interactions (enzyme inducers or inhibitors)."}, {"q": "Give a clinical example of a CYP450 genetic polymorphism affecting drug response.", "a": "CYP2D6 poor metabolisers convert less codeine into active morphine, giving inadequate pain relief; ultra-rapid metabolisers risk toxicity."}, {"q": "What are the major routes of drug excretion, and which is generally most important?", "a": "Renal excretion is most important. Other routes include biliary/faecal excretion, pulmonary excretion for volatile agents, and minor routes such as sweat, saliva, and breast milk."}, {"q": "Describe the three renal processes that together determine urinary excretion.", "a": "Glomerular filtration (free drug only), active tubular secretion (via transporters, including some protein-bound drug), and tubular reabsorption (lipophilic, non-ionised drug diffuses back into blood)."}, {"q": "Define clearance.", "a": "The theoretical volume of plasma completely cleared of drug per unit time (mL/min or L/hr), summed across all elimination routes."}, {"q": "How are clearance, volume of distribution, and half-life related?", "a": "t1/2 = 0.693 x Vd / Clearance. Half-life increases if Vd increases or clearance falls."}, {"q": "A patient with renal impairment is started on a drug that is 90% renally cleared unchanged. What happens to clearance, half-life, and what is the clinical consequence?", "a": "Clearance falls, half-life increases, and the drug will accumulate with repeated dosing unless dose or interval is adjusted, raising toxicity risk."}], "mcq": [{"q": "Which route of administration avoids first-pass metabolism?", "opts": [{"k": "a", "t": "Oral"}, {"k": "b", "t": "Sublingual"}, {"k": "c", "t": "Rectal (mostly)"}, {"k": "d", "t": "Both b and c"}, {"k": "e", "t": "None of the above"}], "ans": "d", "ansText": "d) Both b and c"}, {"q": "Which route of administration has the highest first-pass effect?", "opts": [{"k": "a", "t": "Oral"}, {"k": "b", "t": "IV"}, {"k": "c", "t": "Sublingual"}, {"k": "d", "t": "Intramuscular"}], "ans": "a", "ansText": "a) Oral"}, {"q": "Which of the following best describes a Phase II metabolic reaction?", "opts": [{"k": "a", "t": "Oxidation by cytochrome P450"}, {"k": "b", "t": "Conjugation with a polar group such as glucuronide to aid excretion"}, {"k": "c", "t": "Glomerular filtration"}, {"k": "d", "t": "Active tubular secretion"}, {"k": "e", "t": "Reduction of a functional group only"}], "ans": "b", "ansText": "b) Conjugation with a polar group such as glucuronide to aid excretion"}, {"q": "Which factor would most likely decrease drug clearance?", "opts": [{"k": "a", "t": "Enzyme induction by rifampicin"}, {"k": "b", "t": "Young, healthy adult"}, {"k": "c", "t": "Liver cirrhosis"}, {"k": "d", "t": "High hepatic blood flow"}, {"k": "e", "t": "CYP450 ultra-rapid metaboliser genotype"}], "ans": "c", "ansText": "c) Liver cirrhosis"}, {"q": "Reabsorption of a drug from the renal tubule back into the blood is favoured by:", "opts": [{"k": "a", "t": "High ionisation at urinary pH"}, {"k": "b", "t": "High lipid solubility and low ionisation"}, {"k": "c", "t": "Active transporter-mediated secretion"}, {"k": "d", "t": "Large molecular size"}, {"k": "e", "t": "High plasma protein binding"}], "ans": "b", "ansText": "b) High lipid solubility and low ionisation"}, {"q": "The 'first pass effect' refers to drug metabolism that occurs primarily in the:", "opts": [{"k": "a", "t": "Brain"}, {"k": "b", "t": "Plasma"}, {"k": "c", "t": "Liver and gastrointestinal tract"}, {"k": "d", "t": "Kidneys"}], "ans": "c", "ansText": "c) Liver and gastrointestinal tract"}], "saq": [], "case": []}, {"n": 5, "title": "Cell Signalling & the Autonomic Nervous System", "fc": [{"q": "Which enzyme does nitric oxide activate, and what does it produce?", "a": "Guanylyl cyclase, producing cGMP, causing vascular smooth muscle relaxation and vasodilation."}, {"q": "Which second messenger does adenylyl cyclase produce?", "a": "cAMP, from ATP."}, {"q": "List the six steps of signal transduction, in order.", "a": "1) Reception - ligand binds receptor. 2) Transduction - receptor activates an intracellular signal (e.g. a G protein). 3) Amplification - a second messenger is produced (e.g. cAMP), multiplying the signal. 4) Integration - the cell combines this signal with others to decide a response. 5) Response - the physiological effect occurs (e.g. contraction, secretion). 6) Signal termination - the signal is switched off (e.g. GTP hydrolysis, receptor desensitisation)."}, {"q": "Which step of signal transduction is responsible for amplifying the signal?", "a": "Amplification - second messenger production, e.g. adenylyl cyclase converting ATP to cAMP."}, {"q": "Walk through the full Gs-coupled GPCR signalling sequence from ligand binding to gene transcription.", "a": "Ligand binds the receptor, causing receptor activation. GDP is exchanged for GTP on the G protein. The GTP-bound G protein activates adenylyl cyclase, converting ATP to cAMP (the amplification step). cAMP activates Protein Kinase A (PKA), which phosphorylates a transcription regulator, altering gene transcription in the nucleus."}, {"q": "Give the key contrasting sympathetic vs parasympathetic effects across the body.", "a": "Heart rate: sympathetic increases it, parasympathetic decreases it (bradycardia). Airways: sympathetic causes bronchodilation, parasympathetic increases salivation. Pupils: sympathetic causes mydriasis (dilation), parasympathetic causes miosis (constriction). GI motility: sympathetic decreases it, parasympathetic increases it. Metabolism/bladder: sympathetic drives glycogenolysis, parasympathetic drives bladder emptying. Overall: sympathetic is the 'fight-or-flight' accelerator, parasympathetic is the 'rest-and-digest' brake."}], "mcq": [{"q": "Which second messenger is produced by adenylyl cyclase?", "opts": [{"k": "a", "t": "IP3"}, {"k": "b", "t": "DAG"}, {"k": "c", "t": "cAMP"}, {"k": "d", "t": "Ca2+"}, {"k": "e", "t": "ATP"}], "ans": "c", "ansText": "c) cAMP"}, {"q": "Nitric oxide signalling activates:", "opts": [{"k": "a", "t": "Guanylyl cyclase"}, {"k": "b", "t": "Adenylyl cyclase"}, {"k": "c", "t": "Phospholipase C"}, {"k": "d", "t": "Tyrosine kinase"}], "ans": "a", "ansText": "a) Guanylyl cyclase"}, {"q": "Which of the following would most likely occur during a parasympathetic response?", "opts": [{"k": "a", "t": "Dry mouth"}, {"k": "b", "t": "Pupil dilation"}, {"k": "c", "t": "Bronchodilation"}, {"k": "d", "t": "Reduced gastric motility"}, {"k": "e", "t": "Decreased heart rate"}], "ans": "e", "ansText": "e) Decreased heart rate"}, {"q": "Which receptor type dimerises and autophosphorylates upon ligand binding?", "opts": [{"k": "a", "t": "GPCR"}, {"k": "b", "t": "Ion channel"}, {"k": "c", "t": "RTK (Receptor Tyrosine Kinase)"}, {"k": "d", "t": "Nuclear receptor"}], "ans": "c", "ansText": "c) RTK (Receptor Tyrosine Kinase)"}, {"q": "Which second messenger is produced by adenylyl cyclase?", "opts": [{"k": "a", "t": "ATP"}, {"k": "b", "t": "Ca2+"}, {"k": "c", "t": "DAG"}, {"k": "d", "t": "cAMP"}], "ans": "d", "ansText": "d) cAMP"}, {"q": "What is the role of protein kinases in cell signalling?", "opts": [{"k": "a", "t": "Degrade cAMP"}, {"k": "b", "t": "Phosphorylate target proteins"}, {"k": "c", "t": "Produce calcium"}, {"k": "d", "t": "Bind to DNA directly"}], "ans": "b", "ansText": "b) Phosphorylate target proteins"}, {"q": "Which of the following best explains why beta-blocker overdose can cause life-threatening bradycardia and hypotension?", "opts": [{"k": "a", "t": "Increase Adenylyl cyclase activity which increases cAMP"}, {"k": "b", "t": "Blockade of beta1 receptors which decreases cAMP which decreases PKA activation"}, {"k": "c", "t": "Direct inhibition of calcium channels"}], "ans": "b", "ansText": "b) Blockade of beta1 receptors which decreases cAMP which decreases PKA activation"}, {"q": "The 'fight or flight' response is mediated by the:", "opts": [{"k": "a", "t": "Enteric nervous system"}, {"k": "b", "t": "Sympathetic nervous system"}, {"k": "c", "t": "Parasympathetic nervous system"}, {"k": "d", "t": "Somatic nervous system"}], "ans": "b", "ansText": "b) Sympathetic nervous system"}], "saq": [], "case": []}, {"n": 6, "title": "Cholinergic Signalling", "fc": [{"q": "Muscarinic M2 vs M3 - where is each located and what does activation cause?", "a": "M2 (heart) causes decreased HR; M3 (GI, bronchi, glands, eye, bladder) causes contraction/secretion."}, {"q": "What type of receptor is nicotinic, and where are Nm vs Nn found?", "a": "Ligand-gated ion channel; Nm = neuromuscular junction, Nn = autonomic ganglia and adrenal medulla."}, {"q": "What are the common side effects of AChE inhibitors like donepezil?", "a": "Increased salivation/sweating, bradycardia, GI upset (cholinergic excess)."}, {"q": "What are the clinical uses of acetylcholinesterase inhibitors?", "a": "Myasthenia gravis (increases neuromuscular junction strength), Alzheimer's disease (increases CNS cholinergic activity), reversal of non-depolarising neuromuscular blockade after surgery, and organophosphate poisoning management is the reverse situation - AChE inhibitor toxicity treated with atropine to block the resulting muscarinic excess."}, {"q": "Besides the muscarinic side effects, what side effects arise from nicotinic and CNS overstimulation with AChE inhibitors?", "a": "Nicotinic overstimulation: muscle cramps and fasciculations. CNS side effects (for agents that cross the blood-brain barrier): dizziness, headache, confusion."}, {"q": "Why are muscarinic agonists like bethanechol contraindicated in asthma?", "a": "M3 activation in the airway causes bronchoconstriction, which would worsen asthma."}, {"q": "What is the mechanism of oxybutynin in overactive bladder?", "a": "Blocks M3 receptors on the detrusor muscle, reducing the IP3/DAG/Ca2+ signalling that drives contraction, so detrusor contraction is reduced and bladder overactivity is controlled."}, {"q": "What are the substrates and enzyme for acetylcholine synthesis?", "a": "Choline + acetyl-CoA, combined by choline acetyltransferase (ChAT) in the presynaptic terminal."}, {"q": "Which transporter step is rate-limiting in ACh synthesis?", "a": "High-affinity choline uptake into the presynaptic terminal (blocked by hemicholinium)."}, {"q": "How is ACh loaded into vesicles, and how is it released?", "a": "Loaded by the vesicular ACh transporter (VAChT); released when an action potential opens voltage-gated Ca2+ channels, triggering vesicle fusion and exocytosis."}, {"q": "How is the ACh signal terminated?", "a": "Acetylcholinesterase in the synaptic cleft hydrolyses ACh into choline and acetate; choline is recycled by reuptake."}, {"q": "Which receptor does varenicline act on, and how?", "a": "alpha4beta2 nicotinic receptors - a partial agonist, reducing cravings while blunting nicotine's full effect. Used for smoking cessation."}], "mcq": [{"q": "Which muscarinic receptor subtype slows heart rate?", "opts": [{"k": "a", "t": "M1"}, {"k": "b", "t": "M2"}, {"k": "c", "t": "M3"}, {"k": "d", "t": "M4"}, {"k": "e", "t": "M5"}], "ans": "b", "ansText": "b) M2"}, {"q": "Nicotinic receptors are best classified as:", "opts": [{"k": "a", "t": "GPCRs"}, {"k": "b", "t": "Nuclear receptors"}, {"k": "c", "t": "Ligand-gated ion channels"}, {"k": "d", "t": "Kinase-linked receptors"}, {"k": "e", "t": "Enzyme-linked receptors"}], "ans": "c", "ansText": "c) Ligand-gated ion channels"}, {"q": "A drug that competitively blocks acetylcholine at nicotinic receptors at the NMJ is likely to cause:", "opts": [{"k": "a", "t": "Bronchodilation"}, {"k": "b", "t": "Muscle relaxation"}, {"k": "c", "t": "Muscle contraction"}], "ans": "b", "ansText": "b) Muscle relaxation"}, {"q": "What is the effect of muscarinic receptor activation on the heart?", "opts": [{"k": "a", "t": "Increased heart rate"}, {"k": "b", "t": "Decreased heart rate"}, {"k": "c", "t": "Bronchodilation"}, {"k": "d", "t": "Vasoconstriction"}], "ans": "b", "ansText": "b) Decreased heart rate"}, {"q": "The parasympathetic nervous system primarily uses which neurotransmitter at effector organs?", "opts": [{"k": "a", "t": "Dopamine"}, {"k": "b", "t": "Acetylcholine"}, {"k": "c", "t": "Norepinephrine"}, {"k": "d", "t": "Serotonin"}], "ans": "b", "ansText": "b) Acetylcholine"}, {"q": "Which of the following best describes a key difference between muscarinic and nicotinic receptors?", "opts": [{"k": "a", "t": "Muscarinic use second messengers; nicotinic cause direct depolarisation"}, {"k": "b", "t": "Muscarinic mediate fast synaptic transmission, nicotinic are slow"}, {"k": "c", "t": "Muscarinic are ligand-gated ion channels, nicotinic are GPCRs"}, {"k": "d", "t": "Muscarinic are primarily found in ganglia, nicotinic at effector organs"}], "ans": "a", "ansText": "a) Muscarinic use second messengers; nicotinic cause direct depolarisation"}, {"q": "Which muscarinic receptor subtype is primarily involved in slowing the heart rate?", "opts": [{"k": "a", "t": "M1"}, {"k": "b", "t": "M2"}, {"k": "c", "t": "M4"}, {"k": "d", "t": "M3"}], "ans": "b", "ansText": "b) M2"}], "saq": [{"title": "Muscarinic vs Nicotinic Receptors (10 marks)", "marks": 10, "prompt": "Compare and contrast muscarinic and nicotinic receptors in terms of structure, location, and function.", "points": ["Structure (2-3 marks): Muscarinic = GPCRs (metabotropic, slower, second-messenger mediated). Nicotinic = ligand-gated ion channels (ionotropic, fast, direct channel opening).", "Location (2-3 marks): Muscarinic - CNS and parasympathetic target organs (heart [M2], smooth muscle/glands [M3] - GI tract, bronchi, salivary glands, eye, bladder). Nicotinic - Nm at the neuromuscular junction (skeletal muscle); Nn at autonomic ganglia and adrenal medulla.", "Function/speed (2-3 marks): Muscarinic produce slower, more prolonged, modulatory responses (e.g. decreased HR via M2/Gi, increased secretion/contraction via M3/Gq). Nicotinic produce fast, brief excitatory responses (e.g. immediate skeletal muscle depolarisation/contraction, fast ganglionic transmission).", "Key difference statement (1-2 marks): Muscarinic receptors signal through G-proteins and second messengers (slow); nicotinic receptors directly gate ion flow through the receptor itself (fast)."], "note": ""}, {"title": "Acetylcholine Lifecycle (10 marks)", "marks": 10, "prompt": "Describe the lifecycle of acetylcholine (ACh) at a cholinergic synapse. As part of your answer discuss neurotransmitter synthesis, release, receptor activation and signal termination.", "points": ["Synthesis (2-3 marks): choline + acetyl-CoA are combined by choline acetyltransferase (ChAT) in the cytoplasm of the presynaptic terminal. Choline enters via a high-affinity choline transporter - this uptake is the rate-limiting step. ACh is then loaded into synaptic vesicles by the vesicular ACh transporter (VAChT).", "Release (2 marks): an action potential depolarises the presynaptic terminal, opening voltage-gated Ca2+ channels. Ca2+ influx triggers vesicle fusion with the presynaptic membrane and ACh is released into the synaptic cleft by exocytosis.", "Receptor activation (3 marks): ACh diffuses across the cleft and binds postsynaptic cholinergic receptors. Nicotinic receptors are ligand-gated ion channels - binding opens the channel directly, giving a fast response at the NMJ (skeletal muscle contraction) and autonomic ganglia. Muscarinic receptors are GPCRs giving slower, longer responses: M2 (Gi) in the heart lowers cAMP and slows rate; M3 (Gq) in smooth muscle and glands raises IP3/DAG and Ca2+, causing contraction and secretion.", "Signal termination (2 marks): acetylcholinesterase in the synaptic cleft rapidly hydrolyses ACh into choline and acetate. Choline is taken back up into the presynaptic terminal and recycled. This is the step blocked by AChE inhibitors such as donepezil, which prolong ACh action."], "note": ""}, {"title": "Muscarinic Agonists vs Antagonists (10 marks)", "marks": 10, "prompt": "Compare muscarinic agonists and muscarinic antagonists. For each drug class: (1) explain the mechanism of action at muscarinic receptors (6 marks); (2) describe how this mechanism underlies their therapeutic use (2 marks); (3) outline the potential side effects that arise from their action (2 marks).", "points": ["Muscarinic agonist - bethanechol. Mechanism: binds M3 receptors, GPCRs coupled to Gq, on the bladder detrusor muscle. Gq activates phospholipase C, generating IP3 and DAG, raising intracellular Ca2+, causing detrusor contraction. Therapeutic use: postoperative or neurogenic urinary retention. Side effects: generalised parasympathetic activation - bradycardia, nausea, increased GI secretions and motility, sweating, salivation.", "Muscarinic antagonist - atropine. Mechanism: blocks M2 receptors, GPCRs coupled to Gi, in the heart. Normally Gi inhibits adenylyl cyclase and lowers cAMP; blocking M2 removes that inhibition, so cAMP rises and sinoatrial firing increases. Therapeutic use: symptomatic bradycardia. Side effects: loss of parasympathetic tone - tachycardia, dry mouth, constipation, urinary retention, blurred vision, mydriasis.", "Key difference: agonists activate the Gq/IP3/Ca2+ pathway to produce parasympathetic effects; antagonists remove Gi-mediated inhibition and produce the sympathetic-appearing opposite. Their side effect profiles are mirror images of each other."], "note": ""}], "case": []}, {"n": 7, "title": "Adrenergic Signalling", "fc": [{"q": "Name the Gq-linked adrenergic receptor and its second messengers.", "a": "alpha1 - IP3/DAG (via phospholipase C), releasing Ca2+."}, {"q": "Name the Gi-linked adrenergic receptor and its main action.", "a": "alpha2 - decreased cAMP; negative feedback, inhibits further NA release."}, {"q": "Which adrenergic receptor increases heart rate and contractility?", "a": "beta1 (Gs, increased cAMP, activates PKA)."}, {"q": "Which adrenergic receptor causes bronchodilation?", "a": "beta2."}, {"q": "What is the major side effect to warn a hypertensive/BPH patient about when starting an alpha-1 antagonist (e.g. prazosin)?", "a": "Orthostatic (postural) hypotension."}, {"q": "Which enzyme converts noradrenaline to adrenaline in the adrenal medulla?", "a": "PNMT (phenylethanolamine N-methyltransferase)."}, {"q": "Which enzyme is rate-limiting in catecholamine synthesis?", "a": "Tyrosine hydroxylase."}, {"q": "What do alpha2 agonists do to sympathetic tone in the CNS?", "a": "Reduce it - central alpha2 stimulation decreases sympathetic outflow (basis of clonidine's antihypertensive effect)."}, {"q": "What effects are expected from a beta2 agonist, and what would NOT be expected?", "a": "Expected: bronchodilation, vasodilation (skeletal muscle), and possibly a mild reflex increase in heart rate. NOT expected: bronchoconstriction or increased GI motility - those are the opposite of what beta2 stimulation does."}], "mcq": [{"q": "Which second messenger system is activated by alpha1-adrenergic receptors?", "opts": [{"k": "a", "t": "Increased cAMP"}, {"k": "b", "t": "Decreased cAMP"}, {"k": "c", "t": "IP3/DAG"}, {"k": "d", "t": "cGMP"}, {"k": "e", "t": "Tyrosine kinase"}], "ans": "c", "ansText": "c) IP3/DAG"}, {"q": "Which enzyme is responsible for converting noradrenaline to adrenaline?", "opts": [{"k": "a", "t": "COMT"}, {"k": "b", "t": "MAO"}, {"k": "c", "t": "PNMT"}, {"k": "d", "t": "Tyrosine hydroxylase"}, {"k": "e", "t": "Tryptophan hydroxylase"}], "ans": "c", "ansText": "c) PNMT"}, {"q": "Which adrenergic receptor is targeted by metoprolol?", "opts": [{"k": "a", "t": "alpha1"}, {"k": "b", "t": "alpha2"}, {"k": "c", "t": "beta1"}, {"k": "d", "t": "beta2"}, {"k": "e", "t": "beta3"}], "ans": "c", "ansText": "c) beta1"}, {"q": "A patient on an alpha-1 antagonist for BPH/hypertension should be warned about:", "opts": [{"k": "a", "t": "Bradycardia"}, {"k": "b", "t": "Hyperglycemia"}, {"k": "c", "t": "Orthostatic hypotension"}, {"k": "d", "t": "Bronchospasm"}, {"k": "e", "t": "Constipation"}], "ans": "c", "ansText": "c) Orthostatic hypotension"}, {"q": "Which G-protein is coupled to alpha2-adrenergic receptors?", "opts": [{"k": "a", "t": "Gs"}, {"k": "b", "t": "Gq"}, {"k": "c", "t": "Gi"}, {"k": "d", "t": "Gb"}, {"k": "e", "t": "Gt"}], "ans": "c", "ansText": "c) Gi"}, {"q": "alpha2-adrenoceptor agonists in the CNS generally:", "opts": [{"k": "a", "t": "Increase sympathetic tone"}, {"k": "b", "t": "Reduce sympathetic tone"}, {"k": "c", "t": "Cause tachycardia"}, {"k": "d", "t": "Cause bronchodilation"}], "ans": "b", "ansText": "b) Reduce sympathetic tone"}, {"q": "Which of the following effects is mediated by beta1-adrenergic receptor stimulation?", "opts": [{"k": "a", "t": "Decreased AV node conduction"}, {"k": "b", "t": "Relaxation of the bladder detrusor muscle"}, {"k": "c", "t": "Increased heart rate and contractility"}, {"k": "d", "t": "Vasodilation of skeletal muscle vessels"}], "ans": "c", "ansText": "c) Increased heart rate and contractility"}], "saq": [{"title": "Adrenergic Receptors (10 marks)", "marks": 10, "prompt": "Describe the signalling pathways and main physiological effects of alpha1, alpha2, and beta adrenergic receptors, and identify the clinical relevance of drugs targeting each.", "points": ["alpha1 (2-3 marks): Gq-coupled, activates phospholipase C leading to IP3/DAG and increased intracellular Ca2+, causing smooth muscle contraction. Physiological effects: vasoconstriction (increased BP), mydriasis, decreased GI motility, bladder sphincter contraction. Clinical: noradrenaline for septic shock; prazosin for hypertension and BPH (side effect: orthostatic hypotension).", "alpha2 (2-3 marks): Gi-coupled, decreases adenylyl cyclase and cAMP. Physiological effects: presynaptic negative feedback (reduces further NA release), decreased insulin secretion, decreased GI/bladder motility, central sedation/analgesia. Clinical: clonidine for hypertension, ADHD, and opioid withdrawal.", "beta (beta1 and beta2) (3-4 marks): Gs-coupled, increases adenylyl cyclase and cAMP, activating PKA. beta1: increased heart rate, contractility, renin release. beta2: bronchodilation, vasodilation in skeletal muscle, uterine relaxation, glycogenolysis. Clinical: metoprolol (beta1-selective antagonist) for hypertension/arrhythmias; salbutamol (beta2 agonist) for asthma.", "Key differences (1 mark): alpha1 raises Ca2+ via Gq; alpha2 lowers cAMP via Gi; beta raises cAMP via Gs - opposite direction of the same second messenger for alpha2 vs beta."], "note": ""}], "case": []}, {"n": 8, "title": "Serotonergic Signalling", "fc": [{"q": "Which 5-HT receptor mediates migraine treatment via vasoconstriction?", "a": "5-HT1B."}, {"q": "Which 5-HT receptor is a ligand-gated ion channel and mediates emesis?", "a": "5-HT3."}, {"q": "Which enzyme is rate-limiting in serotonin synthesis?", "a": "Tryptophan hydroxylase."}, {"q": "How do SSRIs work?", "a": "Inhibit serotonin reuptake at the synapse, increasing synaptic serotonin."}, {"q": "Which receptor does ondansetron block, and why does that stop nausea?", "a": "5-HT3, a ligand-gated ion channel. Blocking it prevents depolarisation in the emetic pathway."}], "mcq": [{"q": "Which 5-HT receptor subtype mediates emesis?", "opts": [{"k": "a", "t": "5-HT1A"}, {"k": "b", "t": "5-HT1B"}, {"k": "c", "t": "5-HT2A"}, {"k": "d", "t": "5-HT3"}, {"k": "e", "t": "5-HT4"}], "ans": "d", "ansText": "d) 5-HT3"}, {"q": "SSRIs work by:", "opts": [{"k": "a", "t": "Inhibiting MAO"}, {"k": "b", "t": "Blocking 5-HT receptors"}, {"k": "c", "t": "Inhibiting serotonin reuptake"}, {"k": "d", "t": "Stimulating serotonin synthesis"}, {"k": "e", "t": "Blocking dopamine reuptake"}], "ans": "c", "ansText": "c) Inhibiting serotonin reuptake"}, {"q": "Which of the following receptors is NOT a G-protein-coupled receptor?", "opts": [{"k": "a", "t": "5-HT7"}, {"k": "b", "t": "5-HT2C"}, {"k": "c", "t": "5-HT4"}, {"k": "d", "t": "5-HT3"}], "ans": "d", "ansText": "d) 5-HT3"}], "saq": [{"title": "Serotonin Receptors and Clinical Relevance (10 marks)", "marks": 10, "prompt": "Describe the receptor subtypes and signalling of the serotonin (5-HT) system, and explain the clinical relevance of drugs that target it, including the mechanism of action of SSRIs.", "points": ["Synthesis (1 mark): serotonin is synthesised from tryptophan; tryptophan hydroxylase is the rate-limiting enzyme.", "Receptor subtypes (4 marks, roughly 1 each): 5-HT1A - GPCR, mood regulation. 5-HT1B - GPCR, vasoconstriction, target for migraine treatment. 5-HT2A - GPCR, neuronal excitation. 5-HT3 - the family's only ligand-gated ion channel, mediates emesis. 5-HT4 - GPCR, increases GI motility. 5-HT7 - GPCR, regulates circadian rhythm.", "SSRI mechanism (3 marks): selective serotonin reuptake inhibitors block the serotonin transporter (SERT) on the presynaptic terminal, preventing reuptake of 5-HT from the synaptic cleft, increasing synaptic serotonin and downstream receptor activation, used to treat depression and anxiety. Onset of therapeutic effect is delayed (weeks) relative to the immediate rise in synaptic 5-HT.", "Other clinical examples (2 marks): ondansetron, a 5-HT3 antagonist, blocks the ligand-gated ion channel to prevent chemotherapy-induced nausea and vomiting. Triptans (e.g. sumatriptan) are 5-HT1B/1D agonists causing cranial vasoconstriction, used to treat acute migraine."], "note": ""}], "case": []}, {"n": 9, "title": "Pharmacological Manipulation of the Autonomic Nervous System", "fc": [{"q": "What six-step chain should you use whenever you are asked for the mechanism of action of an autonomic drug?", "a": "Receptor subtype, then G protein, then second messenger, then intracellular effect, then physiological effect, then drug example and clinical use. Example for an alpha1 agonist: binds alpha1, activates Gq, phospholipase C raises IP3/DAG, intracellular Ca2+ rises, smooth muscle contracts giving vasoconstriction, e.g. phenylephrine for hypotension and nasal congestion."}, {"q": "Drugs do not create new actions in the body. What do they do instead?", "a": "They enhance, mimic or block physiological processes that are already present. Every autonomic drug effect is a shift in the existing balance between sympathetic and parasympathetic tone."}, {"q": "What is meant by an 'opposing action', and why does it matter clinically?", "a": "A second receptor whose activation produces the opposite effect in the same tissue. It matters because co-prescribing a drug that activates the opposing receptor can cancel the intended clinical benefit. This is a polypharmacy problem."}, {"q": "Which receptor opposes beta1 activation at the sinoatrial node?", "a": "M2 (cholinergic). Beta1 raises heart rate via Gs/cAMP; M2 lowers it via Gi. A drug increasing M2 activity will blunt the effect of a beta1 agonist."}, {"q": "Which receptor opposes beta2-mediated bronchodilation?", "a": "M3 (cholinergic) in bronchial smooth muscle. M3 acts via Gq, raising IP3/DAG and Ca2+, causing bronchoconstriction."}, {"q": "Which receptor opposes alpha1-mediated vasoconstriction?", "a": "beta2 in vascular smooth muscle, which causes vasodilation via Gs and cAMP."}, {"q": "Which receptors oppose M3-mediated detrusor contraction?", "a": "beta2 and beta3 adrenergic receptors, which relax the detrusor."}, {"q": "Which receptor opposes alpha1-mediated contraction of the bladder internal sphincter?", "a": "M3 (cholinergic), which relaxes the internal sphincter. This is why an alpha1 agonist worsens urinary retention and an alpha1 antagonist relieves obstruction in BPH."}, {"q": "Define ED50 and state what it tells you.", "a": "The dose at which 50% of the maximum effect is achieved. It is an indicator of potency: a lower ED50 means higher potency, because less drug is needed for the same effect."}, {"q": "Give the formula for therapeutic index and explain what a high value means.", "a": "TI = TD50 / ED50. A higher TI indicates a greater safety margin, so the drug is less likely to cause toxicity at therapeutic doses. A narrow TI does not make a drug bad, but it requires careful dosing and monitoring, especially in paediatric and elderly patients."}, {"q": "Which two enzymes metabolise catecholamines, and where does each act?", "a": "COMT (catechol-O-methyltransferase) acts postsynaptically; MAO (monoamine oxidase) acts intraneuronally. Both are also present in the gut wall, and MAO acts in the liver."}, {"q": "Why are catecholamines ineffective when given orally?", "a": "They are broken down by COMT and MAO in the gut wall and by MAO in the liver before they can reach the systemic circulation."}, {"q": "Which receptors does adrenaline act on, and how does this differ from noradrenaline?", "a": "Adrenaline acts at alpha1, alpha2, beta1, beta2 and beta3, so it is broad spectrum. Noradrenaline acts mainly at alpha1, alpha2 and beta1, with little beta2 activity, so it is more vasoconstrictor-dominant."}, {"q": "How do dopamine's effects change with dose?", "a": "At low dose it acts on D1-D5 receptors, including increased renal perfusion, which is why it has been used in critical care. At higher doses it stimulates beta1 (raising heart rate and contractility) and alpha1."}, {"q": "Why is nebulised salbutamol preferred over a metered dose inhaler in acute severe bronchospasm?", "a": "Severe airway narrowing means little drug from an MDI reaches the lower airways. A nebuliser gives a higher delivered dose over a sustained period and is much less dependent on patient inhaler technique."}, {"q": "What does the mnemonic SLUDGE stand for, and when do you use it?", "a": "Sweating and Salivation, Lacrimation, Urination, Diarrhoea, Gastrointestinal cramps and pain, Emesis. It describes cholinergic excess (cholinomimetic overdose or cholinergic crisis)."}, {"q": "List the main features of anticholinergic (muscarinic antagonist) toxicity.", "a": "Urinary retention, constipation, tachycardia, dry mouth, mydriasis with blurred vision, inhibition of sweating with risk of overheating, and toxic psychosis or altered mental state."}, {"q": "What is 'anticholinergic burden' and why does it matter in older adults?", "a": "The cumulative anticholinergic effect of all a patient's medicines, including many antidepressants. It matters because it may compromise cognitive function and has been linked to increased dementia risk, and because dry mouth is a major cause of non-compliance in this group."}, {"q": "Beta1-selective antagonists are safer than non-selective ones in airway disease. What is the caveat?", "a": "Selectivity is relative and dose-dependent. At higher doses a beta1-selective agent will begin to block beta2 as well, so the protection against bronchoconstriction is not absolute."}, {"q": "Which drug classes act on cholinergic transmission, and give one example and use for each?", "a": "Muscarinic agonists (bethanechol, pilocarpine) for urinary retention, glaucoma and xerostomia. Muscarinic antagonists (atropine, oxybutynin, ipratropium) for bradycardia, overactive bladder and COPD. Nicotinic agonists (nicotine, varenicline) for smoking cessation. Nicotinic antagonists at the NMJ (rocuronium, suxamethonium) for muscle relaxation in surgery and intubation. AChE inhibitors (pyridostigmine, donepezil, neostigmine) for myasthenia gravis, Alzheimer's disease and reversal of neuromuscular blockade."}], "mcq": [{"q": "Therapeutic index is calculated as:", "opts": [{"k": "a", "t": "ED50 / TD50"}, {"k": "b", "t": "TD50 / ED50"}, {"k": "c", "t": "TD50 - ED50"}, {"k": "d", "t": "ED50 x TD50"}, {"k": "e", "t": "Emax / ED50"}], "ans": "b", "ansText": "b) TD50 / ED50"}, {"q": "A drug with a lower ED50 than a comparator is:", "opts": [{"k": "a", "t": "More efficacious"}, {"k": "b", "t": "More potent"}, {"k": "c", "t": "Safer"}, {"k": "d", "t": "Longer acting"}, {"k": "e", "t": "More selective"}], "ans": "b", "ansText": "b) More potent"}, {"q": "A patient is given salbutamol for acute bronchospasm. Which co-administered drug would most directly oppose its therapeutic effect?", "opts": [{"k": "a", "t": "Ipratropium"}, {"k": "b", "t": "Prazosin"}, {"k": "c", "t": "Propranolol"}, {"k": "d", "t": "Clonidine"}, {"k": "e", "t": "Dobutamine"}], "ans": "c", "ansText": "c) Propranolol"}, {"q": "Which receptor activation opposes M3-mediated bronchoconstriction?", "opts": [{"k": "a", "t": "alpha1"}, {"k": "b", "t": "alpha2"}, {"k": "c", "t": "beta1"}, {"k": "d", "t": "beta2"}, {"k": "e", "t": "M2"}], "ans": "d", "ansText": "d) beta2"}, {"q": "Margaret has post-operative urinary retention. Which drug would be expected to worsen it?", "opts": [{"k": "a", "t": "Bethanechol"}, {"k": "b", "t": "Neostigmine"}, {"k": "c", "t": "Phenylephrine"}, {"k": "d", "t": "Pilocarpine"}, {"k": "e", "t": "Carbachol"}], "ans": "c", "ansText": "c) Phenylephrine"}, {"q": "Catecholamines are metabolised by:", "opts": [{"k": "a", "t": "COMT and PNMT"}, {"k": "b", "t": "MAO and ChAT"}, {"k": "c", "t": "COMT and MAO"}, {"k": "d", "t": "AChE and MAO"}, {"k": "e", "t": "Tyrosine hydroxylase and COMT"}], "ans": "c", "ansText": "c) COMT and MAO"}, {"q": "Catecholamines are ineffective by the oral route because:", "opts": [{"k": "a", "t": "They are too large to be absorbed"}, {"k": "b", "t": "They are degraded by COMT and MAO in the gut wall and liver"}, {"k": "c", "t": "They are destroyed by gastric acid"}, {"k": "d", "t": "They bind irreversibly to plasma proteins"}, {"k": "e", "t": "They are actively pumped back into the gut lumen"}], "ans": "b", "ansText": "b) They are degraded by COMT and MAO in the gut wall and liver"}, {"q": "Clonidine lowers blood pressure by:", "opts": [{"k": "a", "t": "Blocking alpha1 receptors in vascular smooth muscle"}, {"k": "b", "t": "Stimulating alpha2 receptors, reducing cAMP and sympathetic outflow"}, {"k": "c", "t": "Blocking beta1 receptors in the heart"}, {"k": "d", "t": "Stimulating beta2 receptors in the vasculature"}, {"k": "e", "t": "Blocking M3 receptors in blood vessels"}], "ans": "b", "ansText": "b) Stimulating alpha2 receptors, reducing cAMP and sympathetic outflow"}, {"q": "Which agent is a nicotinic antagonist used to produce muscle relaxation for intubation?", "opts": [{"k": "a", "t": "Varenicline"}, {"k": "b", "t": "Pyridostigmine"}, {"k": "c", "t": "Rocuronium"}, {"k": "d", "t": "Ipratropium"}, {"k": "e", "t": "Bethanechol"}], "ans": "c", "ansText": "c) Rocuronium"}, {"q": "A patient presents with salivation, lacrimation, urination, diarrhoea, GI cramping and vomiting. This picture is most consistent with:", "opts": [{"k": "a", "t": "Anticholinergic toxicity"}, {"k": "b", "t": "Cholinergic excess"}, {"k": "c", "t": "beta2 agonist overdose"}, {"k": "d", "t": "alpha1 antagonist first-dose effect"}, {"k": "e", "t": "Non-selective beta blockade"}], "ans": "b", "ansText": "b) Cholinergic excess"}, {"q": "Which side effect is characteristic of high or prolonged doses of a beta2 agonist?", "opts": [{"k": "a", "t": "Hyperkalaemia"}, {"k": "b", "t": "Hypokalaemia"}, {"k": "c", "t": "Bradycardia"}, {"k": "d", "t": "Miosis"}, {"k": "e", "t": "Bronchoconstriction"}], "ans": "b", "ansText": "b) Hypokalaemia"}, {"q": "A patient starting prazosin for BPH should be warned specifically about:", "opts": [{"k": "a", "t": "Dry mouth"}, {"k": "b", "t": "First-dose hypotension and dizziness"}, {"k": "c", "t": "Bronchospasm"}, {"k": "d", "t": "Hyperglycaemia"}, {"k": "e", "t": "Urinary retention"}], "ans": "b", "ansText": "b) First-dose hypotension and dizziness"}], "saq": [{"title": "Opposing Drug Actions in the Autonomic Nervous System (10 marks)", "marks": 10, "prompt": "Using three worked examples from different organ systems, explain what is meant by an opposing drug action. For each example, name the two receptors involved, the G protein and second messenger for each, the physiological outcome of each, and state the clinical consequence of co-prescribing drugs that act on both.", "points": ["Definition (2 marks): opposing actions occur where two different receptors in the same tissue produce opposite physiological effects. Because the sympathetic and parasympathetic divisions are in dynamic balance, a drug acting on one receptor can have its effect cancelled or blunted by a drug acting on the opposing receptor. This is the basis of many polypharmacy problems in autonomic pharmacology.", "Example 1, airway (2-3 marks): beta2 receptors on bronchial smooth muscle are Gs-coupled, raise cAMP and cause relaxation and bronchodilation. M3 receptors on the same muscle are Gq-coupled, raise IP3/DAG and Ca2+, and cause bronchoconstriction. Clinical consequence: giving a muscarinic agonist (or failing to withhold a non-selective beta blocker) in a patient on salbutamol will reduce or abolish the bronchodilator effect.", "Example 2, heart (2-3 marks): beta1 r
