r"}, {"q": "Which cytokine resolves inflammation by suppressing pro-inflammatory cytokine production?", "opts": [{"k": "a", "t": "TNF-alpha"}, {"k": "b", "t": "IL-1"}, {"k": "c", "t": "IL-6"}, {"k": "d", "t": "IL-10"}, {"k": "e", "t": "IL-23"}], "ans": "d", "ansText": "d) IL-10"}, {"q": "Why might a patient on an anti-TNF biologic be at higher risk of TB reactivation?", "opts": [{"k": "a", "t": "TNF-alpha inhibitors directly damage lung tissue"}, {"k": "b", "t": "TNF-alpha maintains granulomas that contain latent TB, and inhibiting it can allow reactivation"}, {"k": "c", "t": "Biologics increase histamine release"}, {"k": "d", "t": "Biologics cause bronchoconstriction"}, {"k": "e", "t": "Anti-TNF drugs are metabolised in the lung"}], "ans": "b", "ansText": "b) TNF-alpha maintains granulomas that contain latent TB, and inhibiting it can allow reactivation"}, {"q": "A long-term systemic corticosteroid patient should be monitored particularly closely for:", "opts": [{"k": "a", "t": "Hypoglycaemia and weight loss"}, {"k": "b", "t": "Osteoporosis, hyperglycaemia and increased infection risk"}, {"k": "c", "t": "Bronchoconstriction"}, {"k": "d", "t": "Reduced blood pressure"}, {"k": "e", "t": "Improved wound healing"}], "ans": "b", "ansText": "b) Osteoporosis, hyperglycaemia and increased infection risk"}, {"q": "Which inflammatory mediator is known to induce fever and sensitise pain pathways?", "opts": [{"k": "a", "t": "PGE2"}, {"k": "b", "t": "IL-10"}, {"k": "c", "t": "Histamine"}, {"k": "d", "t": "PGI2"}], "ans": "a", "ansText": "a) PGE2"}, {"q": "Why can NSAIDs increase the risk of peptic ulceration?", "opts": [{"k": "a", "t": "They stimulate gastric acid secretion directly"}, {"k": "b", "t": "They reduce PGE2/PGI2, which normally protect gastric mucosa via mucus and bicarbonate secretion"}, {"k": "c", "t": "They increase leukotriene production in gastric epithelial cells"}], "ans": "b", "ansText": "b) They reduce PGE2/PGI2, which normally protect gastric mucosa via mucus and bicarbonate secretion"}, {"q": "Which adverse effect is most consistent with prolonged systemic corticosteroid therapy?", "opts": [{"k": "a", "t": "Hypoglycaemia"}, {"k": "b", "t": "Osteoporosis"}, {"k": "c", "t": "Reduced infection risk"}, {"k": "d", "t": "Increased bone formation"}], "ans": "b", "ansText": "b) Osteoporosis"}, {"q": "Arrange the correct order: which event initiates the acute inflammatory cascade before mediator release?", "opts": [{"k": "a", "t": "Neutrophils move toward the site by chemotaxis"}, {"k": "b", "t": "Macrophages and mast cells recognise danger signals"}, {"k": "c", "t": "Leukocytes migrate across the vascular endothelium"}, {"k": "d", "t": "Vasodilation and increased vascular permeability occur"}], "ans": "b", "ansText": "b) Macrophages and mast cells recognise danger signals"}, {"q": "At which stage of the inflammatory cascade would an NSAID act to reduce progression of the response?", "opts": [{"k": "a", "t": "Before the initial trigger occurs"}, {"k": "b", "t": "At the stage of mediator generation, by inhibiting COX and reducing prostaglandin synthesis"}, {"k": "c", "t": "Only after leukocyte migration is complete"}, {"k": "d", "t": "Only at the resolution phase"}], "ans": "b", "ansText": "b) At the stage of mediator generation, by inhibiting COX and reducing prostaglandin synthesis"}, {"q": "Which feature is characteristic of chronic, but not acute, inflammation?", "opts": [{"k": "a", "t": "Neutrophils predominate"}, {"k": "b", "t": "Rapid onset"}, {"k": "c", "t": "Fibrosis and persistent cytokine signalling, potentially leading to organ dysfunction"}, {"k": "d", "t": "Oedema that resolves completely"}], "ans": "c", "ansText": "c) Fibrosis and persistent cytokine signalling, potentially leading to organ dysfunction"}, {"q": "A long-term corticosteroid patient should be monitored for which combination of adverse effects?", "opts": [{"k": "a", "t": "Hypoglycaemia and weight loss"}, {"k": "b", "t": "Osteoporosis, hyperglycaemia and increased infection risk"}, {"k": "c", "t": "Bronchoconstriction only"}, {"k": "d", "t": "Improved wound healing"}], "ans": "b", "ansText": "b) Osteoporosis, hyperglycaemia and increased infection risk"}, {"q": "Which feature is more typical of chronic inflammation than acute inflammation?", "opts": [{"k": "a", "t": "Rapid onset"}, {"k": "b", "t": "Ongoing tissue destruction and repair"}, {"k": "c", "t": "Short duration"}, {"k": "d", "t": "Complete resolution within hours"}, {"k": "e", "t": "Prominent neutrophil response"}], "ans": "b", "ansText": "b) Ongoing tissue destruction and repair"}, {"q": "Which mediator is strongly associated with pain sensitisation during inflammation?", "opts": [{"k": "a", "t": "Dopamine"}, {"k": "b", "t": "Acetylcholine"}, {"k": "c", "t": "Thyroxine"}, {"k": "d", "t": "Insulin"}, {"k": "e", "t": "Prostaglandins"}], "ans": "e", "ansText": "e) Prostaglandins"}], "saq": [{"title": "The Arachidonic Acid Pathway (10 marks)", "marks": 10, "prompt": "Using the arachidonic acid pathway, compare the mechanism of action of corticosteroids and NSAIDs, and explain why corticosteroids have a broader anti-inflammatory effect.", "points": ["Corticosteroids (3 marks): inhibit phospholipase A2, preventing release of arachidonic acid from membrane phospholipids — this blocks BOTH the COX and lipoxygenase branches at their source.", "NSAIDs (3 marks): inhibit cyclooxygenase (COX-1 and/or COX-2), reducing prostaglandin and thromboxane production, but do not affect the 5-lipoxygenase branch.", "Why corticosteroids are broader (2 marks): they act one step upstream of NSAIDs, blocking arachidonic acid release itself rather than just one of its two downstream enzymatic branches.", "Clinical consequence (2 marks): NSAIDs do not relieve leukotriene-driven bronchoconstriction, whereas corticosteroids do — which is why corticosteroids, not NSAIDs, are first-line anti-inflammatory therapy in asthma."], "note": ""}, {"title": "Case Study — Biologic Treatment Failure (10 marks)", "marks": 10, "prompt": "A patient with a chronic inflammatory condition responds well initially to an anti-TNF biologic, but loses response after eight months of treatment, with blood tests showing detectable anti-drug antibodies. (a) Name this type of treatment failure (2 marks). (b) Explain the mechanism behind it (3 marks). (c) Contrast this with a scenario where a patient never responds to the same biologic despite adequate dosing (3 marks). (d) Suggest an appropriate next step in management (2 marks).", "points": ["(a) Secondary loss of response.", "(b) The immune system generates anti-drug antibodies against the biologic; these form immune complexes that increase the drug's clearance from the body, so effective drug levels fall over time despite continued dosing.", "(c) That scenario is primary non-response — inadequate drug exposure from the start, often due to a high inflammatory burden or rapid clearance, rather than an acquired immune reaction developing later.", "(d) Switch to a biologic targeting a different inflammatory pathway (e.g. an IL-6 inhibitor or a JAK inhibitor), since cytokine redundancy means blocking the same pathway again is unlikely to succeed."], "note": ""}, {"title": "Acute Inflammation and NSAID Mechanism - Soft Tissue Injury (10 marks)", "marks": 10, "prompt": "A patient presents with a painful, swollen ankle following a soft-tissue injury. a. Identify two vascular changes that occur during acute inflammation. (2 marks) b. Name one inflammatory mediator that contributes to pain and explain its role. (2 marks) c. Explain the mechanism of action of an NSAID such as ibuprofen. (4 marks) d. State two important adverse effects associated with NSAID use. (2 marks)", "points": ["Vascular changes (2 marks): vasodilation; increased vascular permeability.", "Mediator and role (2 marks): prostaglandins, particularly PGE2, contribute to pain by sensitising nociceptors, increasing their responsiveness to pain stimuli.", "NSAID mechanism (4 marks): ibuprofen inhibits cyclooxygenase enzymes (COX-1 and COX-2); this reduces conversion of arachidonic acid to prostaglandins; reduced prostaglandin production decreases inflammatory signalling and nociceptor sensitisation; this reduces pain and inflammation at the site.", "Adverse effects (2 marks, 1 each): gastrointestinal irritation/ulceration/bleeding (from reduced COX-1-mediated mucosal protection); renal impairment, particularly with long-term use."], "note": ""}], "case": []}, {"n": 18, "title": "Clinical Applications: Rheumatoid Arthritis & IBD", "fc": [{"q": "What is pannus, and what does it cause?", "a": "Invasive granulation tissue from synovial hyperplasia in RA; it erodes cartilage and bone."}, {"q": "What is the strongest modifiable risk factor for RA?", "a": "Smoking."}, {"q": "Describe the RANKL/RANK pathway in RA bone erosion.", "a": "Inflammatory cytokines (TNF-alpha, IL-1, IL-17) stimulate RANKL expression on osteoblasts; RANKL binds RANK on osteoclast precursors, activating osteoclasts and driving bone erosion."}, {"q": "What is methotrexate's primary mechanism, and its anti-inflammatory mechanism?", "a": "Primary: inhibits dihydrofolate reductase. Anti-inflammatory: increases extracellular adenosine via AICAR transformylase inhibition."}, {"q": "Why is a biologic usually given with methotrexate rather than alone?", "a": "Methotrexate reduces immunogenicity by suppressing anti-drug antibody formation, prolonging the biologic's half-life."}, {"q": "Name the three types of anti-TNF treatment failure.", "a": "Primary non-response, secondary loss of response (immunogenicity), pharmacodynamic failure (non-TNF pathway dominance)."}, {"q": "What is the RA treat-to-target strategy in numbers?", "a": "Start DMARDs within 12 weeks of diagnosis; escalate if inadequate response at 3–6 months; target remission (DAS28 <2.6)."}, {"q": "Distinguish Crohn's disease from ulcerative colitis by location and pattern.", "a": "Crohn's — anywhere mouth to anus, skip lesions, transmural. UC — colon only, continuous, mucosal."}, {"q": "What is the IBD smoking paradox?", "a": "Smoking worsens Crohn's disease but appears protective in ulcerative colitis."}, {"q": "What T-helper response dominates in Crohn's vs UC?", "a": "Crohn's — Th1/Th17. Ulcerative colitis — Th2."}, {"q": "Why is vedolizumab described as gut-selective?", "a": "It blocks alpha4beta7 integrin binding to MAdCAM-1, which is expressed on gut endothelium, so lymphocyte trafficking is blocked only in the gut."}, {"q": "What does ustekinumab target?", "a": "The p40 subunit shared by IL-12 and IL-23."}, {"q": "What is first-line therapy for mild-to-moderate ulcerative colitis?", "a": "5-ASA agents such as mesalazine."}, {"q": "What is the main practical advantage of tofacitinib over injectable biologics?", "a": "It is an oral therapy."}], "mcq": [{"q": "Pannus formation refers to:", "opts": [{"k": "a", "t": "Loss of bone density around the joint"}, {"k": "b", "t": "Invasive granulation tissue that erodes cartilage and bone"}, {"k": "c", "t": "A protective fibrous capsule"}, {"k": "d", "t": "Calcification of the joint space"}, {"k": "e", "t": "A normal synovial structure"}], "ans": "b", "ansText": "b) Invasive granulation tissue that erodes cartilage and bone"}, {"q": "Methotrexate's anti-inflammatory effect in RA is largely due to:", "opts": [{"k": "a", "t": "Direct TNF-alpha blockade"}, {"k": "b", "t": "Increased extracellular adenosine"}, {"k": "c", "t": "JAK-STAT inhibition"}, {"k": "d", "t": "CysLT1 blockade"}, {"k": "e", "t": "B-cell depletion"}], "ans": "b", "ansText": "b) Increased extracellular adenosine"}, {"q": "Secondary loss of response to an anti-TNF biologic is best explained by:", "opts": [{"k": "a", "t": "Inadequate initial dosing"}, {"k": "b", "t": "Anti-drug antibody formation increasing drug clearance"}, {"k": "c", "t": "A non-TNF pathway driving disease from the start"}, {"k": "d", "t": "Poor adherence"}, {"k": "e", "t": "Drug interactions with NSAIDs"}], "ans": "b", "ansText": "b) Anti-drug antibody formation increasing drug clearance"}, {"q": "Which correctly distinguishes Crohn's disease from ulcerative colitis?", "opts": [{"k": "a", "t": "Crohn's is continuous and mucosal; UC is transmural with skip lesions"}, {"k": "b", "t": "Crohn's can affect anywhere from mouth to anus with transmural inflammation; UC is limited to the colon with continuous mucosal inflammation"}, {"k": "c", "t": "Crohn's is limited to the colon"}, {"k": "d", "t": "Both have identical patterns"}, {"k": "e", "t": "UC always requires surgery"}], "ans": "b", "ansText": "b) Crohn's can affect anywhere from mouth to anus with transmural inflammation; UC is limited to the colon with continuous mucosal inflammation"}, {"q": "Vedolizumab is described as gut-selective because it:", "opts": [{"k": "a", "t": "Is only absorbed in the stomach"}, {"k": "b", "t": "Blocks alpha4beta7 integrin–MAdCAM-1 interaction, preventing lymphocyte migration specifically into gut tissue"}, {"k": "c", "t": "Only works in Crohn's disease"}, {"k": "d", "t": "Is metabolised exclusively by gut bacteria"}, {"k": "e", "t": "Requires no monitoring"}], "ans": "b", "ansText": "b) Blocks alpha4beta7 integrin–MAdCAM-1 interaction, preventing lymphocyte migration specifically into gut tissue"}, {"q": "First-line therapy for mild-to-moderate ulcerative colitis is:", "opts": [{"k": "a", "t": "Anti-TNF biologics"}, {"k": "b", "t": "JAK inhibitors"}, {"k": "c", "t": "5-ASA agents such as mesalazine"}, {"k": "d", "t": "Anti-integrin biologics"}, {"k": "e", "t": "Systemic corticosteroids"}], "ans": "c", "ansText": "c) 5-ASA agents such as mesalazine"}, {"q": "What is the main pharmacological advantage of biologic anti-inflammatory drugs compared with broad anti-inflammatory therapies?", "opts": [{"k": "a", "t": "They completely suppress all immune responses"}, {"k": "b", "t": "They act only through cyclooxygenase inhibition"}, {"k": "c", "t": "They can selectively target specific inflammatory mediators or pathways"}, {"k": "d", "t": "They are effective in every patient with inflammatory disease"}], "ans": "c", "ansText": "c) They can selectively target specific inflammatory mediators or pathways"}, {"q": "Which pathological change contributes directly to joint damage in rheumatoid arthritis?", "opts": [{"k": "a", "t": "Increased joint space"}, {"k": "b", "t": "Reduced osteoclast activity"}, {"k": "c", "t": "Reduced synovial activity"}, {"k": "d", "t": "Increased cartilage production"}, {"k": "e", "t": "Formation of pannus that invades cartilage and bone"}], "ans": "e", "ansText": "e) Formation of pannus that invades cartilage and bone"}, {"q": "Which statement correctly distinguishes Crohn's disease from ulcerative colitis?", "opts": [{"k": "a", "t": "Crohn's disease affects only the colon"}, {"k": "b", "t": "Both conditions affect only the small intestine"}, {"k": "c", "t": "Neither condition involves intestinal inflammation"}, {"k": "d", "t": "Crohn's disease can involve any part of the gastrointestinal tract, whereas ulcerative colitis is limited to the colon"}, {"k": "e", "t": "Ulcerative colitis can affect any part of the gastrointestinal tract"}], "ans": "d", "ansText": "d) Crohn's disease can involve any part of the gastrointestinal tract, whereas ulcerative colitis is limited to the colon"}], "saq": [{"title": "RANKL/RANK Pathway and Biologic Targets (10 marks)", "marks": 10, "prompt": "Using the RANKL/RANK pathway, explain how chronic inflammation in RA leads to bone erosion, and explain how anti-TNF and IL-6 receptor biologics each interrupt this pathway at a different point.", "points": ["Pathway (4 marks): T cells (Th1/Th17) activate macrophages and synovial fibroblasts, which release TNF-alpha, IL-1 and IL-17; these cytokines stimulate RANKL expression on osteoblasts, which binds RANK on osteoclast precursors, activating osteoclasts and driving bone resorption.", "Anti-TNF biologics (3 marks): block the upstream cytokine signal (TNF-alpha), reducing RANKL expression and therefore osteoclast activation earlier in the pathway.", "IL-6 receptor biologics (3 marks): act further downstream, blocking IL-6-driven osteoblast-to-osteoclast differentiation, preventing mature bone-resorbing osteoclasts forming even if some RANKL signal remains."], "note": ""}, {"title": "Case Study — IBD Diagnosis and Treatment (10 marks)", "marks": 10, "prompt": "A 22-year-old presents with several months of bloody diarrhoea and urgency, with colonoscopy showing continuous mucosal inflammation limited to the colon. (a) State the likely diagnosis and justify it from the findings given (3 marks). (b) State the first-line drug class for this presentation and its mechanism (3 marks). (c) The patient is a smoker — explain the relevance of this to her condition (2 marks). (d) If she later fails first-line therapy and anti-TNF treatment, name one alternative biologic and its mechanism (2 marks).", "points": ["(a) Ulcerative colitis — continuous, mucosal-only inflammation limited to the colon, with bloody diarrhoea and urgency, is characteristic of UC rather than the skip lesions and transmural inflammation of Crohn's disease.", "(b) 5-ASA agents such as mesalazine, first-line for mild-to-moderate UC; they decrease prostaglandin and leukotriene synthesis and NF-kappaB activation in the gut mucosa.", "(c) Smoking is protective against ulcerative colitis (the IBD smoking paradox), though it is never recommended as a treatment strategy given its other health risks.", "(d) Vedolizumab (anti-alpha4beta7 integrin), which blocks lymphocyte migration specifically into gut tissue without broad systemic immunosuppression; ustekinumab (anti-IL-12/23) is an equally acceptable alternative."], "note": ""}, {"title": "Corticosteroids in Ulcerative Colitis (10 marks)", "marks": 10, "prompt": "A patient with moderate to severe ulcerative colitis is experiencing an acute flare. a. State two general features of inflammation seen in inflammatory bowel disease. (2 marks) b. Identify one drug class commonly used to induce control of an acute flare. (1 mark) c. Explain the anti-inflammatory mechanism of corticosteroids in IBD. (4 marks) d. Explain why corticosteroids are generally not preferred for long-term maintenance therapy. (3 marks)", "points": ["General features (2 marks): chronic intestinal inflammation; ulceration/tissue damage or dysregulated immune response (e.g. bloody diarrhoea).", "Drug class (1 mark): corticosteroids.", "Mechanism (4 marks): the corticosteroid crosses the cell membrane and binds the intracellular glucocorticoid receptor; the receptor-drug complex translocates to the nucleus; this modifies gene transcription, decreasing pro-inflammatory cytokines/mediators; this suppresses pro-inflammatory cytokine production and T-cell activation.", "Why not for maintenance (3 marks): long-term use is associated with significant adverse effects, including hyperglycaemia, weight gain and osteoporosis; they are therefore better suited to short-term control of flares rather than maintenance therapy."], "note": ""}], "case": []}, {"n": 19, "title": "Inflammatory Skin Conditions", "fc": [{"q": "What is the hallmark symptom of atopic dermatitis, and which gene mutation predisposes to it?", "a": "Itch (pruritus) is the hallmark symptom. A mutation in the FLG (filaggrin) gene reduces filaggrin protein, impairing skin barrier integrity and increasing transepidermal water loss."}, {"q": "Describe the two linked processes that drive atopic dermatitis.", "a": "Skin barrier dysfunction (genetic, e.g. FLG mutation, or environmental triggers such as pollution, detergents, cold air, and S. aureus dysbiosis) increases transepidermal water loss and dryness. This allows allergens/irritants to penetrate, triggering cytokine release, inflammation and itch, and scratching further damages the barrier - the itch-scratch cycle."}, {"q": "How does the distribution of atopic dermatitis change with age?", "a": "Infants: face, cheeks, scalp, extensor surfaces. Children: flexural areas (elbows, knees). Adolescents/adults: flexures, hands, face, neck, eyelids."}, {"q": "What are the two subtypes of contact dermatitis, and which is more common?", "a": "Irritant contact dermatitis (ICD, ~80% of cases) - direct chemical/physical damage. Allergic contact dermatitis (ACD, ~20%) - a Type IV delayed hypersensitivity reaction requiring prior sensitisation."}, {"q": "A patient develops a rash within an hour of first wearing a new metal watch, with burning and stinging. Is this ICD or ACD, and why?", "a": "Irritant contact dermatitis - it can occur on first exposure with no prior sensitisation, has rapid onset, and presents with burning/stinging rather than the itching and delayed (48-72h) onset of allergic contact dermatitis."}, {"q": "What is the gold-standard test for allergic contact dermatitis, and why doesn't it work for irritant contact dermatitis?", "a": "Patch testing (epicutaneous testing) - it detects a Type IV delayed hypersensitivity response to a specific allergen. It is not useful in ICD because that condition results from direct chemical damage, not an immune reaction, so there is no allergen to detect."}, {"q": "What organism and what four-step pathophysiology underlie seborrhoeic dermatitis?", "a": "Malassezia yeast. (1) Excess sebum production from enlarged sebaceous glands, (2) Malassezia overgrowth thriving on the excess sebum, (3) immune response as yeast components trigger dermal lymphocytes, (4) inflammation and scaling from increased skin turnover and impaired barrier."}, {"q": "What is the typical distribution of seborrhoeic dermatitis?", "a": "Scalp, eyebrows, nasolabial folds, ears, beard area, central chest and upper back - the sebum-rich (oily) areas of skin."}, {"q": "Describe the IL-23/Th17 pathway that drives psoriasis and how it produces the silvery scale.", "a": "Dendritic cells release IL-23, activating Th17 cells in the dermis. Th17 cells release IL-17 and IL-22, which drive keratinocytes to proliferate far faster than normal (turnover falls from ~28 days to 3-4 days). Because the cells reach the surface immature, they pile up as thick, silvery-white scale (parakeratosis/hyperkeratosis), alongside dilated dermal vessels and neutrophil migration into the epidermis."}, {"q": "A 16-year-old develops small, drop-like red spots a week after a sore throat. Which type of psoriasis is this, and what commonly precedes it?", "a": "Guttate psoriasis, commonly preceded by a streptococcal throat infection; more common in children and young adults."}, {"q": "List the four steps in the pathophysiology of acne vulgaris.", "a": "(1) Excess sebum production driven by androgen stimulation of sebaceous glands. (2) Follicular hyperkeratinisation - excess keratin and sebum block the follicle, forming a microcomedone. (3) Proliferation of Cutibacterium acnes in the anaerobic blocked follicle, breaking sebum into irritating free fatty acids. (4) Inflammation - bacterial components and free fatty acids trigger cytokine release and neutrophil recruitment, causing papules/pustules."}, {"q": "What cell type and mediator underlie urticaria, and how do you distinguish acute from chronic urticaria?", "a": "Mast cell activation and degranulation release histamine (plus leukotrienes, prostaglandins and cytokines), causing vasodilation and increased vascular permeability - the itchy wheal-and-flare reaction. Acute urticaria lasts <6 weeks; chronic urticaria persists ≥6 weeks."}, {"q": "What are DAMPs/PAMPs equivalents in skin inflammation - what is the general five-step sequence of skin inflammation?", "a": "Vasodilation (redness/warmth) - increased vascular permeability (oedema) - release of inflammatory mediators (cytokines, chemokines, histamine) - recruitment of immune cells (neutrophils, eosinophils, mast cells) - sensory nerve activation (itch/pain)."}, {"q": "Why does epidermal barrier damage matter across nearly all inflammatory skin diseases?", "a": "When the epidermal barrier is damaged, irritants, allergens and microbes penetrate more easily, triggering or worsening inflammation - this underlies atopic dermatitis, contact dermatitis and seborrhoeic dermatitis in particular."}], "mcq": [{"q": "Which single feature is described as the hallmark symptom of atopic dermatitis?", "opts": [{"k": "a", "t": "Lichenification"}, {"k": "b", "t": "Pruritus (itch)"}, {"k": "c", "t": "Erythema"}, {"k": "d", "t": "Oedema"}, {"k": "e", "t": "Excoriation"}], "ans": "b", "ansText": "b) Pruritus (itch)"}, {"q": "A mutation in which gene reduces filaggrin and predisposes to atopic dermatitis?", "opts": [{"k": "a", "t": "FLG"}, {"k": "b", "t": "TNF"}, {"k": "c", "t": "IL23R"}, {"k": "d", "t": "HLA-B27"}, {"k": "e", "t": "CFTR"}], "ans": "a", "ansText": "a) FLG"}, {"q": "Which feature distinguishes allergic from irritant contact dermatitis?", "opts": [{"k": "a", "t": "ACD can occur on first exposure"}, {"k": "b", "t": "ACD is a Type IV delayed hypersensitivity reaction requiring prior sensitisation"}, {"k": "c", "t": "ICD requires prior sensitisation"}, {"k": "d", "t": "ICD is diagnosed with patch testing"}, {"k": "e", "t": "ACD presents with burning rather than itching"}], "ans": "b", "ansText": "b) ACD is a Type IV delayed hypersensitivity reaction requiring prior sensitisation"}, {"q": "The gold-standard investigation for identifying the causative allergen in allergic contact dermatitis is:", "opts": [{"k": "a", "t": "Skin biopsy"}, {"k": "b", "t": "Patch (epicutaneous) testing"}, {"k": "c", "t": "Serum IgE level"}, {"k": "d", "t": "Skin prick testing"}, {"k": "e", "t": "Bacterial culture"}], "ans": "b", "ansText": "b) Patch (epicutaneous) testing"}, {"q": "Which yeast is implicated in the pathophysiology of seborrhoeic dermatitis?", "opts": [{"k": "a", "t": "Candida albicans"}, {"k": "b", "t": "Malassezia"}, {"k": "c", "t": "Aspergillus"}, {"k": "d", "t": "Trichophyton"}, {"k": "e", "t": "Cutibacterium"}], "ans": "b", "ansText": "b) Malassezia"}, {"q": "In psoriasis, which cytokines released by Th17 cells drive keratinocyte hyperproliferation?", "opts": [{"k": "a", "t": "IL-4 and IL-13"}, {"k": "b", "t": "IL-17 and IL-22"}, {"k": "c", "t": "IL-5 and IL-10"}, {"k": "d", "t": "TNF-alpha and IFN-gamma only"}, {"k": "e", "t": "IL-2 and IL-6"}], "ans": "b", "ansText": "b) IL-17 and IL-22"}, {"q": "Guttate psoriasis is most commonly triggered by:", "opts": [{"k": "a", "t": "A staphylococcal skin infection"}, {"k": "b", "t": "A streptococcal throat infection"}, {"k": "c", "t": "Sun exposure"}, {"k": "d", "t": "A drug reaction"}, {"k": "e", "t": "Cold weather"}], "ans": "b", "ansText": "b) A streptococcal throat infection"}, {"q": "Which bacterium proliferates in the blocked follicle in acne vulgaris, breaking sebum into free fatty acids?", "opts": [{"k": "a", "t": "Staphylococcus aureus"}, {"k": "b", "t": "Cutibacterium acnes"}, {"k": "c", "t": "Malassezia furfur"}, {"k": "d", "t": "Streptococcus pyogenes"}, {"k": "e", "t": "Pseudomonas aeruginosa"}], "ans": "b", "ansText": "b) Cutibacterium acnes"}, {"q": "Urticaria is primarily driven by:", "opts": [{"k": "a", "t": "IL-23/Th17 activation"}, {"k": "b", "t": "Mast cell degranulation and histamine release"}, {"k": "c", "t": "Follicular hyperkeratinisation"}, {"k": "d", "t": "Excess sebum production"}, {"k": "e", "t": "Filaggrin deficiency"}], "ans": "b", "ansText": "b) Mast cell degranulation and histamine release"}, {"q": "How is chronic urticaria distinguished from acute urticaria?", "opts": [{"k": "a", "t": "Chronic urticaria always involves angioedema"}, {"k": "b", "t": "Chronic urticaria lasts 6 weeks or more"}, {"k": "c", "t": "Chronic urticaria is never itchy"}, {"k": "d", "t": "Acute urticaria requires immunosuppressants"}, {"k": "e", "t": "Chronic urticaria only affects children"}], "ans": "b", "ansText": "b) Chronic urticaria lasts 6 weeks or more"}], "saq": [{"title": "Atopic Dermatitis Pathophysiology (10 marks)", "marks": 10, "prompt": "Outline the key pathophysiological features of atopic dermatitis, including the two linked processes that drive it and how they interact.", "points": ["Barrier dysfunction (3 marks): genetic factors (e.g. FLG/filaggrin gene mutation) or environmental triggers (pollution, detergents, cold air, S. aureus dysbiosis) reduce barrier integrity and increase transepidermal water loss, producing dry skin (xerosis).", "Immune dysregulation (3 marks): barrier damage allows allergens/irritants to penetrate the skin, triggering cytokine release and inflammation, which produces itch.", "Itch-scratch cycle (2 marks): itch leads to scratching, which further damages the barrier, perpetuating and worsening both processes.", "Clinical correlation (2 marks): the result is dry, itchy, inflamed skin with erythema, scaling, and in chronic disease, lichenification; distribution changes with age (face/scalp in infants, flexures in children and adults)."], "note": ""}, {"title": "Contact Dermatitis: Irritant vs Allergic (10 marks)", "marks": 10, "prompt": "Compare irritant and allergic contact dermatitis in terms of mechanism, onset, common triggers and diagnosis.", "points": ["Irritant contact dermatitis (3-4 marks): direct chemical/physical damage to the skin, not immune-mediated; can occur on first exposure with rapid onset; common triggers include soaps, detergents, frequent handwashing, solvents and water; presents with burning and stinging.", "Allergic contact dermatitis (3-4 marks): a Type IV delayed hypersensitivity reaction requiring prior sensitisation; onset is delayed (48-72 hours); common triggers include nickel, fragrances, hair dyes, preservatives and latex; presents with itching, redness, swelling and rash.", "Diagnosis (2 marks): both are diagnosed clinically from history and morphology; patch testing is the gold standard for identifying the causative allergen in ACD but is not useful in ICD, which has no specific diagnostic test."], "note": ""}, {"title": "Psoriasis Pathophysiology - the IL-23/Th17 Axis (10 marks)", "marks": 10, "prompt": "Describe the pathophysiology of psoriasis using the IL-23/Th17 pathway, and explain how this produces the characteristic clinical appearance.", "points": ["Trigger and initiation (2 marks): dendritic cells release IL-23 in response to triggers such as stress, infection (especially streptococcal), skin injury or certain drugs.", "Th17 activation (2 marks): IL-23 activates Th17 cells in the dermis.", "Cytokine effects (2 marks): Th17 cells release IL-17 and IL-22, which drive keratinocytes to proliferate far faster than normal, with skin turnover falling from about 28 days to 3-4 days.", "Result (2 marks): keratinocytes reach the surface immature, producing a thickened epidermis and silvery-white scale (parakeratosis/hyperkeratosis), along with dilated dermal blood vessels and neutrophil migration into the epidermis.", "Clinical correlation (2 marks): well-defined, symmetrical red plaques with thick silvery scale, itching/pain/discomfort, and a relapsing-remitting course; about one-third of patients have a family history."], "note": ""}], "case": []}, {"n": 20, "title": "Treatment of Inflammatory Skin Conditions", "fc": [{"q": "What are the four general treatment aims that apply across almost all inflammatory skin conditions?", "a": "Restore and protect the skin barrier (emollients/moisturisers); reduce inflammation (topical corticosteroids/other anti-inflammatory agents); treat microbial involvement when present (antibacterial, antifungal or antiviral therapy); relieve symptoms such as pruritus (antipruritic measures, antihistamines in selected conditions)."}, {"q": "What is a topical calcineurin inhibitor, when is it preferred over a topical corticosteroid, and give two examples.", "a": "Tacrolimus and pimecrolimus reduce T-cell activation and cytokine release without causing skin thinning, making them preferred for sensitive sites such as the face and flexures, or where steroid-sparing is needed."}, {"q": "Describe the stepwise management of atopic dermatitis from mild to severe/refractory disease.", "a": "Basic care (all patients): liberal emollients, soap-free cleansers, trigger avoidance. Mild: low-to-moderate potency topical corticosteroid or a topical calcineurin inhibitor for face/flexures. Moderate: moderate-to-potent TCS; calcineurin inhibitor or PDE-4 inhibitor (crisaborole) as steroid-sparing options; proactive twice-weekly therapy. Severe/refractory: phototherapy; systemic agents - dupilumab (anti-IL-4/IL-13), JAK inhibitors (abrocitinib, upadacitinib), or traditional immunosuppressants (ciclosporin, methotrexate)."}, {"q": "What is the single most important step in managing contact dermatitis?", "a": "Identify and avoid the causative irritant or allergen - this is the most important step, followed by emollients and topical corticosteroids to control inflammation."}, {"q": "How is severe/widespread allergic contact dermatitis managed?", "a": "A short course of an oral corticosteroid (e.g. prednisolone), continuing topical corticosteroid plus emollients, gradually reducing/stopping the systemic corticosteroid as directed, identifying and avoiding the allergen, and patch testing if the cause is unclear or recurrent."}, {"q": "What are the three treatment pillars for seborrhoeic dermatitis, with an example agent for each?", "a": "Antifungal (reduces Malassezia, e.g. ketoconazole or ciclopirox); anti-inflammatory (calms the immune response, e.g. a topical corticosteroid or calcineurin inhibitor); barrier and microbiome support (restores skin integrity, e.g. an emollient)."}, {"q": "Why is a vitamin D analogue often combined with a topical corticosteroid in psoriasis, e.g. calcipotriol plus betamethasone?", "a": "The vitamin D analogue slows keratinocyte proliferation while the corticosteroid reduces inflammation - the combination is more convenient and effective than either alone, and may reduce steroid-related side effects of monotherapy."}, {"q": "Outline the three-step (stepwise) approach to psoriasis management.", "a": "Step 1: topical therapy (first-line for mild-moderate disease, e.g. corticosteroids, vitamin D analogues, combination products). Step 2: phototherapy (narrowband UVB most common, also PUVA) for moderate-severe disease or when topicals are insufficient. Step 3: systemic therapy (traditional oral agents - methotrexate, ciclosporin, acitretin; targeted oral small molecules - apremilast, deucravacitinib; biologics - TNF-alpha, IL-17, IL-23 or IL-12/23 inhibitors) for moderate-severe or refractory disease."}, {"q": "Why should antibiotics never be used as monotherapy for acne, and what should they always be combined with?", "a": "Antibiotic monotherapy promotes resistance in C. acnes. They should always be combined with benzoyl peroxide, which kills C. acnes via free oxygen radicals and helps reduce resistance development."}, {"q": "Outline the stepwise management of acne vulgaris by severity.", "a": "Mild: topical retinoid + benzoyl peroxide (fixed-combination preferred). Moderate: topical retinoid + BPO ± topical antibiotic, or + oral antibiotic (limited duration). Severe/nodulocystic/scarring: oral isotretinoin (dermatologist-supervised), or oral antibiotic + topical retinoid + BPO while awaiting specialist review. Maintenance: continue topical retinoid ± BPO after clearance."}, {"q": "Describe the stepwise management of acute urticaria and chronic spontaneous urticaria.", "a": "Acute: non-sedating H1-antihistamine at standard dose; if needed, increase dose or add a sedating antihistamine at night; short oral corticosteroid course only if severe. Chronic spontaneous urticaria: high-dose second-generation H1-antihistamine (up to 4x standard dose); add montelukast or switch antihistamine if incomplete response; refer for specialist therapy (omalizumab or ciclosporin) if still uncontrolled."}, {"q": "What must be screened for before starting a biologic for psoriasis, and why?", "a": "Infection screening, especially for tuberculosis, because biologics (e.g. TNF-alpha inhibitors) increase infection risk and can allow reactivation of latent TB."}, {"q": "What monitoring is required for methotrexate used in psoriasis, and what precaution applies before conception?", "a": "Monitor full blood count and liver function. Methotrexate is teratogenic, so it must be stopped at least 3 months before conception."}], "mcq": [{"q": "Which drug class is preferred over topical corticosteroids for atopic dermatitis on the eyelids or face, to avoid skin-thinning risk?", "opts": [{"k": "a", "t": "Topical retinoids"}, {"k": "b", "t": "Topical calcineurin inhibitors (e.g. tacrolimus)"}, {"k": "c", "t": "Oral corticosteroids"}, {"k": "d", "t": "Benzoyl peroxide"}, {"k": "e", "t": "Vitamin D analogues"}], "ans": "b", "ansText": "b) Topical calcineurin inhibitors (e.g. tacrolimus)"}, {"q": "Which biologic used in severe atopic dermatitis blocks IL-4 receptor alpha, inhibiting IL-4 and IL-13 signalling?", "opts": [{"k": "a", "t": "Ustekinumab"}, {"k": "b", "t": "Dupilumab"}, {"k": "c", "t": "Infliximab"}, {"k": "d", "t": "Omalizumab"}, {"k": "e", "t": "Secukinumab"}], "ans": "b", "ansText": "b) Dupilumab"}, {"q": "The single most important step in managing contact dermatitis is:", "opts": [{"k": "a", "t": "Starting long-term oral corticosteroids"}, {"k": "b", "t": "Identifying and avoiding the causative irritant or allergen"}, {"k": "c", "t": "Beginning phototherapy"}, {"k": "d", "t": "Prescribing an oral antibiotic"}, {"k": "e", "t": "Starting a biologic"}], "ans": "b", "ansText": "b) Identifying and avoiding the causative irritant or allergen"}, {"q": "Which combination is commonly used in moderate plaque psoriasis, pairing a vitamin D analogue with a topical corticosteroid?", "opts": [{"k": "a", "t": "Tacrolimus + hydrocortisone"}, {"k": "b", "t": "Calcipotriol + betamethasone"}, {"k": "c", "t": "Adapalene + clindamycin"}, {"k": "d", "t": "Ketoconazole + betamethasone"}, {"k": "e", "t": "Salicylic acid + coal tar"}], "ans": "b", "ansText": "b) Calcipotriol + betamethasone"}, {"q": "Why must topical or oral antibiotics never be used as monotherapy for acne?", "opts": [{"k": "a", "t": "They cause photosensitivity"}, {"k": "b", "t": "They promote antibiotic resistance in C. acnes unless combined with benzoyl peroxide"}, {"k": "c", "t": "They are ineffective against inflammation"}, {"k": "d", "t": "They cause teratogenicity"}, {"k": "e", "t": "They interact with retinoids"}], "ans": "b", "ansText": "b) They promote antibiotic resistance in C. acnes unless combined with benzoyl peroxide"}, {"q": "Which oral agent is reserved for severe, nodulocystic or scarring acne under dermatologist supervision?", "opts": [{"k": "a", "t": "Doxycycline"}, {"k": "b", "t": "Isotretinoin"}, {"k": "c", "t": "Spironolactone"}, {"k": "d", "t": "Azelaic acid"}, {"k": "e", "t": "Clindamycin"}], "ans": "b", "ansText": "b) Isotretinoin"}, {"q": "For chronic spontaneous urticaria with incomplete response to standard-dose second-generation antihistamine, the recommended next step is:", "opts": [{"k": "a", "t": "Switch to a first-generation antihistamine only"}, {"k": "b", "t": "Increase the antihistamine dose up to 4x standard, or add montelukast"}, {"k": "c", "t": "Start a biologic immediately"}, {"k": "d", "t": "Stop all therapy"}, {"k": "e", "t": "Begin long-term oral corticosteroids"}], "ans": "b", "ansText": "b) Increase the antihistamine dose up to 4x standard, or add montelukast"}, {"q": "Which treatment is reserved for refractory chronic spontaneous urticaria uncontrolled on high-dose antihistamines?", "opts": [{"k": "a", "t": "Topical corticosteroids"}, {"k": "b", "t": "Omalizumab or ciclosporin"}, {"k": "c", "t": "Benzoyl peroxide"}, {"k": "d", "t": "Vitamin D analogues"}, {"k": "e", "t": "Oral isotretinoin"}], "ans": "b", "ansText": "b) Omalizumab or ciclosporin"}, {"q": "Before starting a biologic for moderate-severe psoriasis, patients should be screened for:", "opts": [{"k": "a", "t": "Diabetes"}, {"k": "b", "t": "Latent tuberculosis and other infection risk"}, {"k": "c", "t": "Osteoporosis"}, {"k": "d", "t": "Iron deficiency"}, {"k": "e", "t": "Hypothyroidism"}], "ans": "b", "ansText": "b) Latent tuberculosis and other infection risk"}, {"q": "Methotrexate for psoriasis requires monitoring of which parameters, and what precaution applies before conception?", "opts": [{"k": "a", "t": "Renal function only; no precaution needed"}, {"k": "b", "t": "FBC and liver function; must be stopped at least 3 months before conception"}, {"k": "c", "t": "Blood glucose only; safe throughout pregnancy"}, {"k": "d", "t": "Thyroid function only; no precaution needed"}, {"k": "e", "t": "ECG only; stop 1 month before conception"}], "ans": "b", "ansText": "b) FBC and liver function; must be stopped at least 3 months before conception"}], "saq": [{"title": "Atopic Dermatitis Treatment (10 marks)", "marks": 10, "prompt": "1. Outline the key pathophysiological features of atopic dermatitis. (2 marks) 2. Explain the mechanisms of action and clinical roles of three different treatment classes used to manage atopic dermatitis. (6 marks) 3. Explain how treatment selection changes according to disease severity or response. (2 marks)", "points": ["Pathophysiology (2 marks): skin barrier dysfunction (e.g. FLG mutation, environmental triggers) increases transepidermal water loss and allergen penetration, triggering immune dysregulation and cytokine-driven inflammation and itch; the itch-scratch cycle further damages the barrier.", "Treatment class 1 - emollients (2 marks): restore and support the impaired skin barrier; used as basic care in all patients, liberally and frequently.", "Treatment class 2 - topical corticosteroids (2 marks): bind intracellular glucocorticoid receptors, altering gene transcription to suppress pro-inflammatory cytokine production; used for flares, low-to-moderate potency for mild disease, moderate-to-potent for moderate disease.", "Treatment class 3 - topical calcineurin inhibitors or systemic agents (2 marks): tacrolimus/pimecrolimus reduce T-cell activation and cytokine release without skin thinning, useful on the face/flexures; for severe/refractory disease, dupilumab (anti-IL-4/IL-13) or JAK inhibitors block cytokine signalling systemically.", "Severity-based selection (2 marks): basic care and low-potency TCS for mild disease; moderate-to-potent TCS or steroid-sparing agents for moderate disease; phototherapy or systemic immunosuppressants/biologics for severe or refractory disease unresponsive to topical therapy."], "note": ""}, {"title": "Psoriasis Treatment (10 marks)", "marks": 10, "prompt": "1. Outline the key pathophysiological features of psoriasis. (2 marks) 2. Explain the mechanisms of action and clinical roles of three different treatment classes used to manage psoriasis. (6 marks) 3. Explain how treatment selection changes according to disease severity or response. (2 marks)", "points": ["Pathophysiology (2 marks): dendritic-cell IL-23 activates Th17 cells, which release IL-17 and IL-22, driving rapid keratinocyte proliferation (turnover falls from ~28 days to 3-4 days), producing thickened epidermis and silvery scale.", "Treatment class 1 - topical corticosteroids/vitamin D analogues (2 marks): corticosteroids reduce inflammation; vitamin D analogues (e.g. calcipotriol) slow keratinocyte proliferation; often combined (calcipotriol + betamethasone) for convenience and effect.", "Treatment class 2 - phototherapy (2 marks): narrowband UVB (most common) or PUVA slows epidermal proliferation and reduces inflammation; used for moderate-severe disease or when topicals are insufficient; long-term risk of skin ageing and skin cancer.", "Treatment class 3 - systemic/biologic therapy (2 marks): methotrexate (anti-proliferative and anti-inflammatory, monitor FBC/LFTs); biologics such as TNF-alpha, IL-17 or IL-23 inhibitors target specific inflammatory pathways for moderate-severe or refractory disease, but require infection (especially TB) screening first.", "Severity-based selection (2 marks): topical therapy first-line for mild-moderate disease; phototherapy added for moderate-severe disease or topical failure; systemic/biologic therapy reserved for moderate-severe or refractory disease, chosen partly on previous response and patient factors."], "note": ""}, {"title": "Comparing Treatment Approaches Across Inflammatory Skin Conditions (10 marks)", "marks": 10, "prompt": "Compare the treatment approach for atopic dermatitis, contact dermatitis and urticaria, highlighting one key mechanism-based therapy for each and explaining why the approaches differ.", "points": ["Atopic dermatitis (3 marks): impaired barrier plus chronic T-cell/cytokine-driven inflammation - managed with emollients to restore the barrier, topical corticosteroids/calcineurin inhibitors to reduce inflammation, and biologics/JAK inhibitors targeting specific cytokines in severe disease.", "Contact dermatitis (3 marks): an acute reaction to a specific external trigger (irritant or Type IV allergic) - the priority is identifying and avoiding the trigger, with topical corticosteroids and emollients used to settle the resulting inflammation rather than as the primary intervention.", "Urticaria (3 marks): mast-cell/histamine-mediated hypersensitivity - managed with H1-antihistamines targeting the histamine receptor directly, escalating dose before adding montelukast or specialist therapy (omalizumab/ciclosporin) in refractory chronic disease.", "Why they differ (1 mark): treatment targets the dominant driver in each condition - barrier/chronic immune dysregulation in AD, trigger avoidance in contact dermatitis, and a single mediator (histamine) in urticaria, so mechanism-matched therapy differs even though all three are 'inflammatory skin conditions'."], "note": ""}], "case": []}];

  it._t = it.type==='fc' ? d.q+' '+d.a
        : it.type==='mcq' ? d.q+' '+d.opts.map(o=>o.t).join(' ')+' '+d.ansText
        : d.title+' '+d.prompt+' '+d.points.join(' ')+' '+(d.note||'');
  it._disp=it._t.replace(/\s+/g,' ').trim();
  it._t=it._disp.toLowerCase();
  it.head = it.type==='fc'?d.q : it.type==='mcq'?d.q : d.title;
});

/* ---------- persistence ---------- */
const KEY='phar222.qbank.v1';
let store={marks:{},star:{},runs:[]};
let storageOK=true;
try{
  const raw=localStorage.getItem(KEY);
  if(raw) store=Object.assign(store,JSON.parse(raw));
  localStorage.setItem(KEY+'.probe','1'); localStorage.removeItem(KEY+'.probe');
}catch(e){
  storageOK=false;
  document.body.insertAdjacentHTML('afterbegin','<div class="warnbar">Your browser is blocking local storage for this file, so progress will reset when you close the tab. Everything else works normally.</div>');
}
function save(){ if(!storageOK)return; try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){storageOK=false} }
const markOf=id=>store.marks[id];
function setMark(id,v){ if(v===null) delete store.marks[id]; else store.marks[id]=v; save(); paintSpectrum(); }
function toggleStar(id){ if(store.star[id]) delete store.star[id]; else store.star[id]=1; save(); }

/* ---------- filter state ---------- */
const state={mode:'home',lecs:new Set(),starOnly:false,weakOnly:false,idx:0,flip:false,answered:null,revealed:false,exam:null};

function pool(types){
  return ITEMS.filter(it=>{
    if(types && !types.includes(it.type)) return false;
    if(state.lecs.size && !state.lecs.has(it.lec)) return false;
    if(state.starOnly && !store.star[it.id]) return false;
    if(state.weakOnly && markOf(it.id)===1) return false;
    return true;
  });
}

/* ---------- masthead / spectrum ---------- */
function lecStats(n){
  const all=ITEMS.filter(i=>i.lec===n);
  const done=all.filter(i=>markOf(i.id)===1).length;
  return {total:all.length,done,pct:all.length?Math.round(done/all.length*100):0};
}
function paintSpectrum(){
  const el=$('#spectrum');
  el.innerHTML=BANK.map(L=>{
    const s=lecStats(L.n);
    const on=state.lecs.has(L.n);
    return `<button class="seg ${on?'on':''}" data-lec="${L.n}" style="--lc:${colorOf(L.n)}"
      aria-pressed="${on}" aria-label="Lecture ${L.n}: ${esc(L.title)}, ${s.pct}% marked known">
      <span class="tip"><b>L${L.n} · ${esc(L.title)}</b><i>${s.done}/${s.total} known · click to filter</i></span>
      <span class="track"><span class="fill" style="height:${s.pct}%"></span><span class="rule"></span></span>
      <span class="num">${L.n}</span></button>`;
  }).join('');
  const tot=ITEMS.length, done=ITEMS.filter(i=>markOf(i.id)===1).length;
  $('#subline').textContent=`${tot} questions · ${BANK.length} lectures · ${done} marked known`;
  document.documentElement.style.setProperty('--pct',(tot?Math.round(done/tot*100):0)+'%');
}
$('#spectrum').addEventListener('click',e=>{
  const b=e.target.closest('[data-lec]'); if(!b)return;
  const n=+b.dataset.lec;
  state.lecs.has(n)?state.lecs.delete(n):state.lecs.add(n);
  state.idx=0; resetItemState(); paintSpectrum(); paintToolbar(); render();
});

/* ---------- toolbar ---------- */
const MODES=[
  {k:'home', label:'Home'},
  {k:'fc',   label:'Flashcards', types:['fc']},
  {k:'mcq',  label:'Quiz',       types:['mcq']},
  {k:'wr',   label:'Written',    types:['saq','case']},
  {k:'exam', label:'Mixed exam'}
];
function paintToolbar(){
  $('#modes').innerHTML=MODES.map(m=>{
    const n=m.types?pool(m.types).length:'';
    return `<button class="mode ${state.mode===m.k?'on':''}" data-mode="${m.k}">${m.label}${n!==''?`<span class="n">${n}</span>`:''}</button>`;
  }).join('');
  $('#tStar').classList.toggle('on',state.starOnly);
  $('#tStar').classList.toggle('starred',state.starOnly);
  $('#tStar').textContent=(state.starOnly?'★':'☆')+' Starred';
  $('#tWeak').classList.toggle('on',state.weakOnly);
  const parts=[];
  if(state.lecs.size) parts.push(`${state.lecs.size} lecture${state.lecs.size>1?'s':''}`);
  if(state.starOnly) parts.push('starred');
  if(state.weakOnly) parts.push('not yet known');
  $('#filtnote').textContent=parts.length?'Filtered to '+parts.join(' · '):'';
  $('#clearFilt').hidden=!parts.length;
}
$('#modes').addEventListener('click',e=>{
  const b=e.target.closest('[data-mode]'); if(!b)return;
  setMode(b.dataset.mode);
});
function setMode(k){ state.mode=k; state.idx=0; state.exam=null; resetItemState(); paintToolbar(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('#tStar').onclick=()=>{state.starOnly=!state.starOnly;state.idx=0;resetItemState();paintToolbar();render()};
$('#tWeak').onclick=()=>{state.weakOnly=!state.weakOnly;state.idx=0;resetItemState();paintToolbar();render()};
$('#clearFilt').onclick=()=>{state.lecs.clear();state.starOnly=false;state.weakOnly=false;state.idx=0;resetItemState();paintSpectrum();paintToolbar();render()};
function resetItemState(){state.flip=false;state.answered=null;state.revealed=false}

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

/* ==================================================================
   RENDER
   ================================================================== */
const stage=$('#stage');
function render(){
  if(state.mode==='home') return renderHome();
  if(state.mode==='exam') return renderExam();
  const types=MODES.find(m=>m.k===state.mode).types;
  const list=pool(types);
  if(!list.length) return renderEmpty();
  if(state.idx>=list.length) state.idx=0;
  const it=list[state.idx];
  stage.innerHTML=`<div class="fadein">${itemShell(it,list)}</div>`;
  wireItem(it);
}
function renderEmpty(){
  stage.innerHTML=`<div class="empty fadein">
    <h3>Nothing matches those filters</h3>
    <p>You have filtered this mode down to zero questions. Clear a filter to bring some back.</p>
    <button class="btn primary" onclick="document.getElementById('clearFilt').click()">Clear filters</button></div>`;
}

/* ---------- shared item chrome ---------- */
function metaBar(it,total){
  const s=lecStats(it.lec);
  return `<div class="qmeta" style="--lc:${colorOf(it.lec)}">
    <span class="ltag"><span class="dot"></span>L${it.lec} · ${esc(it.lecTitle)}</span>
    <span class="tt">${TYPE[it.type].short}</span>
    <div class="gap"></div>
    <span class="counter">${state.idx+1} / ${total}</span></div>`;
}
function actionBar(it,marked){
  const st=store.star[it.id];
  return `<div class="actions">
    <button class="btn icon" data-act="prev" title="Previous">←</button>
    <button class="btn icon" data-act="next" title="Next">→</button>
    <button class="btn icon ${st?'starred':''}" data-act="star" title="Star this question">${st?'★':'☆'}</button>
    <button class="btn" data-act="shuffle">Shuffle</button>
    <div class="gap"></div>
    <span class="kbd" title="Keyboard: arrows move, space reveals, S stars, 1 needs work, 2 known">← → space S 1 2</span>
    <button class="btn miss ${marked===0?'on':''}" data-act="miss">Needs work</button>
    <button class="btn got ${marked===1?'on':''}" data-act="got">I know this</button>
  </div>`;
}
function progLine(it,list){
  const known=list.filter(x=>markOf(x.id)===1).length;
  return `<div class="progline" style="--lc:${colorOf(it.lec)}"><i style="width:${list.length?known/list.length*100:0}%"></i></div>`;
}

function itemShell(it,list){
  const body = it.type==='fc'?fcBody(it) : it.type==='mcq'?mcqBody(it) : writtenBody(it);
  return metaBar(it,list.length)+body+actionBar(it,markOf(it.id))+progLine(it,list);
}

/* ---------- flashcard ---------- */
function fcBody(it){
  return `<div class="stagecard"><div class="fcard ${state.flip?'flip':''}" id="fcard" tabindex="0" role="button" aria-label="Flashcard, activate to flip">
    <div class="face front" style="--lc:${colorOf(it.lec)}">
      <span class="flabel">Question</span>
      <div class="qtext">${esc(it.d.q)}</div>
      <span class="tap">Click, or press <span class="kbd">space</span>, to reveal</span>
    </div>
    <div class="face back" style="--lc:${colorOf(it.lec)}">
      <span class="flabel">Answer</span>
      <div class="atext">${esc(it.d.a)}</div>
      <span class="tap">Click to flip back</span>
    </div>
  </div></div>`;
}

/* ---------- MCQ ---------- */
function mcqBody(it){
  const picked=state.answered;
  const opts=it.d.opts.map(o=>{
    let cls='';
    if(picked){
      if(o.k===it.d.ans) cls='correct';
      else if(o.k===picked) cls='wrong';
    }
    return `<button class="opt ${cls}" data-opt="${o.k}" ${picked?'disabled':''}>
      <span class="k">${o.k}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  let verdict='';
  if(picked){
    const right=picked===it.d.ans;
    verdict=`<div class="verdict ${right?'ok':'no'}">
      <b>${right?'Correct.':'Not quite.'}</b>
      <span>${right?'':'The answer is '+esc(it.d.ansText)+'.'}</span></div>`;
  }
  return `<div class="qcard" style="--lc:${colorOf(it.lec)}">
    <h3 class="qstem">${esc(it.d.q)}</h3>
    <div class="opts">${opts}</div>${verdict}</div>`;
}

/* ---------- written ---------- */
function writtenBody(it){
  const d=it.d;
  const title=d.title.replace(/\s*\(\d+\s*marks?\)/,'').replace(/^\s*[—-]\s*/,'').trim();
  const model=state.revealed?`<div class="model">
      <h4>Model answer · ${d.points.length} points</h4>
      <ul>${d.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      ${d.note?`<div class="wnote">${esc(d.note)}</div>`:''}
    </div>`:`<button class="btn primary" data-act="reveal" style="margin-top:6px">Reveal model answer</button>`;
  return `<div class="wcard" style="--lc:${colorOf(it.lec)}">
    <div class="marks">${d.marks?d.marks+' marks':TYPE[it.type].label}</div>
    <h3 class="wtitle">${esc(title||TYPE[it.type].label)}</h3>
    <div class="prompt">${esc(d.prompt)}</div>
    ${model}</div>`;
}

/* ---------- wiring ---------- */
function wireItem(it){
  const card=$('#fcard');
  if(card){
    const flip=()=>{state.flip=!state.flip;card.classList.toggle('flip',state.flip)};
    card.onclick=flip;
    card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  }
}
/* one persistent delegated listener; the current item is looked up at click time */
stage.addEventListener('click',e=>{
  if(state.mode==='home'||state.mode==='exam') return;
  const b=e.target.closest('[data-act]'); if(!b) return;
  const types=MODES.find(m=>m.k===state.mode).types;
  const list=pool(types); if(!list.length) return;
  const it=list[Math.min(state.idx,list.length-1)];
  const act=b.dataset.act;
  if(act==='next') step(1,list);
  else if(act==='prev') step(-1,list);
  else if(act==='star'){toggleStar(it.id); render(); toast(store.star[it.id]?'Starred':'Unstarred')}
  else if(act==='shuffle'){state.idx=Math.floor(Math.random()*list.length); resetItemState(); render()}
  else if(act==='reveal'){state.revealed=true; render()}
  else if(act==='got'){setMark(it.id,1); toast('Marked as known'); step(1,list)}
  else if(act==='miss'){setMark(it.id,0); toast('Flagged for review'); step(1,list)}
});
stage.addEventListener('click',e=>{
  if(state.mode!=='mcq') return;
  const b=e.target.closest('[data-opt]'); if(!b||b.disabled) return;
  const list=pool(['mcq']); const it=list[Math.min(state.idx,list.length-1)];
  state.answered=b.dataset.opt;
  setMark(it.id, state.answered===it.d.ans ? 1 : 0);
  render();
});
function step(dir,list){
  state.idx=(state.idx+dir+list.length)%list.length;
  resetItemState(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ==================================================================
   HOME
   ================================================================== */
const ICONS={
  fc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  mcq:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M4 12h16M4 17h9"/><circle cx="19" cy="17" r="2.5"/></svg>',
  wr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h16"/><path d="M14.5 4.5a2.1 2.1 0 0 1 3 3L9 16l-4 1 1-4z"/></svg>',
  exam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>'
};
function renderHome(){
  const tot=ITEMS.length;
  const known=ITEMS.filter(i=>markOf(i.id)===1).length;
  const weak=ITEMS.filter(i=>markOf(i.id)===0).length;
  const starred=Object.keys(store.star).length;
  const counts=t=>ITEMS.filter(i=>i.type===t).length;

  const cards=[
    ['fc','Flashcards',`${counts('fc')} cards. Flip, then tell it whether you knew the answer.`,'--c5'],
    ['mcq','Quiz',`${counts('mcq')} multiple choice. Marked instantly, right or wrong.`,'--c8'],
    ['wr','Written',`${counts('saq')+counts('case')} short answers and cases. Reveal the model answer and mark yourself.`,'--c10'],
    ['exam','Mixed exam','A random draw across every question type. Sit it timed or untimed.','--c1']
  ].map(([k,t,p,c])=>`<button class="startcard" data-mode="${k}" style="--tc:var(${c})">
      <div class="ic">${ICONS[k]}</div><h4>${t}</h4><p>${p}</p></button>`).join('');

  const rows=BANK.map(L=>{
    const s=lecStats(L.n);
    return `<button class="lecrow" data-lec-go="${L.n}" style="--lc:${colorOf(L.n)}">
      <span class="lnum">L${L.n}</span>
      <span class="lname">${esc(L.title)}</span>
      <span class="lecbar"><i style="width:${s.pct}%"></i></span>
      <span class="lcount">${s.done}/${s.total}</span></button>`;
  }).join('');

  const lastRuns=(store.runs||[]).slice(-3).reverse().map(r=>
    `<div class="brow" style="--lc:var(--c8)"><span class="bn">${r.mode}</span>
     <span class="bt">${r.date}</span>
     <span class="bb"><i style="width:${Math.round(r.score/r.total*100)}%"></i></span>
     <span class="bs">${r.score}/${r.total}</span></div>`).join('');

  stage.innerHTML=`<div class="fadein">
    <section class="hero">
      <div class="eyebrow">University of New England · Semester revision</div>
      <h2>Every PHAR222 question, in one place.</h2>
      <p>All ${tot} questions from the practice bank, sorted by lecture and ready to drill. The bar above is your syllabus: each stripe is one lecture, filling as you mark questions known. Click any stripe to work on just that lecture.</p>
      <div class="bigstats">
        <div class="bigstat"><b>${known}</b><span>Known</span></div>
        <div class="bigstat"><b>${weak}</b><span>Needs work</span></div>
        <div class="bigstat"><b>${starred}</b><span>Starred</span></div>
        <div class="bigstat"><b>${tot-known-weak}</b><span>Not seen</span></div>
      </div>
    </section>
    <div class="startgrid">${cards}</div>
    ${lastRuns?`<div class="sectitle">Recent exam runs</div><div class="breakdown">${lastRuns}</div>`:''}
    <div class="sectitle">Jump to a lecture</div>

    ${known||weak?`<div class="sectitle">Progress</div>
      <p style="color:var(--ink2);font-size:14px;max-width:56ch">Marks are saved in this browser${storageOK?'':' (currently unavailable)'}. <button class="linkbtn" id="resetAll">Reset all progress</button></p>`:''}
  </div>`;

  $$('[data-mode]',stage).forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  $$('[data-lec-go]',stage).forEach(b=>b.onclick=()=>{

}

/* ==================================================================
   MIXED EXAM
   ================================================================== */
function renderExam(){
  const e=state.exam;
  if(!e) return renderExamSetup();
  if(e.done) return renderExamResult();
  const it=e.items[e.i];
  const body = it.type==='fc'?fcBody(it) : it.type==='mcq'?mcqBody(it) : writtenBody(it);
  const scored=e.answers.filter(a=>a!==null).length;
  stage.innerHTML=`<div class="fadein">
    <div class="qmeta" style="--lc:${colorOf(it.lec)}">
      <span class="ltag"><span class="dot"></span>L${it.lec}</span>
      <span class="tt">${TYPE[it.type].short}</span>
      <div class="gap"></div>
      <span class="counter">Question ${e.i+1} of ${e.items.length} · ${scored} answered</span>
    </div>
    ${body}
    <div class="actions">
      <button class="btn icon" data-x="prev" ${e.i===0?'disabled':''}>←</button>
      <div class="gap"></div>
      ${it.type==='mcq'
        ? `<button class="btn primary" data-x="next" ${state.answered?'':'disabled'}>${e.i===e.items.length-1?'Finish':'Next question'}</button>`
        : `<button class="btn miss" data-x="mark0">Missed it</button>
           <button class="btn got" data-x="mark1">Got it</button>`}
    </div>
    <div class="progline" style="--lc:${colorOf(it.lec)}"><i style="width:${(e.i)/e.items.length*100}%"></i></div>
  </div>`;

  const card=$('#fcard');
  if(card) card.onclick=()=>{state.flip=!state.flip;card.classList.toggle('flip',state.flip)};
  $$('[data-opt]').forEach(b=>b.onclick=()=>{
    state.answered=b.dataset.opt;
    const right=state.answered===it.d.ans;
    e.picks[e.i]=state.answered;
    e.answers[e.i]=right?1:0; setMark(it.id,right?1:0);
    renderExam();
  });
  $$('[data-x]').forEach(b=>b.onclick=()=>{
    const x=b.dataset.x;
    if(x==='prev'){e.i--;loadExamAnswer();renderExam();return}
    if(x==='mark0'||x==='mark1'){const v=x==='mark1'?1:0;e.answers[e.i]=v;setMark(it.id,v)}
    if(x==='reveal'){state.revealed=true;renderExam();return}
    advanceExam();
  });
  const rv=$('[data-act="reveal"]');
  if(rv) rv.onclick=()=>{state.revealed=true;renderExam()};
}
function loadExamAnswer(){
  resetItemState();
  const e=state.exam, it=e.items[e.i];
  if(it.type==='mcq' && e.picks[e.i]) state.answered=e.picks[e.i];
}
function advanceExam(){
  const e=state.exam;
  if(e.i>=e.items.length-1){
    e.done=true;
    const score=e.answers.filter(a=>a===1).length;
    store.runs=(store.runs||[]).concat([{mode:'MIX',date:new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short'}),score,total:e.items.length}]).slice(-12);
    save();
  } else { e.i++; }
  resetItemState(); renderExam();
}
function renderExamSetup(){
  const avail=pool(null).length;
  const opts=[10,20,40].filter(n=>n<=avail);
  stage.innerHTML=`<div class="fadein">
    <div class="eyebrow">Mixed exam</div>
    <h2 class="h1">Draw a random paper.</h2>
    <p class="lede">Pulls a random mix of flashcards, MCQs, short answers and cases from whatever you have filtered to. Multiple choice is marked for you; for the written questions you reveal the model answer and mark yourself.</p>
    <div class="startgrid">
      ${opts.map((n,i)=>`<button class="startcard" data-len="${n}" style="--tc:var(--c${[1,8,10][i]||8})">
        <div class="ic">${ICONS.exam}</div><h4>${n} questions</h4><p>A ${n<15?'quick warm-up':n<30?'solid session':'full sitting'} drawn at random.</p></button>`).join('')}
      <button class="startcard" data-len="${avail}" style="--tc:var(--c5)">
        <div class="ic">${ICONS.exam}</div><h4>Everything (${avail})</h4><p>Every question in the current filter, shuffled.</p></button>
    </div>
    <p class="filtnote">${avail} questions available with your current filters.</p>
  </div>`;
  $$('[data-len]',stage).forEach(b=>b.onclick=()=>{
    const n=+b.dataset.len;
    const shuffled=pool(null).slice().sort(()=>Math.random()-.5).slice(0,n);
    state.exam={items:shuffled,i:0,answers:new Array(shuffled.length).fill(null),picks:new Array(shuffled.length).fill(null),done:false};
    resetItemState(); renderExam(); window.scrollTo({top:0,behavior:'smooth'});
  });
}
function renderExamResult(){
  const e=state.exam;
  const score=e.answers.filter(a=>a===1).length;
  const pct=Math.round(score/e.items.length*100);
  const byLec={};
  e.items.forEach((it,i)=>{
    (byLec[it.lec]??={got:0,n:0});
    byLec[it.lec].n++; if(e.answers[i]===1) byLec[it.lec].got++;
  });
  const rows=Object.keys(byLec).sort((a,b)=>a-b).map(n=>{
    const b=byLec[n], p=Math.round(b.got/b.n*100);
    return `<div class="brow" style="--lc:${colorOf(n)}">
      <span class="bn">L${n}</span><span class="bt">${esc(LEC.get(+n).title)}</span>
      <span class="bb"><i style="width:${p}%"></i></span><span class="bs">${b.got}/${b.n}</span></div>`;
  }).join('');
  const verdict = pct>=80?'Strong. Push the lectures that are still short.'
                : pct>=60?'Solid base. The breakdown below shows where to spend your next session.'
                : 'Plenty to work on. Try the weakest lecture in flashcard mode first.';
  stage.innerHTML=`<div class="fadein"><div class="result">
    <div class="eyebrow">Paper complete</div>
    <div class="scorebig">${pct}%</div>
    <p class="scoresub">${score} of ${e.items.length} marked correct. ${verdict}</p>
    <div class="breakdown">${rows}</div>
    <div class="actions" style="justify-content:center">
      <button class="btn" data-again>Draw another paper</button>
      <button class="btn primary" data-weak>Drill what I missed</button>
    </div>
  </div></div>`;
  $('[data-again]').onclick=()=>{state.exam=null;renderExam()};
  $('[data-weak]').onclick=()=>{state.weakOnly=true;state.exam=null;paintToolbar();setMode('fc')};
}

/* ==================================================================
   SEARCH
   ================================================================== */
const overlay=$('#overlay'), olist=$('#olist'), qbox=$('#q');
function hl(text,term){
  const i=text.toLowerCase().indexOf(term);
  if(i<0) return esc(text.slice(0,150));
  const a=Math.max(0,i-55), b=i+term.length;
  return (a>0?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,b))+'</mark>'+esc(text.slice(b,b+95))+(b+95<text.length?'…':'');
}
function runSearch(){
  const term=qbox.value.trim().toLowerCase();
  if(term.length<2){ overlay.classList.remove('open'); return; }
  const hits=ITEMS.filter(it=>it._t.includes(term)).slice(0,60);
  $('#ocount').textContent=`${hits.length} result${hits.length===1?'':'s'}`;
  $('#oterm').textContent=`for “${qbox.value.trim()}”`;
  olist.innerHTML = hits.length ? hits.map(it=>`
    <button class="ohit" data-go="${it.id}" style="--lc:${colorOf(it.lec)}">
      <span class="top"><span class="lchip">L${it.lec}</span><span class="tt">${TYPE[it.type].short}</span>
      <span class="t">${hl(it.head,term)}</span></span>
      <span class="s">${hl(it._disp,term)}</span></button>`).join('')
    : `<div class="empty"><h3>No matches</h3><p>Nothing in the bank contains “${esc(qbox.value.trim())}”. Try a shorter term or a drug name.</p></div>`;
  overlay.classList.add('open');
}
qbox.addEventListener('input',runSearch);
qbox.addEventListener('keydown',e=>{if(e.key==='Escape'){qbox.value='';overlay.classList.remove('open');qbox.blur()}});
overlay.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){overlay.classList.remove('open');return}
  const b=e.target.closest('[data-go]'); if(!b)return;
  const it=ITEMS.find(x=>x.id===b.dataset.go);
  overlay.classList.remove('open'); qbox.value='';
  state.lecs.clear(); state.starOnly=false; state.weakOnly=false;
  const mode = it.type==='fc'?'fc' : it.type==='mcq'?'mcq' : 'wr';
  state.mode=mode; state.exam=null; resetItemState();
  const list=pool(MODES.find(m=>m.k===mode).types);
  state.idx=Math.max(0,list.findIndex(x=>x.id===it.id));
  paintSpectrum(); paintToolbar(); render();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ==================================================================
   KEYBOARD
   ================================================================== */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='/'){e.preventDefault();qbox.focus();return}
  if(e.key==='Escape'){overlay.classList.remove('open');return}
  if(state.mode==='home') return;
  const hit=(...sels)=>{for(const s of sels){const b=$(s); if(b&&!b.disabled){b.click();return true}} return false};
  const k=e.key.toLowerCase();
  if(e.key==='ArrowRight'){e.preventDefault();hit('[data-act="next"]','[data-x="next"]')}
  else if(e.key==='ArrowLeft'){e.preventDefault();hit('[data-act="prev"]','[data-x="prev"]')}
  else if(e.key===' '){e.preventDefault();hit('#fcard','[data-act="reveal"]','[data-x="reveal"]')}
  else if(k==='s'){hit('[data-act="star"]')}
  else if(k==='g'||e.key==='2'){hit('[data-act="got"]','[data-x="mark1"]')}
  else if(k==='n'||e.key==='1'){hit('[data-act="miss"]','[data-x="mark0"]')}
  else if(/^[a-e]$/.test(k)){hit(`[data-opt="${k}"]`)}
});

/* ---------- sticky offset ---------- */
function measure(){
  const h=$('#masthead').offsetHeight;
  document.documentElement.style.setProperty('--mh-h',h+'px');
}
window.addEventListener('resize',measure);

/* ---------- boot ---------- */
paintSpectrum(); paintToolbar(); render(); measure();
setTimeout(measure,600);
</script>
</body>
</html>
